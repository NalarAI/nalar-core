name: uji

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  mutu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv dipasang lewat pip, bukan lewat aksi pihak ketiga, supaya alur ini
      # tidak ikut rusak setiap kali aksi itu berganti versi mayor.
      - name: pasang uv
        run: pip install uv

      # torch sengaja tidak dipasang. Model yang dikirim tidak memakainya, dan
      # dua uji yang memerlukannya melewati diri sendiri dengan pesan.
      - name: pasang kebutuhan
        run: uv pip install --system -e ".[api,dev]"

      - name: periksa gaya
        run: ruff check src tests scripts

      - name: periksa format
        run: ruff format --check src tests scripts

      - name: uji inti
        run: python tests/test_inti.py

      - name: uji peladen
        run: python tests/test_api.py

      # Angka yang dilayani peladen harus sama dengan angka yang dihitung
      # model. Peladen menyusun ulang, membulatkan, dan menamai ulang
      # keluarannya, dan tiap langkah itu tempat angka bisa bergeser diam diam.
      - name: uji konsistensi angka
        run: python tests/test_konsistensi.py

      # Lapisan agen. Yang paling penting di antaranya penjaga A1: tidak ada
      # satu pun angka pada berkas perkara yang tidak berasal dari alat.
      # Diukur pada enam puluh berkas tiap kali alur ini jalan.
      - name: uji lapisan agen
        run: python tests/test_agen.py

      # Tahap dua. Penutur yang dipakai bernaskah, bukan model sungguhan,
      # supaya alur ini tidak menuntut bobot terpasang di pelari. Pengukuran
      # dengan model sungguhan dijalankan tangan lewat scripts/ukur_agen.py.
      - name: uji agen berkas dan agen sanggah
        run: python tests/test_agen_dua.py

  # Menjaga agar tidak ada jejak perkakas bantu yang ikut terkirim. Ini bukan
  # soal rapi, ini soal karya yang dinilai harus jelas siapa penulisnya.
  bersih:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: periksa jejak perkakas
        run: |
          if git log --format='%s%n%b' | grep -iE 'co-authored-by:.*(claude|anthropic|copilot)'; then
            echo "ada jejak perkakas bantu di pesan commit"
            exit 1
          fi
          if git ls-files | grep -iE '^\.claude|/\.claude|^agents?/|\.mcp\.json'; then
            echo "ada berkas perkakas bantu yang terlacak"
            exit 1
          fi
          echo "bersih"
