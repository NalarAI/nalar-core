      - 'Data HIRA dipublikasikan untuk riset dalam format standar OMOP. Indonesia punya padanan awal lewat Data Sampel BPJS. Bagian 11.3.'

  taiwan:
    lembaga: 'National Health Insurance Administration'
    hal_yang_relevan: >-
      Taiwan menjalankan asuransi kesehatan tunggal dengan cakupan hampir universal
