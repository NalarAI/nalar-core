# =============================================================================
# NALAR - Rancangan Model AI Deteksi Kecurangan Klaim JKN
# Healthkathon BPJS Kesehatan 2026
# Kategori: Efisiensi Risiko pada Fasilitas Kesehatan
#
# Berkas ini adalah rancangan model. Bukan rancangan aplikasi, bukan rancangan
# antarmuka, bukan rencana bisnis. Semua yang ada di sini bermuara pada satu
# pertanyaan: model seperti apa yang harus dibangun, dan bagaimana kita tahu
# model itu berhasil atau gagal.
#
# Aturan penulisan berkas ini:
#   1. Setiap angka punya sumber, atau ditandai sebagai asumsi.
#   2. Setiap target punya aturan keputusan. Kalau tidak bisa gagal, dibuang.
#   3. Tidak ada hasil eksperimen yang ditulis sebelum eksperimen dijalankan.
#   4. Tidak ada baris pengisi. Panjang berkas mengikuti isi, bukan sebaliknya.
# =============================================================================

meta:
  nama_sistem: NALAR
  kepanjangan: Nilai Anomali Layanan dan Rekam
  versi_dokumen: '1.0-rancangan'
  tanggal_susun: '2026-09-05'
  status: >-
    Rancangan sudah sebagian diimplementasikan. Lihat bagian status_implementasi
    di akhir berkas untuk apa yang sudah berjalan, apa yang belum, dan angka
    percobaan pertama beserta target yang tidak tercapai.
  bahasa_dokumen: 'Indonesia, dengan istilah teknis dibiarkan dalam bahasa aslinya'

  cara_membaca:
    - 'Bagian 1-4 menjawab: masalahnya apa, dan kenapa AI relevan.'
    - 'Bagian 5-7 menjawab: negara lain sudah sampai mana, dan apa yang belum dipecahkan.'
    - 'Bagian 8-9 menjawab: sistemnya harus berubah apa, di luar model.'
    - 'Bagian 10 adalah inti dokumen. Arsitektur modelnya.'
    - 'Bagian 11-13 menjawab: datanya dari mana, dan bagaimana kita membuktikan modelnya bekerja.'
    - 'Bagian 14-17 adalah risiko, sumber daya, peta jalan, dan pustaka.'

  tingkat_kepercayaan:
    terverifikasi: 'Diperiksa lewat sumber daring pada 5 September 2026. URL dicantumkan.'
    dari_pustaka: 'Berasal dari literatur yang saya kenal. DOI perlu dicek ulang sebelum masuk proposal.'
    asumsi: 'Belum punya sumber. Ditulis sebagai asumsi supaya bisa dibantah.'
    keputusan: 'Pilihan desain kami. Bisa salah, dan konsekuensinya ditulis.'

  yang_sengaja_tidak_ada_di_sini:
    - hal: 'Rancangan antarmuka auditor'
      alasan: 'Diminta fokus ke model dulu. Antarmuka hanya disinggung sebagai batasan keluaran model.'
    - hal: 'Arsitektur mikroservis, Kubernetes, CI/CD'
      alasan: 'Bukan bagian yang menentukan menang atau kalah lomba ini. Ditunda ke fase hackathon.'
    - hal: 'Angka hasil evaluasi di dalam bagian 13'
      alasan: >-
        Bagian 13 tetap berisi ambang lulus dan cara mengukurnya, bukan hasil.
        Hasil percobaan yang sudah dijalankan dikumpulkan terpisah di bagian
        status_implementasi, supaya target dan hasil tidak tercampur dan supaya
        target tidak bisa disesuaikan setelah melihat hasil.
    - hal: 'Ribuan baris katalog verifikasi berpola'
      alasan: >-
        Berkas asumsi sebelumnya berisi 4.747 simpul yang isinya perulangan template
        dengan nomor berjalan. Itu menambah berat berkas tanpa menambah informasi.
        Diganti dengan katalog 20 modus yang tiap entrinya berbeda isi.

# =============================================================================
# 1. KONTEKS KOMPETISI
# =============================================================================

kompetisi:
  nama: 'BPJS Kesehatan Healthkathon 2026'
  tema: 'Detect Smarter, Protect JKN. Efisiensi Risiko Program JKN'
  tantangan_utama: 'Efisiensi Risiko pada Pelayanan Kesehatan Program JKN'
  penyelenggara: 'Direktorat Teknologi Informasi BPJS Kesehatan'
  sumber: 'Participant Guide Healthkathon 2026, 9 halaman'

  tenggat:
    registrasi: '14 Agustus 2026 sampai 14 September 2026'
    unggah_proposal: '14 Agustus 2026 sampai 19 September 2026'
    sisa_waktu_dari_hari_ini: '14 hari sampai batas unggah proposal'
    tahap_berikutnya: 'Seleksi proposal, coaching, hackathon sekitar 3 minggu, demo day, pengumuman'
    catatan: 'Tanggal setelah seleksi belum diumumkan panitia.'

  aturan_yang_mengikat_rancangan:
    - pasal: 'Butir 5.o dan bagian 12'
      isi: >-
        Dilarang memakai data peserta JKN yang nyata tanpa izin tertulis penyelenggara.
        Kalau butuh data, wajib pakai data simulasi atau data yang sudah dianonimkan.
      dampak_ke_rancangan: >-
        Ini bukan hambatan, ini penentu arsitektur. Model harus bisa dilatih tanpa
        data asli sama sekali, dan harus bisa dibuktikan bekerja tanpa data asli.
        Seluruh bagian 11 dan 13 lahir dari pasal ini.
    - pasal: 'Butir 6'
      isi: 'Satu tim memilih satu kategori. Boleh mengangkat lebih dari satu sub-modus di dalam kategori itu.'
      dampak_ke_rancangan: 'Memaksa kami memilih. Alasannya di bagian 2.'
    - pasal: 'Butir 5.e'
      isi: 'Satu tim satu sampai tiga orang.'
      dampak_ke_rancangan: >-
        Batas nyata untuk lingkup. Tiga orang tidak bisa membangun dua puluh detektor
        terpisah. Rancangan ini memaksa satu tulang punggung dipakai ulang.
    - pasal: 'Butir 5.m'
      isi: 'Karya asli, tidak melanggar hak kekayaan intelektual.'
      dampak_ke_rancangan: 'Bagian 10.12 menulis batas tegas antara kode kami dan pustaka pihak ketiga.'

  tiga_kategori_yang_ditawarkan:
    peserta:
      jumlah_modus: 4
      modus: ['Pemalsuan data identitas peserta', 'Penyalahgunaan identitas peserta', 'Pelayanan yang tidak perlu', 'Penyalahgunaan obat dan alkes']
    fasilitas_kesehatan:
      jumlah_modus: 20
      catatan: 'Daftar lengkap ada di bagian 4.'
    pemberi_kerja:
      jumlah_modus: 6
      modus: ['Pendaftaran pekerja sebagian', 'Pelaporan upah lebih rendah', 'Penggelapan setoran iuran pekerja', 'Misklasifikasi status hubungan kerja', 'Manipulasi data mutasi karyawan', 'Kolusi faskes dan surat keterangan fiktif']

# =============================================================================
# 2. KEPUTUSAN KATEGORI
# =============================================================================

keputusan_kategori:
  dipilih: 'Efisiensi Risiko pada Fasilitas Kesehatan'
  tingkat_keyakinan: keputusan

  alasan_utama:
    - poin: 'Uang terbesar ada di sini'
      penjelasan: >-
        Beban jaminan kesehatan 2025 tercatat Rp 191,33 triliun. Hampir seluruhnya
        mengalir lewat klaim fasilitas kesehatan. Kategori peserta dan pemberi kerja
        menyentuh sisi pendapatan dan penyalahgunaan hak, nilainya jauh lebih kecil.
    - poin: 'Datanya paling padat sinyal'
      penjelasan: >-
        Satu klaim FKRTL membawa diagnosis, prosedur, obat, lama rawat, kelas rawat,
        dan tarif. Enam sumbu yang bisa saling menguji. Kategori pemberi kerja hanya
        punya upah, jumlah pekerja, dan tanggal. Terlalu tipis untuk model yang belajar
        distribusi bersyarat.
    - poin: 'Kecurangannya berpola, bukan acak'
      penjelasan: >-
        Kasus 2024 di tiga rumah sakit menunjukkan 4.300 klaim fisioterapi yang hanya
        1.000 di antaranya punya catatan medis. Pola sebesar itu punya tanda tangan
        statistik. Yang acak tidak bisa dipelajari, yang berpola bisa.
    - poin: 'Sesuai judul tantangan'
      penjelasan: >-
        Tantangan utama tertulis Efisiensi Risiko pada Pelayanan Kesehatan. Kategori
        fasilitas kesehatan adalah pelayanan kesehatan itu sendiri.

  risiko_pilihan_ini:
    - risiko: 'Kategori paling ramai'
      penjelasan: >-
        Dua puluh modus dan uang terbesar akan menarik mayoritas tim. Proposal kami
        akan dibaca berdampingan dengan puluhan proposal yang mengaku mendeteksi
        kecurangan klaim.
      mitigasi: >-
        Pembeda kami bukan daftar modus yang dicakup. Pembedanya ada tiga.
        Pertama, kami tidak berpura-pura punya label. Kedua, keluaran model berupa
        selisih rupiah yang bisa dibantah rumah sakit, bukan skor buram. Ketiga,
        ada jaminan statistik pada tingkat salah tuduh. Bagian 7 menguraikan ini.
    - risiko: 'BPJS sudah punya sistem'
      penjelasan: >-
        Vidi dan Defrada sudah menjalankan logika verifikasi terstandar. Kalau model
        kami hanya mengulang aturan yang sama, tidak ada nilai tambahnya.
      mitigasi: >-
        Bagian 13 mewajibkan satu pembanding: aturan deterministik yang meniru
        pemeriksaan Vidi. Model kami harus menang di atas aturan itu, dan selisihnya
        harus dilaporkan. Kalau tidak menang, kami menulis bahwa tidak menang.

  yang_tidak_dipilih_dan_alasannya:
    peserta:
      alasan_tolak: >-
        Tiga dari empat modus di kategori ini berhenti pada verifikasi identitas, bukan
        pada analitik. Pemalsuan dan peminjaman identitas paling efektif dipecahkan
        dengan biometrik dan pengecekan silang Dukcapil. Itu masalah rekayasa sistem,
        bukan masalah model. Membangun model dari nol untuk itu adalah salah alat.
      catatan: >-
        Satu modus di kategori ini, pelayanan yang tidak perlu, sebenarnya bersinggungan
        dengan mesin kami. Tapi pelakunya biasanya faskes yang memanggil pasien berulang,
        bukan peserta. Jadi sinyalnya tetap lebih jelas dilihat dari sisi faskes.
    pemberi_kerja:
      alasan_tolak: >-
        Menarik dan jarang disentuh. Tapi data yang dibutuhkan ada di luar BPJS.
        Deteksi upah dilaporkan lebih rendah memerlukan pembanding dari pajak, dari
        BPJS Ketenagakerjaan, atau dari data upah minimum kabupaten. Tanpa akses itu
        modelnya menebak. Kami tidak mau membangun model yang bergantung pada data
        yang belum tentu ada.
      catatan: >-
        Arsitektur di bagian 10 sengaja dibuat agar bisa dipindah ke kategori ini
        tanpa menulis ulang tulang punggung. Lihat bagian 10.11.

  cakupan_modus_yang_kami_ambil:
    prinsip: >-
      Kami tidak mengambil dua puluh modus lalu membangun dua puluh detektor. Kami
      mengelompokkan dua puluh modus menjadi tiga keluarga mekanisme, lalu membangun
      satu model yang menjawab pertanyaan statistik yang sama pada tiga cakupan berbeda.
    keluarga_yang_dikerjakan: ['A', 'B', 'C']
    rinciannya: 'Bagian 4.3'

# =============================================================================
# 3. MASALAH DI INDONESIA
# =============================================================================

masalah:

  ringkasan_satu_paragraf: >-
    JKN membayar lebih banyak daripada yang diterimanya, dan selisihnya melebar tiap
    tahun. Sebagian selisih itu wajar, karena orang memang lebih banyak berobat.
    Sebagian lagi tidak wajar. Yang tidak wajar inilah yang sulit dipisahkan, karena
    volume klaim sudah jauh melampaui kemampuan orang untuk memeriksanya satu per satu,
    dan karena kecurangan yang canggih menyerupai praktik klinis yang sah.

  angka_dasar:
    - nama: 'Peserta JKN'
      nilai: '282,7 juta jiwa'
      per: 'akhir 2025'
      setara: '98,62 persen penduduk Indonesia'
      sumber: 'Public Expose BPJS Kesehatan, 2 Juli 2026'
      url: 'https://jatim.antaranews.com/berita/1078572/bpjs-kesehatan-peserta-jkn-capai-2827-juta-jiwa-hingga-akhir-2025'
      status: terverifikasi
    - nama: 'Kunjungan layanan'
      nilai: '725,3 juta kunjungan sepanjang 2025'
      setara: 'lebih dari 1,9 juta layanan per hari'
      sumber: 'Public Expose BPJS Kesehatan 2025'
      url: 'https://jateng.tribunnews.com/bisnis/1258379/program-jkn-layani-7253-juta-kunjungan-sepanjang-2025-peserta-tembus-2827-juta-jiwa'
      status: terverifikasi
      mengapa_penting: >-
        Ini angka yang mematahkan pendekatan manual. Tidak ada jumlah verifikator yang
        masuk akal untuk memeriksa 1,9 juta layanan sehari secara mendalam.
    - nama: 'Pendapatan iuran'
      nilai: 'Rp 176,72 triliun'
      per: '2025'
      sumber: 'Public Expose BPJS Kesehatan 2025'
      url: 'https://money.kompas.com/read/2026/07/02/203757426/beban-klaim-terus-naik-bpjs-kesehatan-alami-defisit-lebih-besar-pada-2025'
      status: terverifikasi
    - nama: 'Beban jaminan kesehatan'
      nilai: 'Rp 191,33 triliun'
      per: '2025'
      sumber: 'sama'
      status: terverifikasi
    - nama: 'Defisit'
      nilai: 'Rp 14,61 triliun'
      per: '2025'
      pembanding: 'Rp 10,77 triliun pada 2024'
      status: terverifikasi
    - nama: 'Proyeksi defisit DJSN'
      nilai: 'Rp 58,7 triliun pada 2026, Rp 75 triliun pada 2027 bila tanpa intervensi'
      sumber: 'Laporan DJSN, dikutip Kompas'
      url: 'https://nasional.kompas.com/read/2026/06/14/12300041/defisit-jkn--memastikan-tidak-terjadi-gagal-bayar-klaim'
      status: terverifikasi
      catatan: >-
        Proyeksi ini jauh lebih besar daripada defisit terlapor 2025. Selisihnya berasal
        dari asumsi utilisasi. Kami memakai angka terlapor untuk klaim yang perlu akurat,
        dan angka proyeksi hanya untuk menggambarkan arah.
    - nama: 'Aset neto Dana Jaminan Sosial Kesehatan'
      nilai: 'Rp 30,04 triliun, cukup untuk 1,88 bulan pembayaran klaim'
      per: 'akhir 2025'
      status: terverifikasi
      mengapa_penting: >-
        Bantalannya kurang dari dua bulan. Artinya kebocoran yang berlangsung setahun
        penuh bukan gangguan akuntansi, melainkan ancaman likuiditas.
    - nama: 'Rata-rata klaim bulanan'
      nilai: 'Rp 16,75 triliun'
      per: '2025'
      pembanding: 'lima kali lipat dibanding 2014'
      status: terverifikasi
    - nama: 'Jaringan faskes'
      nilai: '23.770 FKTP, 3.194 FKRTL, 6.190 faskes penunjang'
      per: '2025'
      status: terverifikasi
      mengapa_penting: >-
        3.194 FKRTL adalah jumlah entitas yang harus diprofilkan model. Cukup kecil
        untuk dimodelkan sebagai simpul individual, cukup besar untuk butuh
        pengelompokan sebaya otomatis.
    - nama: 'Estimasi kebocoran global'
      nilai: '3 sampai 10 persen belanja kesehatan hilang karena kecurangan'
      sumber: 'literatur internasional, dikutip berulang di tinjauan sistematis'
      status: dari_pustaka
      catatan: >-
        Angka ini sering dikutip tanpa metode yang jelas. Kami memakainya hanya sebagai
        rentang orientasi, tidak untuk menghitung dampak proposal. Bila dipakai apa
        adanya, 3 persen dari Rp 191,33 triliun setara Rp 5,7 triliun. Kami tidak
        mengklaim angka itu sebagai target penghematan.

  kasus_nyata_2024:
    ringkasan: >-
      Pada Juli 2024 KPK bersama Kemenkes dan BPJS Kesehatan mengumumkan hasil
      pemeriksaan enam rumah sakit, tiga di antaranya diproses hukum.
    rincian:
      - entitas: 'RS di Sumatera Utara'
        nilai_dugaan: 'Rp 1 miliar sampai Rp 3 miliar'
      - entitas: 'RS di Sumatera Utara'
        nilai_dugaan: 'Rp 4 miliar sampai Rp 10 miliar'
      - entitas: 'RS di Jawa Tengah'
        nilai_dugaan: 'Rp 20 miliar sampai Rp 30 miliar'
    total_dugaan: 'sekitar Rp 34 sampai 35 miliar'
    temuan_yang_paling_berguna_untuk_kami:
      - temuan: '4.300 klaim fisioterapi diajukan, hanya sekitar 1.000 punya catatan medis pendukung'
        arti_teknis: >-
          Rasio klaim terhadap bukti pendukung adalah sinyal yang bisa dihitung, asal
          bukti pendukung masuk ke dalam data klaim. Saat ini sebagian besar tidak masuk.
          Ini menjadi dasar rekomendasi perubahan sistem P2 di bagian 8.
      - temuan: '39 pasien diklaim operasi katarak, hanya 14 yang memenuhi indikasi'
        arti_teknis: >-
          Kesenjangan antara tindakan yang ditagih dan indikasi klinis yang mendukung.
          Ini persis bentuk pertanyaan yang dijawab kepala K1 pada bagian 10.7.
      - temuan: 'Ketiga kasus baru ketahuan lewat pemeriksaan lapangan gabungan, bukan lewat sistem'
        arti_teknis: >-
          Sistem yang ada berhasil menyaring klaim yang salah bentuk, bukan klaim yang
          bentuknya benar tapi isinya tidak pernah terjadi. Itu celah yang kami tuju.
    sumber:
      - 'https://www.cnnindonesia.com/nasional/20240724172141-12-1125112/kpk-usut-dugaan-kecurangan-klaim-bpjs-kesehatan-3-rumah-sakit'
      - 'https://www.cnnindonesia.com/nasional/20240724181909-12-1125147/kemenkes-ungkap-jenis-fraud-klaim-bpjs-sudah-siapkan-sanksi'
      - 'https://itjen.kemkes.go.id/index.php/berita/detail/tindaklanjut-dan-pemberian-sanksi-atas-dugaan-klaim-fiktif-di-3-rs-swasta'
    status: terverifikasi

  yang_sudah_dipunya_bpjs:
    catatan_penting: >-
      Bagian ini menentukan apakah proposal kami punya nilai tambah atau tidak.
      Kalau kami mengusulkan sesuatu yang sudah berjalan, proposal gugur sendiri.
    vclaim:
      fungsi: 'Pengajuan klaim daring dan penerbitan Surat Eligibilitas Peserta'
      sifat: 'Kanal transaksi, bukan mesin deteksi'
    vedika:
      fungsi: 'Verifikasi digital klaim'
    vidi:
      fungsi: 'Aplikasi verifikasi dengan logika terstandar untuk mendeteksi potensi kecurangan dan potensi dispute'
      sifat: 'Berbasis aturan. BPJS menyatakan aplikasi ini akan ditingkatkan kemampuan deteksinya.'
      url: 'https://www.antaranews.com/berita/1565884/cegah-fraud-pada-jkn-bpjs-kesehatan-bangun-sistem-deteksi-dini'
    unit_organisasi:
      nama: 'Unit kerja bidang Manajemen Utilisasi dan Anti Fraud'
      dasar: 'Permenkes 16/2019, Tim PK-JKN nasional sampai kabupaten kota, melibatkan Kemenkes, BPKP, KPK, BPJS Kesehatan'
    kesimpulan_kami: >-
      Yang sudah ada adalah mesin aturan dan struktur organisasi. Yang belum ada adalah
      model yang belajar seperti apa klaim yang wajar, lalu mengukur seberapa jauh satu
      klaim menyimpang dari kewajaran itu setelah bauran kasus dikendalikan. Aturan
      menangkap yang melanggar bentuk. Model menangkap yang melanggar kewajaran.
    status: terverifikasi

  rantai_kejadian:
    penjelasan: >-
      Kebocoran bukan satu peristiwa. Ia rantai. Memahami rantainya menentukan di titik
      mana model diletakkan.
    langkah:
      - urutan: 1
        peristiwa: 'Pasien datang, faskes memberi pelayanan atau mengaku memberi pelayanan'
        siapa_yang_tahu_kebenaran: 'Pasien dan tenaga medis'
        jejak_digital: 'Rekam medis di SIMRS, sebagian besar tidak dikirim ke BPJS'
      - urutan: 2
        peristiwa: 'Koder rumah sakit menerjemahkan rekam medis ke ICD-10 dan ICD-9-CM'
        titik_rawan: >-
          Di sinilah upcoding lahir. Koder memilih kode. Insentifnya searah dengan
          rumah sakit, bukan dengan BPJS.
        jejak_digital: 'Kode masuk ke berkas klaim'
      - urutan: 3
        peristiwa: 'Grouper INA-CBG memetakan kode ke satu paket tarif'
        titik_rawan: >-
          Perbedaan tarif antara severity I dan III bisa mencapai sekitar Rp 4,9 juta
          per kasus. Satu diagnosis sekunder tambahan bisa memindahkan kelompok tarif.
        sumber: 'https://medminutes.io/blog/7-langkah-optimasi-severity-level-ina-cbg/'
        status_angka: dari_pustaka
      - urutan: 4
        peristiwa: 'Klaim diajukan lewat VClaim, diverifikasi Vidi'
        titik_rawan: 'Verifikasi memeriksa kelengkapan dan konsistensi formal, bukan kebenaran klinis'
      - urutan: 5
        peristiwa: 'Klaim dibayar'
        titik_rawan: 'Setelah dibayar, uang sulit ditarik kembali. Ini alasan utama mendorong deteksi ke pra-bayar.'
      - urutan: 6
        peristiwa: 'Audit pasca klaim pada sebagian kecil sampel'
        titik_rawan: >-
          Sampelnya kecil, dan pemilihan sampelnya sendiri belum dioptimalkan.
          Di sinilah model memberi nilai paling cepat, sebelum regulasi pra-bayar siap.

  mengapa_kecurangan_lolos:
    - sebab: 'Volume melampaui kapasitas periksa'
      bukti: '725,3 juta kunjungan pada 2025'
      apakah_ai_menolong: 'Ya. Ini masalah penyaringan, dan penyaringan adalah yang paling bisa dikerjakan mesin.'
    - sebab: 'Bukti klinis tidak ikut dalam klaim'
      penjelasan: >-
        Klaim INA-CBG membawa kode dan biaya. Hasil laboratorium, resep, dan catatan
        tindakan sebagian besar tinggal di SIMRS rumah sakit.
      apakah_ai_menolong: >-
        Sebagian. Model bisa memperkirakan bukti yang seharusnya ada dari pola kode,
        tapi kekuatannya melonjak kalau bukti benar-benar dikirim. Ini dependensi,
        bukan asumsi. Ditulis sebagai P2 di bagian 8.
    - sebab: 'Tidak ada label kecurangan yang bisa dipakai melatih'
      penjelasan: >-
        Kasus 2024 menghasilkan puluhan miliar rupiah temuan dari tiga rumah sakit.
        Dibanding ratusan juta klaim per tahun, itu bukan himpunan latih.
      apakah_ai_menolong: >-
        Ya, tapi hanya dengan pendekatan yang benar. Ini alasan seluruh bagian 10
        dibangun di atas pemodelan kewajaran, bukan klasifikasi berlabel.
        Detailnya di bagian 10.5.
    - sebab: 'Modus berkembang lebih cepat daripada aturan'
      bukti: 'BPJS sendiri menyatakan praktik kecurangan makin sulit dideteksi'
      url: 'https://kesehatan.liputan6.com/info-sehat/read/7370955/bpjs-kesehatan-beberkan-praktik-fraud-yang-disebut-makin-sulit-dideteksi'
      apakah_ai_menolong: >-
        Ya, dan ini keunggulan struktural pemodelan kewajaran. Aturan hanya menangkap
        modus yang sudah dikenal. Model kewajaran menandai apa pun yang jarang,
        termasuk modus yang belum punya nama.
    - sebab: 'Menuduh faskes itu mahal secara politik dan hukum'
      penjelasan: >-
        Salah tuduh merusak hubungan dengan rumah sakit yang jujur, memicu sengketa,
        dan pada akhirnya membuat sistem deteksi dimatikan pelan-pelan.
      apakah_ai_menolong: >-
        Hanya kalau modelnya memberi jaminan pada tingkat salah tuduh dan memberi
        alasan yang bisa dibantah. Dua hal itu bukan tambahan, itu syarat.
        Bagian 10.9 dan 10.14.
    - sebab: 'Insentif fasilitas kesehatan searah dengan tagihan lebih besar'
      penjelasan: >-
        Pembayaran paket membuat rumah sakit untung dari selisih tarif dikurangi biaya.
        Menaikkan kode menaikkan tarif tanpa menaikkan biaya.
      apakah_ai_menolong: >-
        Tidak. Ini masalah desain insentif. Model hanya mengubah kemungkinan tertangkap.
        Jujur ditulis di bagian 3.7.

  batas_ai:
    catatan: >-
      Bagian ini sengaja ada. Proposal yang mengaku AI menyelesaikan segalanya lebih
      mudah dijatuhkan juri daripada proposal yang menunjukkan batasnya.
    yang_bukan_urusan_model:
      - hal: 'Memutuskan sebuah klaim curang'
        siapa: 'Auditor dan Tim PK-JKN'
        peran_model: 'Menyusun urutan prioritas dan menyodorkan alasan. Tidak memutus.'
      - hal: 'Menjatuhkan sanksi'
        siapa: 'Kemenkes dan penegak hukum, sesuai Permenkes 16/2019'
        peran_model: 'Tidak ada.'
      - hal: 'Memperbaiki insentif tarif paket'
        siapa: 'Pembuat kebijakan tarif'
        peran_model: 'Model bisa memberi bukti kelompok tarif mana yang paling sering disalahgunakan. Itu saja.'
      - hal: 'Membuktikan niat jahat'
        penjelasan: >-
          Model tidak bisa membedakan koder yang curang dari koder yang tidak terlatih.
          Keduanya menghasilkan pola yang sama. Yang bisa dilaporkan model adalah
          selisih rupiah dan seberapa jarang pola itu terjadi.
        konsekuensi_desain: >-
          Karena itu keluaran model tidak boleh berbunyi kecurangan. Ia harus berbunyi
          ketidaksesuaian yang perlu dikonfirmasi. Diatur di bagian 10.14.
      - hal: 'Menangani kecurangan yang tidak meninggalkan jejak data sama sekali'
        contoh: 'Kesepakatan lisan antara oknum dan pasien tanpa perbedaan pola klaim'
        peran_model: 'Nol. Perlu kanal pelaporan manusia.'

# =============================================================================
# 4. TAKSONOMI 20 MODUS DAN PENGELOMPOKAN MEKANISME
# =============================================================================

taksonomi:

  gagasan_pokok: >-
    Dua puluh modus di panduan disusun menurut cara orang menamainya, bukan menurut
    cara mesin bisa melihatnya. Kalau diikuti apa adanya, kita akan membangun dua puluh
    detektor terpisah, dan tim tiga orang tidak akan selesai. Kami menyusun ulang
    menurut satu pertanyaan: sinyal apa yang membuat modus itu terlihat di dalam data.
    Setelah disusun begitu, dua puluh modus jatuh ke tiga keluarga saja.

  tiga_keluarga:
    A:
      nama: 'Isi klaim tidak didukung bukti'
      pertanyaan_statistik: >-
        Diberikan seluruh bukti lain dalam episode ini, seberapa mengejutkan isi yang
        ditagihkan.
      cakupan: 'Diagnosis, tindakan, obat, alkes, hasil pemeriksaan, besaran tagihan'
      sinyal_inti: 'Ketidaksesuaian antara yang ditagih dan yang bisa dijelaskan bukti'
      keluaran_yang_diinginkan: 'Selisih rupiah antara tarif yang ditagih dan tarif yang didukung bukti'
    B:
      nama: 'Episode dipotong atau dipanjangkan di sumbu waktu'
      pertanyaan_statistik: >-
        Diberikan riwayat episode pasien ini, seberapa mengejutkan waktu dan jenis
        kejadian berikutnya.
      cakupan: 'Pemecahan episode, unbundling, repeat billing, lama rawat, readmisi'
      sinyal_inti: 'Jarak antar-kejadian dan kelanjutan diagnosis yang tidak wajar'
      keluaran_yang_diinginkan: 'Probabilitas bahwa dua klaim sebenarnya satu episode, beserta selisih tarifnya'
    C:
      nama: 'Pola tidak wajar baru terlihat pada tingkat entitas, bukan pada satu klaim'
      pertanyaan_statistik: >-
        Diberikan kelompok sebaya yang dipelajari mesin, seberapa menyimpang distribusi
        klaim entitas ini setelah bauran kasus dikendalikan.
      cakupan: 'Kloning, rujukan tidak sesuai, self-referral, kelas rawat, kapitasi, phantom pada tingkat pola'
      sinyal_inti: 'Divergensi distribusi entitas terhadap sebaya, dan kemiripan berlebih antar-klaim'
      keluaran_yang_diinginkan: 'Peringkat faskes dan dokter menurut ekspektasi rupiah berlebih'

  catatan_penting_pengelompokan: >-
    Satu modus bisa muncul di lebih dari satu keluarga. Phantom billing terlihat di
    keluarga A pada satu klaim yang bukti pendukungnya kosong, dan terlihat lagi di
    keluarga C ketika satu rumah sakit mengajukan ribuan klaim serupa. Kami tidak
    memaksa satu modus satu keluarga. Kami mencatat di keluarga mana sinyalnya paling
    kuat, dan menandai keluarga sekunder.

  katalog:

    - id: 'M01'
      nama: 'Penyalahgunaan dana kapitasi atau nonkapitasi'
      keluarga_utama: 'C'
      keluarga_sekunder: []
      yang_terjadi: >-
        Dana kapitasi FKTP milik pemerintah dipakai tidak sesuai peruntukan, atau
        klaim nonkapitasi diajukan tanpa dasar.
      apa_yang_terlihat_di_data: >-
        Kapitasi dibayar per kepala per bulan, jadi jumlahnya tidak bergantung pada
        pelayanan. Yang bisa dilihat adalah rasio antara kapitasi yang diterima dan
        kunjungan yang tercatat, serta rasio rujukan.
      data_yang_dibutuhkan: ['Jumlah peserta terdaftar per FKTP', 'Kunjungan RJTP per FKTP per bulan', 'Rasio rujukan', 'Realisasi belanja FKTP']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Sebagian. Realisasi belanja FKTP tidak ada di data BPJS.'
      kekuatan_sinyal: 'sedang'
      catatan_kejujuran: >-
        Modus ini paling lemah untuk kami. Sinyal utamanya ada di laporan keuangan
        FKTP, bukan di klaim. Kami memasukkannya sebagai keluaran sekunder saja.

    - id: 'M02'
      nama: 'Manipulasi klaim nonkapitasi'
      keluarga_utama: 'A'
      keluarga_sekunder: ['C']
      yang_terjadi: 'Klaim nonkapitasi FKTP dimanipulasi, misalnya persalinan atau rawat inap tingkat pertama.'
      apa_yang_terlihat_di_data: >-
        Jenis tindakan nonkapitasi yang bisa diklaim FKTP jumlahnya terbatas. Distribusi
        jenis dan frekuensinya per FKTP bisa dibandingkan dengan sebaya seukuran dan
        sekelas, setelah dikendalikan jumlah peserta terdaftar dan komposisi umur.
      data_yang_dibutuhkan: ['Klaim nonkapitasi per FKTP', 'Profil peserta terdaftar', 'Kapasitas FKTP']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'sedang tinggi'

    - id: 'M03'
      nama: 'Rujukan tidak sesuai ketentuan'
      keluarga_utama: 'C'
      keluarga_sekunder: ['B']
      yang_terjadi: 'Pasien dirujuk ke tingkat lanjut padahal kasusnya masuk kompetensi FKTP.'
      apa_yang_terlihat_di_data: >-
        Diagnosis rujukan yang termasuk 144 diagnosis yang seharusnya tuntas di FKTP.
        Yang lebih halus, rasio rujukan per FKTP setelah dikendalikan bauran kasus dan
        keterbatasan alat. FKTP di daerah tanpa laboratorium wajar merujuk lebih sering.
      data_yang_dibutuhkan: ['Diagnosis pada surat rujukan', 'Profil kompetensi dan alat FKTP', 'Jarak ke FKRTL']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'tinggi'
      jebakan: >-
        Model yang naif akan menghukum FKTP di daerah terpencil. Pengelompokan sebaya
        harus mempelajari keterbatasan, bukan hanya kelas administratif. Diuji di
        bagian 13.7.

    - id: 'M04'
      nama: 'Manipulasi diagnosis atau tindakan, upcoding'
      keluarga_utama: 'A'
      keluarga_sekunder: ['C']
      yang_terjadi: >-
        Kode diagnosis atau prosedur dinaikkan supaya masuk kelompok tarif yang lebih
        mahal. Menambah diagnosis sekunder untuk menaikkan severity adalah bentuk
        yang paling umum dan paling sulit dibuktikan.
      apa_yang_terlihat_di_data: >-
        Diagnosis sekunder yang tidak diikuti bukti pendukungnya. Sepsis tanpa kultur
        dan tanpa antibiotik intravena. Gagal ginjal tanpa hasil kreatinin. Diabetes
        dengan komplikasi tanpa obat yang sesuai.
      data_yang_dibutuhkan: ['ICD-10 primer dan sekunder', 'ICD-9-CM', 'Obat yang diberikan', 'Hasil laboratorium', 'Lama rawat', 'Kelas rawat']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: >-
        Sebagian. Tanpa laboratorium dan obat, model hanya bisa memakai konsistensi
        antar-kode dan lama rawat. Dengan bukti klinis, kekuatannya berlipat.
      kekuatan_sinyal: 'sangat tinggi bila bukti klinis tersedia, sedang bila tidak'
      mengapa_ini_modus_prioritas: >-
        Nilainya besar, terjadi berulang, dan keluarannya bisa dinyatakan sebagai
        selisih rupiah yang tepat. Tarif yang ditagih dikurangi tarif yang didukung
        bukti. Itu angka yang bisa dibantah rumah sakit dan bisa ditagih balik BPJS.

    - id: 'M05'
      nama: 'Cloning, penjiplakan klaim'
      keluarga_utama: 'C'
      keluarga_sekunder: ['A']
      yang_terjadi: 'Berkas klaim disalin dari pasien lain untuk memenuhi kelengkapan.'
      apa_yang_terlihat_di_data: >-
        Dua klaim atau lebih dari faskes yang sama dengan himpunan diagnosis, prosedur,
        obat, dan bahkan nilai laboratorium yang nyaris identik, pada pasien berbeda.
        Kunci pembedanya adalah tingkat kesamaan yang jauh melampaui yang wajar
        muncul secara kebetulan.
      data_yang_dibutuhkan: ['Seluruh isi klaim terstruktur', 'Identitas peserta ter-hash', 'Identitas faskes']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya, dan ini salah satu yang paling murah dikerjakan.'
      kekuatan_sinyal: 'tinggi'
      jebakan: >-
        Protokol klinis memang menyeragamkan. Seratus pasien katarak di satu rumah
        sakit memang akan mirip. Yang membedakan kloning dari protokol adalah kemiripan
        pada variabel yang seharusnya bervariasi, misalnya nilai laboratorium dan
        lama rawat. Ini yang membuat statistik kami di bagian 10.10 bukan sekadar
        pencocokan berkas.

    - id: 'M06'
      nama: 'Phantom billing, klaim atas layanan yang tidak pernah diberikan'
      keluarga_utama: 'A'
      keluarga_sekunder: ['C', 'B']
      yang_terjadi: 'Klaim diajukan untuk pelayanan yang tidak pernah terjadi.'
      apa_yang_terlihat_di_data: >-
        Pada satu klaim, hampir tidak terlihat, karena berkasnya dibuat lengkap. Yang
        terlihat adalah jejak yang hilang. Tidak ada obat, tidak ada laboratorium,
        tidak ada tindakan penyerta yang biasanya menyertai. Pada tingkat faskes,
        terlihat sebagai volume tindakan tertentu yang tidak sebanding dengan kapasitas,
        jumlah dokter, atau jam operasional.
      data_yang_dibutuhkan: ['Isi klaim', 'Kapasitas faskes', 'Jumlah dan jadwal dokter', 'Kehadiran peserta']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: >-
        Terbatas. Inilah alasan rekomendasi P1 dan P3 di bagian 8. Tanpa penanda
        kehadiran pasien, phantom billing hanya bisa dilihat sebagai kejanggalan volume.
      kekuatan_sinyal: 'sedang tanpa penanda kehadiran, sangat tinggi dengan penanda kehadiran'
      pelajaran_dari_kasus_2024: >-
        Perbandingan 4.300 klaim fisioterapi terhadap 1.000 catatan medis adalah
        bentuk paling murni dari sinyal ini. Rasio klaim terhadap jejak pendukung.

    - id: 'M07'
      nama: 'Inflated bills, penggelembungan tagihan'
      keluarga_utama: 'A'
      keluarga_sekunder: []
      yang_terjadi: 'Biaya obat atau alat kesehatan ditagih lebih besar dari biaya sebenarnya.'
      apa_yang_terlihat_di_data: >-
        Harga satuan yang menyimpang dari distribusi harga barang yang sama di faskes
        sebaya pada periode yang sama. Ini termasuk sinyal yang paling bersih karena
        pembandingnya jelas.
      data_yang_dibutuhkan: ['Rincian tagihan obat dan alkes', 'Harga satuan', 'Katalog e-purchasing atau harga acuan']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: >-
        Untuk klaim di luar paket INA-CBG, ya. Untuk yang di dalam paket, rincian harga
        satuan tidak selalu terkirim.
      kekuatan_sinyal: 'tinggi bila rincian tersedia'

    - id: 'M08'
      nama: 'Pemecahan episode sesuai indikasi tapi tidak sesuai ketentuan'
      keluarga_utama: 'B'
      keluarga_sekunder: []
      yang_terjadi: >-
        Pelayanan yang secara medis memang bertahap dipecah menjadi beberapa klaim,
        padahal ketentuan mengharuskan satu paket.
      apa_yang_terlihat_di_data: 'Dua klaim berdekatan pada pasien sama dengan diagnosis yang saling melanjutkan.'
      data_yang_dibutuhkan: ['Riwayat episode per peserta', 'Tanggal masuk dan keluar', 'Diagnosis tiap episode']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'tinggi'
      mengapa_model_lebih_baik_dari_aturan: >-
        Aturan memakai jendela waktu tetap, misalnya tiga puluh hari. Jendela tetap
        salah di dua arah. Kemoterapi berulang tiap tiga minggu itu sah. Readmisi
        ortopedi elektif dua hari itu janggal. Model kejadian di bagian 10.8 belajar
        jarak yang wajar per jenis kasus, bukan satu angka untuk semua.

    - id: 'M09'
      nama: 'Services unbundling, fragmentasi tindakan'
      keluarga_utama: 'B'
      keluarga_sekunder: ['A']
      yang_terjadi: 'Dua diagnosis atau prosedur yang seharusnya satu paket ditagihkan terpisah.'
      apa_yang_terlihat_di_data: >-
        Pasangan kode yang muncul terpisah padahal dalam korpus wajar hampir selalu
        muncul bersama dalam satu klaim.
      data_yang_dibutuhkan: ['ICD-9-CM', 'ICD-10', 'Tanggal tindakan']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'tinggi'
      catatan_metode: >-
        Ini kasus yang bisa dijawab aturan pasangan kode, dan Amerika sudah punya
        daftar NCCI. Indonesia belum punya padanan yang lengkap. Model kami bisa
        menghasilkan calon daftar itu dari data, lewat statistik kemunculan bersama.
        Itu produk sampingan yang berguna bagi BPJS di luar deteksi.

    - id: 'M10'
      nama: 'Self-referral, rujukan semu'
      keluarga_utama: 'C'
      keluarga_sekunder: []
      yang_terjadi: 'Rujukan diarahkan ke rumah sakit atau dokter tertentu tanpa alasan keterbatasan fasilitas.'
      apa_yang_terlihat_di_data: >-
        Konsentrasi rujukan yang tidak wajar dari satu FKTP ke satu FKRTL, melampaui
        yang bisa dijelaskan jarak, kelas, dan bauran kasus. Ini murni pertanyaan graf.
      data_yang_dibutuhkan: ['Pasangan FKTP dan FKRTL pada tiap rujukan', 'Koordinat faskes', 'Kelas dan layanan FKRTL']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'tinggi'

    - id: 'M11'
      nama: 'Repeat billing, klaim berulang'
      keluarga_utama: 'B'
      keluarga_sekunder: []
      yang_terjadi: 'Kasus yang sama ditagihkan lebih dari satu kali.'
      apa_yang_terlihat_di_data: 'Duplikasi pada kunci gabungan peserta, faskes, tindakan, dan tanggal.'
      data_yang_dibutuhkan: ['Kunci klaim']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'sangat tinggi'
      catatan_kejujuran: >-
        Ini tidak butuh AI. Ini butuh indeks unik dan pemeriksaan hash. Kami
        memasukkannya sebagai lapis aturan deterministik di depan model, bukan
        sebagai kepala model. Memakai jaringan saraf untuk mendeteksi duplikat adalah
        pemborosan, dan juri yang paham akan menandainya.

    - id: 'M12'
      nama: 'Prolonged length of stay'
      keluarga_utama: 'B'
      keluarga_sekunder: ['A']
      yang_terjadi: 'Pasien ditahan lebih lama tanpa indikasi medis supaya klaim naik.'
      apa_yang_terlihat_di_data: >-
        Lama rawat yang jauh di atas perkiraan, setelah dikendalikan diagnosis,
        komorbiditas, umur, dan tindakan.
      data_yang_dibutuhkan: ['Tanggal masuk dan keluar', 'Diagnosis', 'Tindakan', 'Umur', 'Komorbiditas']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'tinggi'
      catatan_penting: >-
        Pada tarif paket, memperpanjang rawat justru merugikan rumah sakit, karena
        tarifnya sudah tetap. Jadi modus ini lebih masuk akal pada layanan di luar
        paket, atau ketika perpanjangan dipakai untuk memenuhi syarat kelompok tarif
        yang lebih tinggi. Model harus memodelkan lama rawat sebagai variabel yang
        memindahkan kelompok tarif, bukan sebagai biaya harian.

    - id: 'M13'
      nama: 'Manipulasi kelas perawatan'
      keluarga_utama: 'A'
      keluarga_sekunder: ['C']
      yang_terjadi: 'Kelas rawat yang ditagihkan tidak sesuai kelas yang ditempati pasien.'
      apa_yang_terlihat_di_data: >-
        Kelas rawat yang ditagih dibandingkan hak kelas peserta dan kapasitas tempat
        tidur per kelas di rumah sakit itu. Kalau sebuah rumah sakit menagih kelas 1
        melebihi jumlah tempat tidur kelas 1 yang dimilikinya pada periode itu,
        aritmetikanya tidak mungkin.
      data_yang_dibutuhkan: ['Kelas ditagih', 'Hak kelas peserta', 'Kapasitas tempat tidur per kelas', 'Tanggal rawat']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: >-
        Ya, kalau kapasitas tempat tidur per kelas tersedia. Data ini ada di registri
        rumah sakit Kemenkes.
      kekuatan_sinyal: 'sangat tinggi, karena ada batas fisik yang keras'

    - id: 'M14'
      nama: 'Menagihkan tindakan yang tidak dilakukan'
      keluarga_utama: 'A'
      keluarga_sekunder: []
      yang_terjadi: 'Tindakan dicantumkan di klaim padahal tidak dikerjakan.'
      apa_yang_terlihat_di_data: >-
        Tindakan tanpa jejak penyerta. Operasi tanpa obat anestesi. Hemodialisis tanpa
        pemakaian dialiser. Tindakan bedah tanpa hari rawat yang sesuai.
      data_yang_dibutuhkan: ['ICD-9-CM', 'Obat', 'Bahan habis pakai', 'Lama rawat']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Sebagian, tergantung apakah rincian obat dan bahan terkirim.'
      kekuatan_sinyal: 'tinggi bila rincian tersedia'

    - id: 'M15'
      nama: 'Tindakan pengobatan tidak sesuai indikasi medis'
      keluarga_utama: 'A'
      keluarga_sekunder: []
      yang_terjadi: 'Tindakan dikerjakan dan ditagih padahal indikasinya tidak terpenuhi.'
      apa_yang_terlihat_di_data: >-
        Tindakan yang dilakukan tanpa hasil pemeriksaan yang menjadi syaratnya menurut
        panduan praktik klinis. Contoh yang muncul di kasus 2024 adalah operasi katarak
        pada pasien yang tajam penglihatannya belum memenuhi ambang.
      data_yang_dibutuhkan: ['Tindakan', 'Hasil pemeriksaan penunjang', 'Panduan praktik klinis']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: >-
        Tidak sepenuhnya. Butuh hasil pemeriksaan yang saat ini jarang terkirim.
        Ini pendorong utama P2 di bagian 8.
      kekuatan_sinyal: 'rendah tanpa hasil pemeriksaan, sangat tinggi dengan hasil pemeriksaan'

    - id: 'M16'
      nama: 'Readmisi, admisi berulang'
      keluarga_utama: 'B'
      keluarga_sekunder: []
      yang_terjadi: 'Satu episode diklaim lebih dari satu kali seolah beberapa episode.'
      apa_yang_terlihat_di_data: 'Sama dengan M08, dengan penekanan pada pemulangan yang dipercepat.'
      data_yang_dibutuhkan: ['Riwayat admisi per peserta', 'Diagnosis', 'Status pulang']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Ya'
      kekuatan_sinyal: 'tinggi'

    - id: 'M17'
      nama: 'Klaim fiktif obat, alkes, atau tindakan'
      keluarga_utama: 'A'
      keluarga_sekunder: []
      yang_terjadi: 'Barang atau tindakan ditagih tapi tidak diberikan ke pasien.'
      apa_yang_terlihat_di_data: >-
        Kombinasi obat dan diagnosis yang tidak masuk akal, atau jumlah obat yang tidak
        sebanding dengan lama rawat. Pada tingkat faskes, pemakaian satu item yang jauh
        melampaui pola sebaya.
      data_yang_dibutuhkan: ['Rincian obat dan alkes', 'Diagnosis', 'Lama rawat']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Sebagian'
      kekuatan_sinyal: 'sedang tinggi'

    - id: 'M18'
      nama: 'Pengurangan jumlah obat yang diserahkan'
      keluarga_utama: 'A'
      keluarga_sekunder: []
      yang_terjadi: 'Obat yang diserahkan lebih sedikit dari yang ditagihkan sesuai resep.'
      apa_yang_terlihat_di_data: >-
        Hampir tidak terlihat dari sisi BPJS, karena yang terkirim adalah resep, bukan
        penyerahan. Perbedaan resep dan penyerahan hanya diketahui pasien.
      data_yang_dibutuhkan: ['Resep', 'Bukti serah terima obat', 'Konfirmasi peserta']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Tidak'
      kekuatan_sinyal: 'sangat rendah'
      catatan_kejujuran: >-
        Kami menuliskan modus ini sebagai tidak terjangkau model. Jalan keluarnya
        adalah konfirmasi ke peserta lewat aplikasi Mobile JKN, bukan analitik.
        Menuliskan bahwa model kami mendeteksi modus ini akan menjadi klaim palsu.

    - id: 'M19'
      nama: 'Inflated bills pada obat dan alkes'
      keluarga_utama: 'A'
      keluarga_sekunder: []
      yang_terjadi: 'Sama dengan M07, dinyatakan ulang di panduan.'
      catatan: >-
        Panduan mencantumkan inflated bills dua kali, pada nomor 7 dan nomor 19.
        Kami memperlakukannya sebagai satu modus, dan menyebutnya M07. M19 dibiarkan
        ada di katalog supaya penomoran panduan tetap bisa dilacak.
      kekuatan_sinyal: 'lihat M07'

    - id: 'M20'
      nama: 'Manipulasi hasil pemeriksaan'
      keluarga_utama: 'A'
      keluarga_sekunder: ['C']
      yang_terjadi: 'Hasil pemeriksaan diubah supaya klaim memenuhi syarat penagihan.'
      apa_yang_terlihat_di_data: >-
        Nilai laboratorium yang menumpuk tepat di sisi ambang syarat. Distribusi yang
        wajar tidak menumpuk di ambang. Distribusi yang dimanipulasi menumpuk.
        Ini uji yang sangat kuat dan sangat murah, mirip hukum Benford tapi pada
        ambang klinis.
      data_yang_dibutuhkan: ['Nilai numerik hasil pemeriksaan', 'Ambang yang dipakai aturan tarif']
      apakah_bisa_dilihat_model_tanpa_perubahan_sistem: 'Tidak, karena nilai numerik tidak terkirim.'
      kekuatan_sinyal: 'sangat tinggi bila nilai numerik terkirim'
      catatan_metode: >-
        Penumpukan di ambang adalah salah satu sinyal paling bersih dalam seluruh
        katalog ini. Ia tidak butuh model besar, hanya butuh datanya ada. Kami
        menjadikannya argumen utama untuk P2 di bagian 8.

  ringkasan_keterjangkauan:
    penjelasan: >-
      Dari dua puluh modus, tidak semuanya bisa disentuh dengan data yang mengalir hari
      ini. Ini tabel kejujuran yang akan kami tampilkan di proposal.
    terjangkau_dengan_data_sekarang: ['M02', 'M03', 'M05', 'M08', 'M09', 'M10', 'M11', 'M12', 'M13', 'M16']
    terjangkau_sebagian: ['M01', 'M04', 'M06', 'M07', 'M14', 'M17']
    tidak_terjangkau_tanpa_perubahan_sistem: ['M15', 'M18', 'M20']
    kesimpulan: >-
      Sepuluh modus bisa dikerjakan sekarang. Enam bisa dikerjakan sebagian. Tiga tidak
      bisa. Angka itu yang kami tulis di proposal, bukan dua puluh dari dua puluh.
      Tiga yang tidak terjangkau justru menjadi rekomendasi kebijakan kami, karena
      begitu datanya mengalir, ketiganya termasuk yang paling mudah ditangkap.

# =============================================================================
# 5. APA YANG SUDAH DIKERJAKAN NEGARA LAIN
# =============================================================================

pembanding_internasional:

  cara_membaca_bagian_ini: >-
    Tujuannya bukan mengagumi. Tujuannya memisahkan tiga hal. Yang berhasil dan bisa
    dipindah ke Indonesia. Yang berhasil tapi tidak bisa dipindah karena prasyaratnya
    tidak ada. Yang gagal, supaya tidak diulang.

  amerika_serikat:
    lembaga: 'Centers for Medicare and Medicaid Services'
    sistem: 'Fraud Prevention System, berjalan sejak 2011'
    dasar_hukum: 'Small Business Jobs Act 2010 mewajibkan CMS memakai analitik prediktif'
    cara_kerja: >-
      Menyaring seluruh klaim Medicare fee-for-service sebelum dibayar, memakai model
      prediktif dan aturan, lalu menandai penyedia untuk investigasi atau penangguhan
      pembayaran.
    hasil_yang_terverifikasi:
      - 'Pada tahun fiskal 2016, edit FPS menolak hampir 324.000 klaim dan menghemat lebih dari 20,4 juta dolar.'
      - 'Pada tahun fiskal 2016, 90 penyedia ditangguhkan pembayarannya karena investigasi yang dipicu FPS, dengan estimasi penghematan 6,7 juta dolar.'
      - 'Medicare memperkirakan mencegah 11,9 miliar dolar pembayaran berpotensi curang sepanjang tahun fiskal 2022 sampai 2024.'
      - 'Analitik data membantu menangguhkan pembayaran ke 15 penyedia yang menagih lebih dari 4 miliar dolar kateter urin yang tidak pernah dikirim.'
    sumber: ['https://www.gao.gov/products/gao-17-710', 'https://www.gao.gov/products/gao-26-107799', 'https://www.gao.gov/products/gao-13-104']
    status: terverifikasi
    kritik_yang_penting_untuk_kami: >-
      GAO berulang kali menyoroti bahwa CMS kesulitan mendefinisikan dan mengukur
      manfaat sistemnya. Laporan 2012 secara khusus meminta CMS menetapkan ukuran
      efektivitas. Artinya sistem sebesar itu pun bisa berjalan bertahun-tahun tanpa
      pembuktian dampak yang jelas.
    pelajaran_yang_kami_ambil:
      - 'Pergeseran dari bayar lalu tagih balik, menjadi periksa lalu bayar, adalah perubahan yang paling menentukan. Bukan modelnya.'
      - 'Ukuran keberhasilan harus ditetapkan sebelum sistem dibangun, bukan sesudah. Bagian 13 kami menulis ambang lulus di depan.'
      - 'Angka penghematan yang terlihat kecil, 20,4 juta dolar dari sistem sebesar itu, mengingatkan agar tidak menjanjikan triliunan.'

  inggris:
    lembaga: 'NHS Counter Fraud Authority'
    sistem: 'Project Athena, uji coba sejak awal 2024. Project WISE membawanya ke tingkat lokal.'
    cara_kerja: >-
      Model pembelajaran mesin menandai titik data yang menyimpang untuk diprioritaskan
      investigasi. Contoh yang disebut, staf yang bekerja di tempat lain sambil mengaku
      sakit, dan faktur untuk barang yang tidak pernah dikirim.
    hasil_yang_terverifikasi:
      - 'NHSCFA melaporkan tingkat pengembalian 3 banding 1, sebagian karena Project Athena.'
      - 'Rentang penghematan yang diperkirakan dari proyek itu 10 juta sampai 100 juta pound.'
      - 'NHSCFA memperkirakan 1,346 miliar pound dana NHS rentan hilang karena kecurangan, suap, dan korupsi, setara 0,72 persen anggaran NHS 2024 sampai 2025.'
    sumber: ['https://cfa.nhs.uk/about-nhscfa/latest-news/project-WISE', 'https://www.publictechnology.net/2025/07/31/science-technology-and-research/how-departments-are-using-data-analytics-to-combat-fraud/']
    status: terverifikasi
    pelajaran_yang_kami_ambil:
      - 'Rentang 10 sampai 100 juta pound itu lebar sepuluh kali lipat. Bahkan lembaga yang serius pun tidak bisa mempersempitnya. Kami tidak akan mengaku lebih presisi dari mereka.'
      - 'Rasio pengembalian 3 banding 1 adalah bentuk metrik yang benar. Bukan akurasi, tapi nilai yang diselamatkan dibagi biaya. Kami mengadopsinya di bagian 13.2.'
      - 'Mereka mengukur ukuran masalahnya lebih dulu, 0,72 persen anggaran. Indonesia belum punya angka setara. Itu celah kebijakan yang bisa kami sebut.'

  korea_selatan:
    lembaga: 'Health Insurance Review and Assessment Service'
    sistem: 'Sistem PARE sebagai gerbang seluruh klaim, dan sistem CRS yang mendukung kerja penelaah klaim. Telaah elektronik berbasis AI dengan analisis tujuh langkah.'
    hal_yang_paling_relevan: >-
      HIRA menelaah kesesuaian pelayanan terhadap panduan klinis dan terhadap keputusan
      sejawat, bukan hanya terhadap aturan administratif. Ini persis pendekatan yang
      kami sebut kelompok sebaya di bagian 10.9.
    perkembangan_2026: >-
      Financial Services Commission membentuk gugus tugas sistem pencegahan kecurangan
