      peran: 'Angka pemanfaatan dan rasio klaim per periode. Penyetel utama pembangkit.'
      terverifikasi_sesi: 'ya'

  ringkasan_pustaka:
    jumlah_total: 126
    terverifikasi_sesi_ya: 106
    terverifikasi_sesi_tidak: 20
    catatan: >-
      Dua puluh rujukan yang belum diverifikasi sebagian besar adalah makalah klasik
      yang sangat dikenal, seperti transformer, BERT, dan XGBoost. Risiko salahnya
      kecil, tapi tetap harus dicek sebelum masuk daftar pustaka proposal.
    catatan_tentang_kata_terverifikasi: >-
      Terverifikasi di sini berarti judulnya muncul pada hasil pencarian daring
      tanggal 5 September 2026, jadi karyanya ada. Itu bukan berarti kami sudah
      membaca isinya. Sebelum dikutip di proposal, yang akan benar benar dipakai
      harus dibaca, bukan sekadar dicantumkan.

# =============================================================================
# 19. LAMPIRAN
# =============================================================================

lampiran:

  daftar_periksa_sebelum_mengunggah_proposal:
    - 'Setiap angka di proposal punya sumber yang bisa dibuka.'
    - 'Tidak ada satu pun hasil evaluasi yang ditulis sebelum dijalankan.'
    - 'Kategori dinyatakan tegas di halaman pertama, satu kategori saja.'
    - 'Daftar modus yang tidak terjangkau ikut ditulis, bukan disembunyikan.'
    - 'Batas antara kode sendiri dan pustaka pihak ketiga dinyatakan.'
    - 'Pernyataan bahwa tidak ada data peserta JKN nyata yang dipakai.'
    - 'Nama tim, ketua tim, dan kontak yang aktif di WhatsApp.'
    - 'Diunggah sebelum 19 September, bukan pada tanggal itu.'

  hal_hal_yang_paling_mudah_menjatuhkan_proposal_ini:
    - 'Menyebut angka penghematan nasional.'
    - 'Mengaku mendeteksi dua puluh modus.'
    - 'Menaruh hasil evaluasi yang belum diukur.'
    - 'Tidak menyertakan pembanding mesin aturan.'
    - 'Tidak menjelaskan bagaimana bekerja tanpa label.'
    - 'Terdengar seperti mau menggantikan verifikator.'

  perbedaan_dengan_berkas_asumsi_sebelumnya:
    catatan: 'Ditulis supaya jelas apa yang berubah dan mengapa.'
    daftar:
    - berubah: 'Angka hasil evaluasi dihapus'
      alasan: 'Nilai seperti PR-AUC 0,892 dan tingkat positif palsu 1,6 persen tidak berasal dari percobaan mana pun.'
    - berubah: 'Katalog 4.747 simpul berpola diganti katalog 20 modus'
      alasan: 'Simpul lama adalah perulangan template dengan nomor berjalan. Tidak menambah informasi.'
    - berubah: 'Pendekatan bergeser dari klasifikasi berlabel ke pemodelan kewajaran'
      alasan: 'Tidak ada label, dan berpura pura punya label akan runtuh saat ditanya juri.'
    - berubah: 'Lingkup dipersempit dari tiga kategori ke satu'
      alasan: 'Aturan lomba mengharuskan satu kategori.'
    - berubah: 'Rencana data ditambah tiga lapis sumber nyata'
      alasan: 'Data sintetis tanpa acuan nyata tidak bisa dibuktikan realistis.'
    - berubah: 'Ditambah bagian ketahanan terhadap pelaku yang beradaptasi'
      alasan: 'Hampir tidak ada yang menguji ini, dan justru bisa diuji karena pembangkitnya kami tulis sendiri.'
    - berubah: 'Ditambah jaminan konformal'
      alasan: 'Tanpa jaminan pada laju salah tuduh, sistem seperti ini tidak akan pernah diizinkan menahan pembayaran.'
    - tetap: 'Fokus pada model dari nol, bukan pada aplikasi'
      alasan: 'Sesuai permintaan.'

  penutup: >-
    Rancangan ini berdiri di atas satu taruhan. Bahwa kecurangan tidak perlu dikenali
    dari contohnya, cukup dari seberapa jauh sebuah klaim menyimpang dari apa yang
    dibutuhkan untuk menjelaskan dirinya sendiri. Kalau taruhan itu salah, bagian 6
    sudah menuliskan bagaimana kita akan tahu, dan bagian 13 sudah menuliskan apa yang
    kita lakukan setelahnya.

# =============================================================================
# 20. STATUS IMPLEMENTASI
# Ditambahkan 5 September 2026, setelah kode ditulis dan percobaan pertama
# dijalankan. Bagian ini terpisah dari bagian 13 dengan sengaja: bagian 13
# memuat target yang ditulis sebelum percobaan, bagian ini memuat hasil.
# Memisahkannya mencegah target disesuaikan setelah melihat hasil.
# =============================================================================

status_implementasi:

  repositori: 'nalar/ di samping berkas ini'
  percobaan_yang_sudah_dijalankan: 4
  perangkat: >-
    Tiga percobaan pertama di CPU dengan model 0,97 juta parameter. Percobaan
    keempat di RTX 5060 dengan model 7,00 juta parameter sesuai ukuran yang
    dirancang, setelah PyTorch CUDA selesai terpasang.
  bahasa: 'Python 3.12, PyTorch untuk tensor dan turunan otomatis, NumPy'
  baris_kode: 'sekitar 3.400, di luar dokumen'
  catatan_temuan: 'nalar/TEMUAN.md memuat hasil percobaan beserta kegagalannya'

  yang_sudah_berjalan:
    - komponen: 'Kamus token dan pohon hierarki'
      keadaan: >-
        Berjalan. Hierarki ICD-10 dibaca dari 71.704 kode nyata yang diunduh,
        bukan dikarang. ATC dan ICD-9-CM memakai struktur panjang tetapnya.
        Kode kelompok tarif diberi leluhur sendiri sehingga model tahu bahwa
        keparahan I dan III adalah tetangga dekat.
      ukuran_kamus: 2121
      catatan: >-
        Jauh di bawah perkiraan rancangan yang 29 ribu, karena katalog kondisi
        baru memuat 66 penyakit. Arsitekturnya mendukung kamus penuh, datanya
        yang belum menguji itu.
    - komponen: 'Penokenan episode'
      keadaan: 'Berjalan. Dua belas bidang, panjang rerata 43 token, maksimum 58.'
      perubahan_dari_rancangan: >-
        Panjang maksimum diturunkan dari 128 ke 64. Biaya perhatian tumbuh
        kuadratik, dan tidak ada satu episode pun yang terpotong.
    - komponen: 'Embedding ontologi'
      keadaan: 'Berjalan, ditulis ulang dari makalah GRAM.'
    - komponen: 'Bias perhatian antar-bidang'
      keadaan: >-
        Berjalan, dan ada uji unit yang membuktikan nilainya diambil dari
        pasangan bidang yang benar. Ablasi belum dijalankan.
      catatan_kinerja: >-
        Versi pertama memakai expand lalu gather dan memakan lebih dari separuh
        waktu satu langkah. Diganti dengan satu index_select pada tabel yang
        diratakan.
    - komponen: 'Penutupan menurut peran'
      keadaan: 'Berjalan, lima pola sesuai rancangan.'
    - komponen: 'Pralatih'
      keadaan: >-
        Berjalan. Rugi turun dari 7,657 ke 2,959 pada percobaan pertama.
        Nilai awal sama dengan logaritma ukuran kamus, jadi model memang
        mulai dari tebakan buta.
    - komponen: 'Kepala K1 konsistensi bukti'
      keadaan: 'Berjalan, dengan normalisasi terhadap kasus sejenis.'
    - komponen: 'Kepala K2 tarif kontrafaktual'
      keadaan: 'Berjalan. Sudah diperluas agar menaksir kelas rawat juga.'
    - komponen: 'Kepala K4 kelompok sebaya'
      keadaan: >-
        Ditulis, termasuk k-means sendiri. Belum bekerja. Presisi sepuluh
        teratas 0,2 sampai 0,3, sedangkan menebak acak memberi 0,16. Dugaan
        kami penyebabnya jumlah klaim per faskes di himpunan uji terlalu
        sedikit, bukan statistiknya.
    - komponen: 'Kepala K5 kemiripan berlebih'
      keadaan: 'Ditulis, dengan pembobotan dari entropi. Presisi sepuluh teratas 0,4.'
    - komponen: 'Kalibrasi konformal'
      keadaan: 'Berjalan, dan jaminannya terpenuhi secara empiris.'
    - komponen: 'Pembangkit SIMJKN'
      keadaan: >-
        Berjalan, tujuh tahap. Disetel terhadap empat sasaran agregat dari
        angka terbitan BPJS dan DJSN, dan lulus di bawah toleransi.
    - komponen: 'Uji pelaku yang beradaptasi'
      keadaan: >-
        Ditulis, tiga jenis pelaku, dan memberi hasil terkuat proyek ini.
        Target T6 tercapai dengan penurunan keuntungan maksimum 96 sampai 98
        persen.

  yang_belum_ditulis:
    - 'Kepala K3, proses titik temporal. Ini yang seharusnya menangkap pemecahan episode, readmisi, dan perpanjangan lama rawat.'
    - 'Kepala K6, titik perubahan perilaku entitas.'
    - 'Penjelasan berbasis pengandaian.'
    - 'Peringkat audit dengan anggaran dan biaya per jenis pemeriksaan.'
    - 'Penggabungan label lemah dari fungsi pelabel.'
    - 'Uji latih di sintetis uji di nyata, karena MIMIC dan DE-SynPUF belum ada.'
    - 'Kontrol negatif pada label Medicare yang nyata.'

  percobaan_1:
    tanggal: '2026-09-05'
    berkas: 'nalar/runs/percobaan_cpu.json'
    pengaturan: '10.000 peserta, 3 tahun, 350 FKTP, 60 FKRTL, 80.614 episode, 0,97 juta parameter, 500 langkah, CPU'
    hasil_ringkas:
      total_selisih_tersedia_di_uji: 'Rp 1,1 miliar pada 19.877 klaim'
      rupiah_pada_seribu_teratas:
        nalar_k2_saja: 'Rp 895,0 juta'
        nalar_gabungan: 'Rp 856,3 juta'
        mesin_aturan: 'Rp 595,3 juta'
        regresi_logistik_berlabel: 'Rp 1.061,7 juta'
        acak: 'Rp 38,7 juta'
    target_tercapai:
      - id: 'T2'
        pernyataan: 'Jaminan konformal terpenuhi secara empiris'
        hasil: >-
          Tercapai pada tiga tingkat alpha. Pada alpha satu persen laju
          penandaan klaim bersih terukur 0,32 persen, jauh di bawah batas lulus
          1,5 persen. Diuji pada himpunan yang dipisah menurut faskes, jadi ada
          pergeseran distribusi dan jaminannya tetap berlaku.
    target_tidak_tercapai:
      - id: 'T1'
        pernyataan: 'Model menemukan setidaknya dua kali lipat rupiah dibanding mesin aturan'
        hasil: 'Tidak tercapai. Yang didapat 1,44 kali pada seribu klaim, dan 0,75 kali pada lima puluh klaim teratas.'
        tindakan: >-
          Sesuai yang sudah ditulis di bagian 13.3, posisi proposal berubah dari
          model menggantikan aturan menjadi model melengkapi aturan. Targetnya
          tidak diubah.
    kesalahan_desain_yang_ditemukan:
      - hal: 'Rumus penggabungan skor'
        penjelasan: >-
          Percobaan memakai persentil kejutan dikali selisih rupiah. K2 sendirian
          ternyata lebih baik. Sebabnya, nilai harapan tarif sudah mengandung
          peluang, jadi mengalikannya lagi menghitung peluang dua kali.
        perbaikan: >-
          Diganti menjadi peluang kelompok yang ditagihkan salah, dikali selisih
          bila memang salah. Itu bentuk yang sebenarnya sudah tertulis di
          bagian 9.8, dan implementasinya yang menyimpang.
      - hal: 'K2 buta terhadap manipulasi kelas perawatan'
        penjelasan: 'Versi pertama menahan kelas rawat pada nilai yang ditagihkan.'
        perbaikan: 'Kelas rawat ikut ditaksir, dan tarif dimarginalkan atas keduanya.'
      - hal: 'Kebenaran dasar memuat kecurangan bernilai nol'
        penjelasan: >-
          Upcoding pada klaim yang sudah keparahan III tidak menghasilkan rupiah
          apa pun, tapi tetap dilabeli curang. Model jadi dihukum karena tidak
          menemukan uang yang memang tidak ada. Ditemukan oleh uji unit.
        perbaikan: 'Injeksi hanya dilakukan bila masih ada ruang, plus jaring pengaman di akhir.'
      - hal: 'Penetapan kebijakan faskes secara undian bebas'
        penjelasan: >-
          Pada jaringan kecil, jumlah faskes berkebijakan ekstrem yang diharapkan
          kurang dari satu, sehingga kepala K4 dan K5 dievaluasi pada soal yang
          kosong dan terlihat gagal padahal tidak ada yang bisa ditemukan.
        perbaikan: 'Penetapan berstrata dengan jaminan wakil minimal per jenis.'

  temuan_yang_paling_berguna_untuk_proposal:
    - temuan: 'Presisi dan rupiah menunjuk arah berlawanan'
      angka: >-
        K1 presisi 0,507 dengan rupiah 562 juta. K2 presisi 0,112 dengan rupiah
        895 juta. Mesin aturan presisi 0,250 dengan rupiah 595 juta.
      mengapa_penting: >-
        Ini bukti terukur untuk argumen di bagian 13.1. Kalau sistem dinilai
        dengan presisi, mesin aturan menang dan BPJS kehilangan sekitar tiga
        ratus juta rupiah per seribu audit. Kami bisa menunjukkan angkanya,
        bukan sekadar berargumen.
    - temuan: 'Jarak antara sistem tanpa label dan sistem berlabel sekitar seperlima'
      angka: 'Regresi logistik berlabel Rp 1.062 juta, K2 tanpa label Rp 895 juta'
      mengapa_penting: >-
        Ini ukuran nilai rekomendasi P4, menulis hasil audit sebagai label.
        Angkanya bisa dibawa ke BPJS sebagai alasan konkret, bukan imbauan.
    - temuan: 'Beberapa modus secara struktural tidak terlihat oleh K2'
      penjelasan: >-
        Perpanjangan lama rawat tidak terlihat, karena lama rawat adalah masukan
        bagi aturan keparahan, jadi tarif yang lebih tinggi memang konsisten
        dengan lama rawat yang dipanjangkan. Menangkapnya butuh model perkiraan
        lama rawat, yaitu kepala K3.
      mengapa_penting: >-
        Membuktikan bahwa pembagian tiga keluarga mekanisme di bagian 4 bukan
        pembagian di atas kertas. Keluarga B benar benar butuh kepala sendiri.

  # ---------------------------------------------------------------------------
  # Hasil empat percobaan, ditambahkan setelah semuanya dijalankan
  # ---------------------------------------------------------------------------
  ringkasan_empat_percobaan:
    sudah_digantikan_oleh: 'papan_skor_akhir di bawah'
    mengapa_tidak_dihapus: >-
      Blok ini memuat keadaan setelah empat percobaan pertama, dan sebagian
      kesimpulannya sudah terbalik sejak itu. T3 dan T4 saat itu belum diuji,
      T5 saat itu gagal, dan kami saat itu masih mengusulkan transformer. Blok
      ini ditinggalkan utuh supaya perubahan pendirian kami bisa ditelusuri,
      bukan supaya dikutip. Angka yang berlaku ada di papan_skor_akhir.
    catatan: >-
      Rincian lengkap beserta penyebab tiap kegagalan ada di nalar/TEMUAN.md.
      Yang di bawah hanya papan skor terhadap target di bagian 13.3.

    papan_skor_target:
      - id: 'T1'
        bunyi: 'Dua kali lipat rupiah dibanding mesin aturan pada anggaran seribu klaim'
        hasil: 'GAGAL'
        angka: 'Terbaik 1,44 kali pada percobaan 1, terakhir 1,20 kali pada percobaan 4'
        tindakan_yang_diambil: >-
          Sesuai yang sudah ditulis sebelum percobaan, posisi berubah menjadi
          model melengkapi aturan, bukan menggantikannya. Targetnya tidak diubah.
        catatan_penting: >-
          Mesin aturan pembanding ditulis dengan pengetahuan penuh tentang modus
          yang diinjeksikan, sesuatu yang tidak dimiliki aturan di dunia nyata.
          Uji yang lebih adil, menahan sebagian modus dari penulis aturan, belum
          dikerjakan.
      - id: 'T2'
        bunyi: 'Jaminan konformal terpenuhi secara empiris'
        hasil: 'TERCAPAI'
        angka: >-
          Terpenuhi pada empat percobaan dan tiga tingkat alpha. Pada model
          ukuran penuh, laju penandaan klaim bersih 0,78 persen untuk alpha satu
          persen, 1,80 persen untuk dua persen, 4,76 persen untuk lima persen.
        catatan: >-
          Diuji pada himpunan yang dipisah menurut faskes, jadi ada pergeseran
          distribusi dan jaminannya tetap berlaku. Model yang lebih terkalibrasi
          membuat jaminannya lebih rapat ke alpha, bukan hanya aman.
      - id: 'T3'
        bunyi: 'Mengalahkan pohon berpenguat yang disetel dengan baik'
        hasil: 'BELUM DIUJI'
        alasan: 'XGBoost dan LightGBM tidak terpasang di mesin pengembangan.'
      - id: 'T4'
        bunyi: 'Pralatih memberi perbaikan nyata'
        hasil: 'BELUM DIUJI'
        alasan: 'Ablasi tanpa pralatih belum dijalankan.'
      - id: 'T5'
        bunyi: 'Laju penandaan antar kelompok faskes tidak lebih dari dua kali'
        hasil: 'GAGAL'
        angka: '5,09 kali pada percobaan 2, membaik ke 2,46 pada percobaan 3, memburuk ke 4,92 pada model ukuran penuh'
        mengapa_ini_paling_berbahaya: >-
          Ini kegagalan yang paling menentukan bila sistem diterapkan. Kalibrasi
          konformal per kelompok mengurangi ketimpangan tapi tidak menghapusnya,
          karena yang tidak tertangani adalah pergeseran antara faskes latih dan
          faskes uji di dalam kelas yang sama.
      - id: 'T6'
        bunyi: 'Keuntungan maksimum pelaku yang beradaptasi turun setidaknya setengah'
        hasil: 'TERCAPAI'
        angka: >-
          Turun 98,1 persen pada model kecil dan 96,3 persen pada model penuh.
          Pelaku serakah mengambil Rp 3,24 miliar dengan 94 sampai 99 persen
          tertangkap. Pelaku yang bisa melihat skor detektor hanya sanggup
          mengambil Rp 11,8 juta sampai Rp 81,3 juta, dan tidak tertangkap.
        mengapa_ini_hasil_terkuat: >-
          Inilah ukuran yang benar untuk sistem pengawasan. Bukan berapa persen
          tertangkap, tapi apakah kecurangan masih sepadan dilakukan. Dan
          sepanjang penelusuran kami, hampir tidak ada evaluasi deteksi
          kecurangan kesehatan yang mengukurnya, karena datanya statis. Kami
          bisa mengukurnya justru karena pembangkitnya kami tulis sendiri.
      - id: 'T7'
        bunyi: 'Bertahan pada faskes dan periode yang tidak pernah dilihat'
        hasil: 'TERCAPAI SEBAGIAN'
        angka: >-
          Seluruh angka di atas sudah memakai pemisahan menurut faskes, jadi
          bagian faskes tak dikenal terpenuhi. Pemisahan menurut waktu belum
          dijalankan.

    temuan_negatif_yang_paling_berharga:
      temuan: 'Memperbesar model tidak menambah rupiah yang ditemukan'
      angka: >-
        Model 7,00 juta parameter dilatih 3.000 langkah menemukan Rp 1.430,3
        juta. Model 0,97 juta parameter dilatih 600 langkah menemukan Rp 1.439,7
        juta. Rugi pralatih turun jelas, dari 2,848 ke 2,110, jadi model besar
        memang menebak lebih baik.
      artinya: >-
        Penghambatnya bukan kapasitas model, melainkan cakupan pertanyaan yang
        diajukan kepalanya. K1 dan K2 hanya menyentuh keluarga A. Sebagian besar
        modus ada di keluarga B, soal waktu, dan keluarga C, soal pola entitas.
      akibat_untuk_peta_jalan: >-
        Fase berikutnya dipakai menulis kepala K3, bukan memperbesar model.
        Ini mengubah urutan prioritas di bagian 16.

    dua_temuan_tak_terduga:
      - temuan: 'Model yang lebih baik justru lebih mudah dihindari'
        angka: >-
          Pelaku yang bisa melihat skor menemukan 38 klaim aman pada model besar,
          melawan 10 klaim pada model kecil. Yang bisa diambilnya naik tujuh kali.
        dugaan_penyebab: >-
          Model yang lebih tajam memberi permukaan skor yang lebih halus, dan
          permukaan yang lebih halus lebih mudah ditelusuri pelaku yang mencari
          celah. Model yang kabur memaksa pelaku menebak.
        status: >-
          Belum diuji cukup untuk disebut kesimpulan. Cukup untuk dijadikan
          pertanyaan penelitian, dan cukup untuk berhati hati sebelum mengejar
          ketepatan sebagai satu satunya sasaran.
      - temuan: 'Model yang lebih baik lebih tidak adil'
        angka: 'Rasio laju penandaan antar kelas faskes naik dari 2,46 menjadi 4,92 kali'
        artinya: >-
          Ketepatan yang lebih tinggi memperbesar perbedaan antar kelompok, bukan
          memperkecilnya. Keadilan harus dikejar sebagai sasaran tersendiri, tidak
          bisa dititipkan pada peningkatan mutu model.

    empat_kesalahan_yang_ditemukan_dan_diperbaiki:
      - 'Rumus penggabungan skor menghitung peluang dua kali. Perbaikannya menambah sepuluh persen rupiah yang ditemukan.'
      - 'Kepala tarif kontrafaktual buta terhadap manipulasi kelas perawatan.'
      - 'Kebenaran dasar memuat kecurangan bernilai nol rupiah. Ditemukan oleh uji unit.'
      - 'Injeksi klaim fiktif mengosongkan obat dan pemeriksaan, sehingga aturan paling sederhana menangkapnya sempurna dan mesin aturan pembanding terlihat jauh lebih kuat daripada seharusnya.'

    urutan_pekerjaan_berikutnya:
      - 'Kepala K3 proses titik temporal. Percobaan 4 membuktikan memperbesar model tidak menolong.'
      - 'Uji keadilan. Dua kali gagal, dan ini yang paling berbahaya bila diterapkan.'
      - 'Pohon berpenguat sebagai pembanding, supaya target T3 bisa dijawab.'
      - 'Menahan sebagian modus dari penulis mesin aturan, supaya pembandingnya adil.'
      - 'Ablasi untuk bias antar-bidang, embedding ontologi, dan pralatih.'
  # ---------------------------------------------------------------------------
  # Papan skor akhir, setelah dua belas percobaan ditambah detektor yang dikirim
  # ---------------------------------------------------------------------------
  papan_skor_akhir:
    catatan: >-
      Rincian lengkap beserta penyebab tiap kegagalan ada di nalar/TEMUAN.md.
      Angka di bawah berasal dari nalar/runs/detektor.json, yaitu konfigurasi
      yang benar benar diusulkan, bukan dari percobaan mana pun di tengah
      jalan. Papan skor lama yang memuat hasil empat percobaan pertama sengaja
      tidak dihapus, supaya perubahan pendirian kami bisa ditelusuri.

    yang_diusulkan: >-
      Penebak normatif berbasis pohon berpenguat, kalibrasi konformal
      bertingkat yang himpunannya disaring dari kontaminasi, profil faskes
      dengan penyusutan Bayes empiris, antrean audit yang sadar biaya, dan
      lapisan penjelasan berbasis pengandaian. Tidak memakai satu pun label
      kecurangan. Berkasnya nalar/src/nalar/detektor.py.

    papan_skor_target:
      - id: 'T1'
        bunyi: 'Dua kali lipat rupiah dibanding mesin aturan pada anggaran seribu klaim'
        hasil: 'GAGAL'
        angka: >-
          1,853 kali dengan simpangan 0,155 atas lima benih acak, terendah
          1,608 dan tertinggi 2,027. Jadi targetnya berada di dalam jangkauan
          satu simpangan, dan satu dari lima benih benar benar mencapainya.
          Gagal pada rata rata, bukan gagal telak.
        mengapa_metriknya_memampat: >-
          Pada seribu klaim, batas atas oracle sudah memuat 96,5 persen seluruh
          kelebihan yang ada di himpunan uji. Ketika hampir semua uang sudah
          bisa diambil siapa pun, tiap penskor bertemu di titik yang sama dan
          rasio antar penskor menyusut ke satu. Angka pada anggaran yang lebih
          kecil lebih memisahkan.
        catatan_penting: >-
          Mesin aturan pembanding ditulis dengan pengetahuan penuh tentang
          modus yang diinjeksikan, sesuatu yang tidak dimiliki aturan di dunia
          nyata. Targetnya tidak diubah sesudah melihat hasil.
      - id: 'T2'
        bunyi: 'Jaminan konformal terpenuhi secara empiris'
        hasil: 'TERCAPAI'
        angka: >-
          Laju penandaan klaim bersih 1,10 persen pada alpha dua persen, diuji
          pada faskes yang tidak pernah dilihat saat latih maupun kalibrasi.
        catatan: >-
          Pemisahan menurut faskes berarti ada pergeseran sebaran, dan
          jaminannya tetap berlaku. Tapi lihat T5: keterpertukaran itu benar
          benar patah pada kelompok yang faskesnya sedikit, dan kami
          menanganinya dengan menahan diri, bukan dengan berpura pura tidak
          ada.
      - id: 'T3'
        bunyi: 'Mengalahkan pohon berpenguat yang disetel dengan baik'
        hasil: 'GAGAL'
        angka: >-
          Pohon normatif tanpa label mencapai porsi batas atas 0,721,
          transformer NALAR 0,649. Cadangan yang ditulis di rancangan juga
          gagal: menaruh kepala K3 di atas pohon justru menurunkan hasilnya,
          dan K3 bersama K7 hanya menambah 0,6 persen.
        tindakan_yang_diambil: >-
          Pohon dijadikan tulang punggung yang dikirim. Yang tetap dipakai dari
          rancangan adalah bagian yang tidak bergantung pada bentuk modelnya,
          yaitu kalibrasi konformal, evaluasi terhadap pelaku yang beradaptasi,
          tarif resmi, keluaran dalam rupiah, dan penjelasan yang bisa dibantah.
      - id: 'T4'
        bunyi: 'Pralatih memberi perbaikan nyata'
        hasil: 'TERCAPAI'
        angka: '1,130 kali melawan garis dasar urutkan menurut nilai klaim, setelah kepala K7 ditulis'
        catatan: >-
          Percobaan keempat menyimpulkan sebaliknya. Kesimpulan itu batal
          setelah komposisi kebenaran dasar diukur dan ternyata dua modus
          terbesar tidak terlihat oleh satu kepala pun.
      - id: 'T5'
        bunyi: 'Laju penandaan antar kelompok faskes tidak lebih dari dua kali'
        hasil: 'TERCAPAI'
        angka: 'Rasio simetris 1,879 dan kelebihan berarah 1,579, keduanya di bawah batas dua kali'
        riwayat: >-
          Gagal pada lima percobaan berturut turut, terburuk 5,263. Empat
          percobaan perbaikan pertama salah sasaran karena kami menduga
          sebabnya tanpa mengukur.
        sebab_yang_sebenarnya: >-
          Bukan rumah sakit besar ditandai terlalu sering. FKTP ditandai
          seperenam jatah yang dijanjikan alpha, karena himpunan kalibrasi
          mengandung klaim curang yang mengangkat ambangnya. Sebaran selisih
          FKTP rapat, enam puluh persen bernilai nol persis, jadi sedikit klaim
          curang cukup menggeser ujung atasnya. Pada kelas B sebarannya sudah
          lebar sejak awal sehingga pengangkatannya kecil. FKTP memikul tujuh
          puluh dua persen klaim, jadi laju keseluruhan tertarik turun dan
          setiap kelas rumah sakit otomatis terlihat berlebih.
        perbaikannya: >-
          Faskes yang selisihnya menonjol terhadap kelompok sebayanya
          dikeluarkan dari himpunan kalibrasi, memakai profil faskes dan tanpa
          satu pun label. Membuang tiga persen klaim kalibrasi. Rupiah yang
          ditemukan tidak berubah sama sekali, karena peringkatnya tidak
          disentuh.
        risiko_yang_kami_tuliskan: >-
          Model ikut memilih data yang mengkalibrasi dirinya sendiri. Karena
          itu batas pemotongannya disapu dan seluruh sapuannya dilaporkan.
      - id: 'T6'
        bunyi: 'Keuntungan maksimum pelaku yang beradaptasi turun setidaknya setengah'
        hasil: 'GAGAL'
        angka: 'Turun 25,6 persen melawan batas setengah'
        mengapa_ini_harus_dibaca_dulu: >-
          Versi sebelumnya menyatakan target ini tercapai dengan penurunan 96
          persen. Angka itu diukur pada transformer. Sejak percobaan kedua
          belas yang kami kirim adalah pohon berpenguat, jadi klaim terkuat
          pada dokumen kami diukur pada model yang sudah tidak ada. Diukur
          ulang pada model yang benar benar dikirim, targetnya gagal.
        yang_lebih_buruk_daripada_gagal: >-
          Pelaku yang menyebar serangannya meloloskan Rp 579 juta, sedangkan
          pelaku serakah hanya Rp 385 juta. Sistem kami membuat menyebar lebih
          menguntungkan daripada serakah, yaitu kebalikan dari yang seharusnya
          dilakukan sistem pengawasan.
        yang_tetap_benar: >-
          Melawan mesin aturan, pelaku hati hati meloloskan Rp 1.440 juta.
          Melawan detektor kami Rp 273 juta. Jadi detektornya jauh lebih baik
          daripada aturan, ia hanya tidak membuat kecurangan berhenti sepadan.
      - id: 'T7'
        bunyi: 'Bertahan pada faskes dan periode yang tidak pernah dilihat'
        hasil: 'TERCAPAI'
        angka: >-
          Dilatih pada dua tahun pertama dan dipakai pada tahun ketiga, porsi
          batas atas 0,756 melawan 0,713 pada pemisahan menurut faskes.
          Rasionya 1,06, jadi sedikit lebih baik dan bukan lebih buruk.
          Jaminan konformal tetap berlaku pada 0,71 persen.
        catatan: >-
          Inilah bentuk pemakaian yang sebenarnya, dilatih pada masa lalu dan
          dipakai pada masa depan. Belum pernah dijalankan sampai sekarang.

    angka_yang_bisa_dibawa_ke_rapat:
      rupiah_pada_seribu_klaim: 'Rp 1.249,3 juta'
      porsi_batas_atas: 0.713
      antrean_audit_terisi: '541 dari kapasitas seribu'
      alasan_sisanya_kosong: >-
        Selisihnya lebih kecil daripada biaya memeriksanya. Tidak mengisi
        antrean adalah perilaku yang benar, bukan kekurangan.
      rasio_pengembalian: '2,32 banding 1 pada asumsi biaya audit Rp 750.000 per berkas'
      pembanding: >-
        NHS melaporkan sekitar 3 banding 1 untuk program yang sudah berjalan
        bertahun tahun. Biaya per berkas adalah parameter kebijakan yang harus
        diisi BPJS, bukan angka yang kami tetapkan.

    dua_uji_penerimaan_data:
      - nama: 'Latih di sintetis, uji di nyata'
        hasil: 'GAGAL'
        pembanding: 'CMS DE-SynPUF, 64.492 klaim rawat inap'
        angka: >-
          Spearman 0,270 bagi model yang belajar dari data kami, melawan 0,540
          bagi model yang belajar dari klaim Amerika, dan 0,000 bagi tebakan
          rata rata. Turun 50 persen, sedangkan ambang yang kami tetapkan
          sebelum melihat data adalah sepertiga.
        peringatan_yang_wajib_ikut: >-
          DE-SynPUF sendiri sudah disintesis CMS dari klaim asli demi privasi.
          Jadi ini bukan sintetis melawan nyata, melainkan sintetis kami
          melawan sintetis yang diturunkan dari klaim betulan.
        yang_bisa_dinyatakan: >-
          Data karangan kami memuat struktur biaya yang benar benar berpindah
          ke klaim betulan, terukur pada lima belas ribu klaim dari enam ratus
          tujuh puluh rumah sakit yang tidak pernah dilihat model.
        yang_tidak_bisa_dinyatakan: >-
          Bahwa data kami wakil yang setia. Ia mencapai separuh sinyal
          peringkat yang didapat model yang belajar dari klaim betulan.
        arah_sebaliknya: >-
          Model yang belajar dari klaim Amerika lalu diuji pada data kami jatuh
          85 persen, jauh lebih buruk. Kalau data kami sekadar versi miskin
          dari kenyataan, arah itu seharusnya mulus. Sebabnya lima kolom
          bersama memerikan dunia mereka lebih baik daripada dunia kami, karena
          tarif INA-CBG ditentukan pencarian kode, bukan lama rawat.
      - nama: 'Kontrol negatif pada label LEIE'
        hasil: 'TERHALANG'
        yang_sudah_ada: 'Berkas LEIE terunduh, 8.660 NPI sah dari 83.842 baris'
        yang_menghalangi: >-
          NPI dokter DE-SynPUF diawali angka nol, di luar rentang NPI yang sah,
          dan irisannya dengan LEIE nol persis. Kami mengetahuinya dari
          mengukur, bukan dari membaca dokumentasi. Sumber publik yang memuat
          NPI sungguhan beserta pola penagihan menolak empat cara akses
          berturut turut dengan 403 di sisi tepi jaringan.
        mengapa_ini_serius: >-
          Kalau arsitektur kami tidak bisa menemukan kecurangan nyata pada data
          nyata, keberhasilannya pada data sintetis kami tidak berarti apa apa.
          Kalimat itu kami tulis sendiri sebelum ujinya terhalang, dan kami
          tidak mencabutnya.

    kepala_yang_diperbaiki_di_akhir:
      - id: 'K4'
        keadaan: 'Ditulis ulang dan berhasil'
        sebelumnya: >-
          Kelompok sebaya dari representasi transformer, dibandingkan dengan
          divergensi Jensen Shannon. Presisi pada sepuluh teratas 0,2 sampai
          0,3 melawan tebakan acak 0,16, praktis tidak berguna. Sebabnya
          divergensi atas sebaran sepanjang 885 kode ditaksir dari empat puluh
          klaim, jadi yang terukur derau pencuplikan dan yang diurutkan
          kekecilan faskes.
        sekarang: >-
          Kelompok sebaya dari sifat administratif yang bisa dilihat siapa
          saja, dan statistiknya penyusutan Bayes empiris yang justru menarik
          taksiran dari sedikit data mendekat ke rata rata kelompoknya.
        angka: >-
          Presisi pada sepuluh dan dua puluh lima teratas 1,000, melawan 0,600
          tanpa penyusutan dan 0,181 tebakan acak. Seluruh faskes berkebijakan
          sistematis dan ekstrem tertangkap, tidak ada satu pun faskes jujur di
          dua puluh lima teratas.
        peringatan: >-
          Mencurigai faskes memang lebih mudah daripada mencurigai klaim.
          Faskes sistematis menaikkan tarif pada enam dari sepuluh klaim yang
          memenuhi syarat, dan dengan dua ratus klaim tandanya terang.
      - id: 'K6'
        keadaan: 'Ditulis, terkalibrasi, tapi lemah'
        kendali_positif_palsu: >-
          Pada data tanpa satu pun perubahan, 6,1 persen faskes ditandai
          berubah pada ambang lima persen. Uji permutasinya sah.
        daya_temu: >-
          Dua belas persen bagi faskes yang berubah menjadi oportunis, tiga
          puluh tiga persen bagi yang sistematis. Tanggal tebakannya meleset
          dua ratus lima puluh dua hari dari rentang seribu sembilan puluh lima
          hari, terlalu kasar untuk ditindak langsung.
        nilai_tambah_atas_k4: >-
          Dari delapan belas faskes yang berubah, sepuluh sudah tertangkap K4,
          jadi tambahan bersihnya dua faskes.
        putusan: >-
          Dikirim sebagai isyarat pendamping dengan angkanya ditulis apa
          adanya, bukan sebagai kemampuan yang dijual. Benar secara statistik,
          kecil secara guna.

    daerah_tertinggal_tetap_dikecualikan:
      keadaan: 'Keputusan kebijakan, bukan perbaikan teknis, dan sekarang beralasan terukur'
      tiga_aturan_umum_yang_dicoba_dan_gagal:
        - 'Ambang yang mengeluarkan satu faskes bergantian lalu mengambil yang terbesar. Laju penandaannya tidak bergerak sama sekali.'
        - 'Menaikkan syarat jumlah faskes minimum. Salah sasaran, kelas B yang menahan diri.'
        - 'Membuat penolakan karena kurang faskes berarti menahan diri. Justru melonjakkan lajunya, karena klaim yang ditolak karena kurang klaim tetap jatuh ke ambang yang terlalu ketat.'
      sebab_yang_terukur: >-
        FKTP daerah tertinggal punya tiga puluh faskes kalibrasi dan delapan
        belas faskes uji, dengan persentil sembilan puluh delapan klaim bersih
        15.233 melawan 30.937. Dua kali lipat. Kelompok yang sehat punya ratusan
        faskes dan rasionya mendekati satu. Jaminan konformal menuntut
        keterpertukaran, dan ukuran contoh yang menentukan adalah jumlah faskes,
        bukan jumlah klaim.
      yang_kami_nyatakan: >-
        Bukan bahwa faskes di daerah tertinggal bersih. Melainkan bahwa kami
        belum cukup tahu untuk berjanji apa apa tentang mereka. Mereka tetap
        masuk pemeriksaan lewat porsi sampel acak lima persen.

    pelajaran_metodologis:
      bunyi: 'Lima dugaan sebab berturut turut salah, dan pengukuran yang menyelesaikan tiap kalinya'
      daftar:
        - 'Rumus penggabungan skor'
        - 'Penutupan bidang pada kepala tarif'
        - 'Ukuran model sebagai penghambat'
        - 'Kepala mana yang menyebabkan ketimpangan'
        - 'Bahwa ketimpangan berarti rumah sakit ditandai berlebih, padahal FKTP yang ditandai terlalu jarang'
      artinya: >-
        Tidak ada satu pun yang diselesaikan oleh dugaan berikutnya. Semuanya
        diselesaikan dengan mengukur lebih dulu. Ini bukan pelajaran umum yang
        enak dikutip, ini yang benar benar terjadi pada dua belas percobaan dan
        tercatat urutannya di nalar/TEMUAN.md.

    yang_masih_terbuka:
      - 'Kontrol negatif LEIE, terhalang di sisi data'
      - 'Uji latih di sintetis uji di nyata, gagal terhadap ambang yang kami tetapkan sendiri'
      - 'T1 pada seribu klaim, 1,896 kali melawan target dua kali'
      - 'T3, pohon normatif tetap mengalahkan transformer yang kami rancang'
      - 'Pemisahan menurut waktu, belum dijalankan'
  # ---------------------------------------------------------------------------
  # Seberapa kokoh angkanya. Diperiksa paling akhir, dan mengubah cara
  # seluruh angka di atas boleh dikutip.
  # ---------------------------------------------------------------------------
  kekokohan_angka:

    kestabilan_benih:
      cara: 'Lima benih acak, seluruh pipa dijalankan ulang dari pembangkitan sampai penskoran'
      hasil:
        rupiah_pada_seribu_klaim:
          rata: 'Rp 1.398 juta'
          sebaran_relatif: '40,0 persen'
          terendah: 'Rp 841 juta'
          tertinggi: 'Rp 2.304 juta'
        porsi_batas_atas:
          rata: 0.752
          sebaran_relatif: '10,1 persen'
        peningkatan_atas_mesin_aturan:
          rata: 1.853
          simpangan: 0.155
        kelebihan_berarah:
          rata: 1.341
          tertinggi: 1.579
          lulus_di_kelima_benih: true
      akibat_yang_paling_penting: >-
        Angka rupiah bergeser empat puluh persen antar benih, jadi Rp 1.249,3
        juta tidak boleh dikutip sendirian. Yang stabil adalah porsi batas
        atas, dan itu memang alasan kami memilihnya sebagai metrik utama sejak
        rancangan. Sekarang alasan itu punya bukti, bukan hanya niat.
      akibat_untuk_keadilan: >-
        Kelebihan berarah lulus di kelima benih, tertinggi 1,579 melawan batas
        dua. Perbaikan penyaringan kontaminasi itu nyata, bukan kebetulan satu
        benih.

    kepekaan_prevalensi:
      cara: 'Empat tingkat prevalensi faskes nakal, dari delapan sampai tiga puluh lima persen'
      daftar:
        - prevalensi: 0.08
          klaim_curang: 0.008
          rupiah_jt: 145
          porsi_batas_atas: 0.711
          atas_aturan: 1.775
        - prevalensi: 0.15
          klaim_curang: 0.030
          rupiah_jt: 927
          porsi_batas_atas: 0.767
          atas_aturan: 1.506
        - prevalensi: 0.22
          klaim_curang: 0.045
          rupiah_jt: 1249
          porsi_batas_atas: 0.713
          atas_aturan: 1.896
        - prevalensi: 0.35
          klaim_curang: 0.067
          rupiah_jt: 2099
          porsi_batas_atas: 0.803
          atas_aturan: 1.676
      artinya: >-
        Rupiahnya turun sembilan kali lipat dari ujung ke ujung, sedangkan
        porsi batas atas hampir tidak bergerak. Mutu detektornya tidak
        bergantung pada seberapa banyak kecurangan yang ada, yang bergantung
        hanya besar uangnya. Artinya angka mutu kami tidak dibesarkan oleh
        asumsi prevalensi yang mungkin terlalu tinggi.
      batas_yang_ditemukan: >-
        Pada tiga puluh lima persen, kelebihan berarah naik ke 2,025 dan
        melewati batas dua. Jadi jaminan keadilan kami berlaku sampai sekitar
        dua puluh dua persen dan mulai selip di atas itu.

  # ---------------------------------------------------------------------------
  # Pelaku yang beradaptasi, dan apa yang bisa kami lakukan setelah T6 gagal
  # ---------------------------------------------------------------------------
  pelaku_beradaptasi:

    tiga_pelaku:
      - jenis: 'serakah'
        diambil_jt: 1793
        tertangkap: 0.785
        lolos_jt: 385
      - jenis: 'hati hati, bisa melihat skor detektor'
        diambil_jt: 273
        tertangkap: 0.0
        lolos_jt: 273
      - jenis: 'menyebar'
        diambil_jt: 1268
        tertangkap: 0.544
        lolos_jt: 579
    bacaan: >-
      Yang harus dilihat kolom terakhir, bukan kolom pertama. Pelaku menyebar
      meloloskan lebih banyak uang daripada pelaku serakah.

    kepala_kelompok_sebaya_juga_gagal:
      janji_di_rancangan: >-
        Rancangan sudah menyiapkan jawabannya. Deteksi per klaim akan gagal
        menangkap pelaku menyebar, dan yang seharusnya menangkap adalah kepala
        kelompok sebaya. Kalimat berikutnya kami tulis sendiri, bahwa kalau
        kepala itu juga gagal kami akan menuliskan gagal.
      hasilnya: >-
        Satu rumah sakit dibuat menagih tepat di bawah garis pada seluruh
        klaim yang bisa diserang. Ia mengambil Rp 36,4 juta, sepuluh persen
        dari seluruh tagihannya. Peringkat profilnya 221 dari 238 sebelum
        diserang, dan 221 sesudahnya.
      sebabnya_batas_informasi_bukan_kekurangan_penaksir:
        geseran_rata_rata_akibat_serangan: 'Rp 0,156 juta'
        lantai_deteksi_pada_233_klaim: 'Rp 0,189 juta'
        simpangan_dalam_faskes: 'Rp 1,44 juta'
        simpangan_antar_faskes: 'Rp 0,076 juta'
        kesimpulan: >-
          Derau di dalam satu faskes hampir dua puluh kali lebih besar
          daripada sinyal antar faskes. Serangannya berada di bawah lantai
          derau, jadi tidak ada penaksir rata rata rupiah yang bisa
          melihatnya, berapa pun pintarnya.
      dua_perbaikan_yang_dicoba_dan_gagal:
        - 'Memakai selisih yang tidak dipotong di nol. Peringkat tidak bergerak, dan presisi tugas biasa turun dari 1,000 ke 0,760.'
        - 'Membuang klaim yang kelompoknya menahan diri. Juga tidak menolong.'

    ukuran_posisi_terhadap_garis:
      apa_itu: >-
        Selisih dibagi ambang kelompoknya sendiri. Nol berarti persis sebesar
        yang didukung bukti, satu berarti persis di ambang.
      mengapa_perlu: >-
        Kalau pelakunya menagih tepat di bawah garis, yang harus diukur adalah
        jaraknya ke garis, bukan rupiahnya. Pada serangan yang sama, ukuran
        ini bergeser 3,6 simpangan baku di dalam faskes itu, sedangkan rata
        rata rupiah tenggelam di bawah derau.
      dua_daftar_yang_saling_melengkapi:
        antrean_rupiah:
          presisi_pada_25_teratas: 1.000
          terhadap_pelaku_beradaptasi: 'buta total, peringkat 221 tetap 221'
        daftar_pantau_posisi:
          presisi_pada_25_teratas: 0.240
          terhadap_pelaku_beradaptasi: 'peringkat 223 naik ke 87 dari 238'
        mengapa_tidak_digabung: >-
          Keduanya menjawab pertanyaan yang berbeda dan masing masing buruk di
          tempat yang lain kuat. Menggabungkannya jadi satu skor akan merusak
          keduanya. Yang pertama bertanya siapa menagih lebih daripada yang
          didukung bukti. Yang kedua bertanya siapa menagih terus menerus
          persis sebanyak yang masih diizinkan.
        sifat_daftar_kedua: >-
          Bukan tuduhan. Ia menandai faskes yang pola penagihannya menempel
          pada batas, yang bisa berarti pengodean yang rapi dan bisa berarti
          sesuatu yang lain. Yang dituntut darinya penjelasan, bukan
          pengembalian.
      seberapa_jauh_ini_menolong: >-
        Peringkat 87 dari 238 masih di luar antrean audit dua puluh lima
        teratas. Jadi ini peredaman sebagian, bukan penyelesaian. Tapi
        pergerakan dari 223 ke 87 pada pencurian sepuluh persen tagihan itu
        nyata, sedangkan daftar rupiah memberi nol pergerakan.
      kalibrasi_yang_sempat_meleset_lalu_dibetulkan:
        gejalanya: >-
          Ukuran posisi menandai 9,2 persen faskes berubah pada data yang
          tidak memuat perubahan apa pun, hampir dua kali nominal lima persen.
        dua_dugaan_yang_gugur:
          - 'Klaim yang kelompoknya menahan diri. Porsinya stabil sepanjang waktu, dan membuangnya justru menaikkan angkanya ke 9,6 persen.'
          - 'Nilai yang seri pada pengurutan. Sudah diputus acak sejak awal.'
        sebab_yang_benar: >-
          Posisi dua klaim milik pasien yang sama berkorelasi 0,135, sedangkan
          dua klaim yang diambil acak berkorelasi nol. Pasien yang sama datang
          berdekatan waktunya, jadi korelasi itu tersalin menjadi struktur
          waktu yang tidak pernah dihancurkan oleh pengacakan per klaim. Uji
          permutasi mengandaikan klaim saling terpertukarkan, dan klaim dari
          satu pasien memang tidak.
        perbaikannya: 'Yang diacak urutan blok pasien, bukan isinya'
        sesudah_diperbaiki:
          ukuran_posisi: 'dari 9,2 persen menjadi 6,1 persen'
          selisih_rupiah: 'dari 6,1 persen menjadi 4,8 persen'
        harga_yang_kami_bayar: >-
          Kalibrasi yang benar menurunkan angka daya temu kami sendiri. Kepala
          K6 pada selisih rupiah turun dari 22 persen menjadi 16,7 persen, dan
          pada ambang satu persen menjadi nol. Jadi kesimpulan tentang K6
          diperbaiki ke bawah: pada tugas menemukan kemunculan kecurangan,
          kepala ini praktis tidak punya daya pada ukuran faskes yang kami
          punya. Angka lama dibesarkan oleh uji yang mis-kalibrasi.
        yang_bertahan: >-
          Pada pelaku beradaptasi, dengan laju salah tuduh yang sudah kembali
          ke nominal, rumah sakit yang mengambil Rp 30,9 juta memberi nilai p
          0,0125 pada ukuran posisi dan 0,0723 pada selisih rupiah. Posisi
          menangkap yang rupiah lewatkan. Dua rumah sakit lain yang mengambil
          jauh lebih sedikit terlewat oleh keduanya.

    audit_acak_berbobot_posisi_tidak_menolong: >-
      Dicoba menimbang sampel audit acak menurut posisi, dengan harapan
      mengejar pelaku yang menempel di garis. Hasilnya lebih buruk daripada
      acak seragam, 3,3 persen melawan 4,4 persen uang tertangkap. Sebabnya
      klaim yang diserang berkerumun pada posisi yang mirip mirip, jadi
      menimbang menurut posisi tidak memusatkan anggaran audit ke klaim yang
      nilainya paling besar.

    yang_kami_nyatakan_dengan_jujur: >-
      Detektor kami membuat kecurangan jauh lebih mahal daripada mesin aturan,
      dan tidak membuatnya berhenti sepadan. Rumah sakit yang mau membayar
      ongkos mencoba coba sampai tahu di mana garisnya masih bisa mengambil
      uang tanpa satu klaim pun ditandai. Itu ditulis di sini supaya siapa pun
      yang memakai sistem ini tahu apa yang tidak dijaminnya.
