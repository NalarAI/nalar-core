      NHIS, HIRA, dan asosiasi asuransi.
    catatan_yang_paling_berguna: >-
      Laporan yang sama menyebut berbagi informasi antar-lembaga masih terbatas, dan
      infrastruktur untuk memeriksa silang data antar-lembaga belum terbangun. Jadi
      negara dengan sistem paling matang sekali pun masih tersandung di masalah yang
      sama dengan Indonesia, yaitu data yang terpisah-pisah.
    sumber: ['https://e-hir.org/journal/view.php?number=651&viewtype=pubreader', 'https://www.insurancebusinessmag.com/asia/news/technology/south-korea-turns-to-ai-as-insurance-fraud-losses-mount-577939.aspx']
    status: terverifikasi
