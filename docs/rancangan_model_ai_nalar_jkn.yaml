      data klaim Taiwan banyak dipakai sebagai rujukan deteksi kecurangan di sistem
      pembayar tunggal.
    status: dari_pustaka
    catatan: 'Detail sistem deteksinya perlu diverifikasi ulang sebelum masuk proposal.'

  belanda:
    lembaga: 'Asuransi kesehatan swasta yang diatur ketat, contoh yang dikutip DSW dengan sekitar 600.000 pemegang polis'
    hal_yang_relevan: 'Pemakaian analitik untuk kecurangan dan pemanfaatan berlebih pada skala penanggung menengah.'
    status: dari_pustaka
    pelajaran: >-
      Skala 600.000 peserta menunjukkan pendekatan ini tidak mensyaratkan skala nasional.
      Artinya uji coba di satu wilayah BPJS masuk akal secara metode.

  australia:
    lembaga: 'Services Australia dan sebelumnya Health Insurance Commission'
    hal_yang_relevan: >-
      Data Medicare Benefits Schedule dan Pharmaceutical Benefits Scheme dipakai luas
      untuk pemodelan pemanfaatan dan profil penyedia.
    status: dari_pustaka

  eropa_umum:
    angka: 'Insurance Europe memperkirakan kecurangan yang terdeteksi dan tidak terdeteksi merugikan sekitar 13 miliar euro per tahun.'
    status: dari_pustaka

  ringkasan_lintas_negara:
    yang_konsisten_berhasil:
      - hal: 'Menggeser pemeriksaan ke sebelum pembayaran'
        bukti: 'Amerika lewat FPS, dan itu yang paling banyak menghasilkan angka penghematan'
        bisa_dipindah_ke_indonesia: 'Butuh perubahan regulasi. Ditulis sebagai P1 di bagian 8.'
      - hal: 'Membandingkan penyedia terhadap sejawatnya, bukan terhadap ambang tetap'
        bukti: 'Korea lewat penelaahan sejawat, Amerika lewat profil penyedia'
        bisa_dipindah_ke_indonesia: 'Ya, dan ini bagian yang paling siap kami kerjakan.'
      - hal: 'Mengukur hasil sebagai nilai yang diselamatkan dibagi biaya investigasi'
        bukti: 'NHS 3 banding 1'
        bisa_dipindah_ke_indonesia: 'Ya, dan wajib. Bagian 13.2.'
      - hal: 'Menyediakan data klaim teranonimkan untuk riset publik'
        bukti: 'CMS lewat SynPUF dan data pemanfaatan penyedia, HIRA lewat OMOP, BPJS lewat Data Sampel'
        bisa_dipindah_ke_indonesia: 'Sudah dimulai. Bisa diperluas.'
    yang_tidak_bisa_langsung_dipindah:
      - hal: 'Daftar penyedia yang dikecualikan sebagai label kecurangan'
        penjelasan: >-
          Amerika punya List of Excluded Individuals and Entities dari OIG. Itu satu
          satunya sumber label kecurangan penyedia yang terbuka di dunia, dan seluruh
          riset deteksi kecurangan Medicare bertumpu padanya. Indonesia tidak punya
          padanan yang terbuka.
        akibat_untuk_kami: >-
          Kami tidak bisa meniru pendekatan berbasis label. Ini bukan kekurangan
          proposal, ini kenyataan yang membentuk arsitektur. Lihat bagian 10.5.
      - hal: 'Aturan pasangan kode yang lengkap'
        penjelasan: 'Amerika punya National Correct Coding Initiative. Indonesia belum punya padanan selengkap itu.'
        akibat_untuk_kami: 'Model kami bisa menurunkan calon aturan itu dari data. Produk sampingan yang bernilai.'
      - hal: 'Bukti klinis melekat pada klaim'
        penjelasan: >-
          Beberapa sistem mensyaratkan lampiran bukti untuk klaim bernilai tinggi.
          Klaim INA-CBG umumnya tidak membawa nilai laboratorium.
        akibat_untuk_kami: 'Tiga modus jadi tidak terjangkau. Ditulis apa adanya di bagian 4.'
    yang_gagal_atau_diragukan:
      - hal: 'Mengukur dampak setelah sistem berjalan'
        bukti: 'GAO menemukan CMS belum mendefinisikan ukuran efektivitas bertahun-tahun setelah FPS berjalan'
        pelajaran: 'Definisikan di depan, di dalam proposal.'
      - hal: 'Menjanjikan angka penghematan yang presisi'
        bukti: 'NHS memberi rentang sepuluh kali lipat'
        pelajaran: 'Kami akan menyatakan dampak sebagai nilai per audit, bukan total nasional.'

# =============================================================================
# 6. CELAH DAN TESIS
# =============================================================================

celah_dan_tesis:

  celah_yang_kami_lihat:
    - celah: 'Hampir semua sistem yang ada bertumpu pada label'
      penjelasan: >-
        Riset deteksi kecurangan Medicare hampir seluruhnya memakai LEIE sebagai label.
        Ini menimbulkan dua masalah yang jarang dibahas. Pertama, label itu hasil
        pemilihan audit, jadi model belajar meniru cara audit lama memilih. Kedua,
        penyedia yang dikecualikan adalah yang tertangkap, bukan yang curang. Model
        jadi belajar mendeteksi ketertangkapan.
      mengapa_ini_peluang: >-
        Indonesia tidak punya label sama sekali. Anehnya, itu memaksa kami memilih
        pendekatan yang secara ilmiah lebih bersih, yaitu memodelkan kewajaran.
        Keterbatasan berubah jadi posisi.
    - celah: 'Skor kecurangan tidak bisa ditindaklanjuti'
      penjelasan: >-
        Sebagian besar sistem menghasilkan probabilitas. Auditor tidak bisa berbuat
        apa-apa dengan angka 0,87. Rumah sakit tidak bisa membantah angka 0,87.
      mengapa_ini_peluang: >-
        Keluaran yang benar untuk pembayar adalah selisih rupiah beserta alasannya.
        Bukan tarif ini curang, tapi tarif ini ditagih pada kelompok X, sedangkan
        bukti yang menyertainya mendukung kelompok Y, selisihnya sekian rupiah.
        Itu bisa ditagih, bisa dibantah, dan bisa diadili.
    - celah: 'Tidak ada jaminan pada tingkat salah tuduh'
      penjelasan: >-
        Sistem deteksi umumnya melaporkan tingkat positif palsu yang terukur pada
        himpunan uji. Itu bukan jaminan. Begitu distribusi bergeser, angkanya tidak
        berlaku lagi.
      mengapa_ini_peluang: >-
        Prediksi konformal memberi jaminan bebas distribusi pada tingkat penandaan
        untuk klaim yang bersih, dengan syarat yang jelas dan bisa diuji. Ini pembeda
        yang bisa dijelaskan ke juri non-teknis dalam satu kalimat, dan bisa dibuktikan
        ke juri teknis dalam sepuluh baris kode.
    - celah: 'Tidak ada yang menguji ketahanan terhadap pelaku yang beradaptasi'
      penjelasan: >-
        Kecurangan bukan proses alam. Ia respons manusia terhadap sistem pengawasan.
        Begitu detektor dipasang, pelaku bergeser. Hampir tidak ada riset deteksi
        kecurangan kesehatan yang mengukur ini.
      mengapa_ini_peluang: >-
        Karena data kami sintetis dan pembangkitnya kami tulis sendiri, kami bisa
        menjalankan pelaku yang beradaptasi terhadap detektor kami. Ini justru
        keunggulan dari keterbatasan tidak punya data asli.

  tesis:
    kalimat_inti: >-
      Kecurangan klaim tidak perlu dikenali dari contohnya. Ia bisa dikenali dari
      seberapa jauh sebuah klaim menyimpang dari apa yang dibutuhkan untuk menjelaskan
      dirinya sendiri.
    penjabaran: >-
      Kalau sebuah model bisa menebak isi klaim dari sisa isinya, maka klaim yang jujur
      akan mudah ditebak dan klaim yang dikarang akan sulit ditebak. Kesulitan menebak
      itu bisa diukur, dan bisa diterjemahkan ke rupiah lewat tabel tarif. Satu model
      seperti itu melayani tiga keluarga mekanisme sekaligus, karena yang berubah hanya
      bagian mana yang ditutup dan seberapa lebar cakupan yang dilihat.
    apa_yang_membuat_tesis_ini_bisa_salah:
      - 'Kalau klaim jujur di Indonesia ternyata sama sulitnya ditebak, karena mutu pengkodean rendah dan bervariasi antar rumah sakit.'
      - 'Kalau kecurangan sudah begitu meluas sehingga menjadi pola mayoritas, dan model malah mempelajarinya sebagai kewajaran.'
      - 'Kalau bukti klinis tidak pernah masuk ke data, sehingga tidak ada yang bisa dipakai menebak.'
    bagaimana_kami_mengujinya: 'Bagian 13.3 menuliskan tiga uji yang masing-masing bisa menjatuhkan tesis ini.'

# =============================================================================
# 7. YANG HARUS BERUBAH DI LUAR MODEL
# =============================================================================

perubahan_sistem:

  catatan: >-
    Model tidak bisa dipasang di atas proses yang tidak berubah. Bagian ini menuliskan
    perubahan yang dibutuhkan, diurutkan menurut seberapa besar pengaruhnya terhadap
    kemampuan model. Tiap butir menyebut apakah model tetap berguna tanpa perubahan itu.

  P1:
    nama: 'Jendela tahan bayar untuk klaim berisiko tinggi'
    yang_berubah: >-
      Klaim yang masuk peringkat teratas ditahan beberapa hari kerja untuk konfirmasi,
      bukan dibayar lalu ditagih balik.
    mengapa: >-
      Setelah uang keluar, pengembaliannya lambat dan sering tidak terjadi. Pergeseran
      ini adalah satu satunya perubahan yang terbukti menghasilkan angka penghematan
      besar di Amerika.
    hambatan: 'Perlu dasar hukum, dan berisiko mengganggu arus kas rumah sakit yang jujur.'
    mitigasi: >-
      Terapkan hanya pada persentil teratas, dengan batas waktu tahan yang tegas dan
      kompensasi keterlambatan bila terbukti tidak ada masalah. Jaminan konformal di
      bagian 10.9 justru dirancang untuk membuat kebijakan ini bisa dipertanggungjawabkan.
    model_tetap_berguna_tanpa_ini: 'Ya, sebagai pemilih sampel audit pasca klaim. Nilainya lebih kecil tapi nyata.'

  P2:
    nama: 'Bukti klinis terstruktur ikut dalam klaim bernilai tinggi'
    yang_berubah: >-
      Untuk klaim di atas ambang nilai tertentu, faskes mengirim hasil laboratorium
      bernilai numerik, daftar obat, dan bahan habis pakai dalam format terstruktur
      lewat jalur interoperabilitas yang sudah ada.
    mengapa: >-
      Tiga modus, M15, M18, dan M20, tidak terjangkau tanpa ini. Dua modus besar,
      M04 dan M06, hanya terjangkau sebagian. Dengan nilai numerik, uji penumpukan
      di ambang menjadi mungkin, dan itu salah satu sinyal terkuat di seluruh katalog.
    hambatan: 'Beban pelaporan bagi rumah sakit, dan kesiapan sistem informasi rumah sakit yang tidak merata.'
    mitigasi: >-
      Batasi pada klaim bernilai tinggi. Manfaatkan SATUSEHAT yang sudah menjadi jalur
      pertukaran data kesehatan nasional, sehingga rumah sakit tidak membangun jalur baru.
    model_tetap_berguna_tanpa_ini: 'Ya, tapi kekuatannya untuk keluarga A turun banyak. Ini dependensi terbesar.'
    status_dependensi: 'kritis'

  P3:
    nama: 'Penanda kehadiran pasien yang tidak bisa dipinjam'
    yang_berubah: 'Konfirmasi kehadiran pasien pada saat pelayanan, bukan hanya pada saat pendaftaran.'
    mengapa: 'Phantom billing adalah klaim tanpa pasien. Selama kehadiran tidak tercatat, ia hanya terlihat sebagai kejanggalan volume.'
    hambatan: 'Biaya perangkat, dan risiko menghambat pasien gawat darurat.'
    mitigasi: 'Kecualikan gawat darurat. Mulai dari layanan berulang bernilai tinggi seperti fisioterapi dan hemodialisis, yang persis menjadi titik kasus 2024.'
    model_tetap_berguna_tanpa_ini: 'Ya, tapi M06 tetap lemah.'

  P4:
    nama: 'Hasil audit ditulis balik sebagai label'
    yang_berubah: >-
      Setiap audit, apa pun hasilnya, menghasilkan catatan terstruktur. Klaim mana,
      temuan apa, nilai berapa, dan apakah dibantah faskes.
    mengapa: >-
      Ini yang mengubah sistem tanpa label menjadi sistem berlabel dalam waktu satu
      sampai dua tahun. Tanpa ini, model akan selamanya berjalan tanpa pengawasan,
      dan tidak pernah belajar dari kerja auditor.
    hambatan: 'Hampir tidak ada. Ini murni disiplin pencatatan.'
    mitigasi: 'Tidak perlu.'
    model_tetap_berguna_tanpa_ini: 'Ya, tapi tidak pernah membaik.'
    catatan: >-
      Ini butir dengan rasio manfaat terhadap biaya paling tinggi di seluruh daftar.
      Kalau BPJS hanya boleh mengambil satu rekomendasi dari proposal ini, ambil ini.

  P5:
    nama: 'Hak jawab faskes sebelum pemotongan'
    yang_berubah: >-
      Faskes menerima alasan penandaan dalam bentuk yang bisa dibaca, dan punya waktu
      membantah sebelum ada konsekuensi finansial.
    mengapa: >-
      Melindungi rumah sakit yang jujur, mengurangi sengketa, dan menghasilkan label
      bermutu tinggi karena bantahan yang berhasil adalah contoh negatif yang bersih.
    hambatan: 'Menambah waktu proses.'
    model_tetap_berguna_tanpa_ini: 'Ya, tapi risiko politiknya naik tajam.'
    dampak_ke_desain_model: >-
      Ini yang mewajibkan model menghasilkan penjelasan, bukan hanya skor. Diatur di
      bagian 10.14.

  P6:
    nama: 'Pemisahan tegas antara skor model dan keputusan sanksi'
    yang_berubah: 'Skor model tidak boleh menjadi dasar tunggal sanksi apa pun.'
    mengapa: >-
      Permenkes 16/2019 menempatkan keputusan pada Tim PK-JKN. Model yang menggantikan
      keputusan itu akan ditolak secara kelembagaan, dan seharusnya ditolak.
    model_tetap_berguna_tanpa_ini: 'Pertanyaannya terbalik. Tanpa pemisahan ini, model tidak boleh dipakai.'

  P7:
    nama: 'Tata kelola model yang bergerak uang'
    yang_berubah: >-
      Model penantang yang berjalan paralel, pemantauan pergeseran distribusi, validasi
      ulang berkala, dan catatan versi yang bisa diaudit.
    mengapa: 'Model yang memengaruhi pembayaran adalah pengendali keputusan finansial, dan harus diperlakukan seperti itu.'
    model_tetap_berguna_tanpa_ini: 'Untuk uji coba ya. Untuk produksi tidak.'

  urutan_pengerjaan_yang_kami_sarankan:
    - 'P4 lebih dulu, karena murah dan tanpa dia semuanya mandek.'
    - 'P2 berikutnya, karena membuka tiga modus dan memperkuat dua modus terbesar.'
    - 'P5 bersamaan dengan penerapan model, karena tanpa hak jawab penerapan akan macet.'
    - 'P1 setelah model terbukti pada audit pasca klaim, bukan sebelum.'
    - 'P3, P6, P7 mengikuti.'

# =============================================================================
# 8. PEMBAGIAN KERJA MANUSIA DAN MESIN
# =============================================================================

pembagian_kerja:

  prinsip: >-
    Mesin mengerjakan yang berulang dan berskala. Manusia mengerjakan yang menuntut
    penilaian dan tanggung jawab. Garis pemisahnya bukan soal kecanggihan, tapi soal
    siapa yang menanggung akibat kalau salah.

  dikerjakan_mesin_sepenuhnya:
    - tugas: 'Memeriksa duplikasi klaim'
      alasan: 'Deterministik, tidak ada penilaian yang perlu diambil.'
      teknologi: 'Indeks unik dan hash. Bukan model.'
    - tugas: 'Menghitung kewajaran isi klaim terhadap bukti'
      alasan: 'Butuh membandingkan jutaan klaim. Manusia tidak punya distribusi acuan di kepalanya.'
      teknologi: 'Kepala K1 dan K2, bagian 10.7.'
    - tugas: 'Menyusun kelompok sebaya faskes'
      alasan: 'Kelas administratif tidak mencerminkan kesamaan sebenarnya. Pengelompokan dari data lebih jujur.'
      teknologi: 'Kepala K4, bagian 10.9.'
    - tugas: 'Mengurutkan antrean audit menurut ekspektasi nilai yang bisa diselamatkan'
      alasan: 'Ini masalah optimasi dengan anggaran terbatas.'
      teknologi: 'Bagian 10.13.'
    - tugas: 'Memantau pergeseran distribusi'
      alasan: 'Berjalan terus menerus, tidak menarik untuk manusia, dan manusia akan melewatkannya.'

  dikerjakan_mesin_lalu_ditinjau_manusia:
    - tugas: 'Menyusun alasan penandaan'
      peran_mesin: 'Menunjuk bukti mana yang membuat klaim mencurigakan, dan berapa selisih rupiahnya.'
      peran_manusia: 'Menilai apakah alasan itu masuk akal secara klinis.'
    - tugas: 'Menandai faskes untuk pemeriksaan mendalam'
      peran_mesin: 'Peringkat dan bukti pendukung.'
      peran_manusia: 'Memutuskan apakah pemeriksaan dilakukan, dan bertanggung jawab atas keputusannya.'
    - tugas: 'Menetapkan ambang penandaan'
      peran_mesin: 'Menghitung ambang yang memenuhi jaminan tingkat salah tuduh yang diminta.'
      peran_manusia: 'Menetapkan tingkat salah tuduh yang bisa diterima. Ini keputusan kebijakan, bukan teknis.'

  tetap_di_manusia:
    - 'Memutuskan sebuah klaim curang.'
    - 'Berhadapan dengan rumah sakit.'
    - 'Menafsirkan konteks klinis yang tidak masuk ke data.'
    - 'Menjatuhkan sanksi.'
    - 'Menentukan apakah suatu pola baru layak jadi aturan.'

  yang_berubah_untuk_verifikator: >-
    Hari ini verifikator memeriksa klaim menurut urutan masuk dan menurut aturan.
    Dengan model, urutannya berubah menjadi menurut ekspektasi nilai yang bisa
    diselamatkan, dan tiap klaim datang dengan calon alasan. Yang tidak berubah adalah
    siapa yang memutuskan. Ini penting disampaikan sejak awal, karena sistem yang
    terasa mengancam pekerjaan akan disabotase pelan-pelan oleh penggunanya sendiri.

# =============================================================================
# 9. ARSITEKTUR MODEL
# Ini inti dokumen. Semua bagian sebelumnya adalah alasan mengapa bagian ini
# berbentuk seperti ini.
# =============================================================================

arsitektur:

  # ---------------------------------------------------------------------------
  # 9.1 Ringkasan
  # ---------------------------------------------------------------------------
  ringkasan:
    satu_kalimat: >-
      Satu tulang punggung yang belajar menebak isi klaim dari sisa isinya, dengan
      enam kepala yang menerjemahkan kesulitan menebak menjadi rupiah, waktu, dan
      peringkat entitas.

    alur_dari_klaim_sampai_keputusan:
      - langkah: 1
        nama: 'Penyaring deterministik'
        isi: 'Duplikasi, kode tidak sah, aritmetika tidak mungkin. Ditangani aturan, bukan model.'
        alasan: 'Murah, pasti, dan mengeluarkan kasus mudah dari antrean sebelum model bekerja.'
      - langkah: 2
        nama: 'Perangkaian episode'
        isi: 'Klaim disusun jadi episode, episode disusun jadi lintasan peserta.'
      - langkah: 3
        nama: 'Penokenan'
        isi: 'Episode diubah jadi barisan token bertipe.'
      - langkah: 4
        nama: 'Tulang punggung'
        isi: 'Encoder menghasilkan representasi episode dan representasi tiap token.'
      - langkah: 5
        nama: 'Enam kepala'
        isi: 'Konsistensi bukti, tarif kontrafaktual, integritas waktu, kelompok sebaya, kemiripan, dan kepatuhan entitas.'
      - langkah: 6
        nama: 'Penggabungan dan kalibrasi'
        isi: 'Skor digabung, lalu dikalibrasi konformal supaya tingkat penandaan pada klaim bersih terjamin.'
      - langkah: 7
        nama: 'Peringkat audit'
        isi: 'Diurutkan menurut ekspektasi rupiah bersih yang bisa diselamatkan, bukan menurut probabilitas.'
      - langkah: 8
        nama: 'Penjelasan'
        isi: 'Tiap penandaan membawa bukti pendukung dan nilai selisih yang bisa dibantah.'

  # ---------------------------------------------------------------------------
  # 9.2 Prinsip desain
  # ---------------------------------------------------------------------------
  prinsip_desain:
    - prinsip: 'Model tidak boleh butuh label untuk mulai bekerja'
      konsekuensi: 'Pralatih memakai tujuan rekonstruksi diri. Label, kalau ada nanti, hanya menyetel kepala.'
    - prinsip: 'Keluaran harus berdenominasi rupiah'
      konsekuensi: 'Kepala K2 memperkirakan tarif kontrafaktual, bukan sekadar probabilitas.'
    - prinsip: 'Salah tuduh harus punya batas yang dijamin'
      konsekuensi: 'Kalibrasi konformal wajib, bukan tambahan.'
    - prinsip: 'Harus muat di mesin sederhana'
      konsekuensi: >-
        Sasaran sekitar dua puluh juta parameter. Bisa dilatih di satu kartu grafis
        kelas konsumen. Alasan lengkapnya di bagian 15.
    - prinsip: 'Setiap komponen harus bisa dimatikan dan diukur kontribusinya'
      konsekuensi: 'Ablasi ditulis di depan, bagian 13.5.'
    - prinsip: 'Kalau aturan sederhana sudah cukup, pakai aturan'
      konsekuensi: >-
        Deduplikasi, kode tidak sah, dan kelas rawat melebihi kapasitas fisik ditangani
        langkah 1. Model tidak dipakai untuk hal yang bisa diselesaikan pemeriksaan biasa.

  # ---------------------------------------------------------------------------
  # 9.3 Representasi episode
  # ---------------------------------------------------------------------------
  representasi_episode:

    gagasan: >-
      Satu episode pelayanan diubah menjadi barisan token bertipe, mirip kalimat, tapi
      tiap token tahu ia berasal dari bidang mana. Bidang itu yang nanti dipakai untuk
      menutup bagian tertentu dan menebaknya dari bagian lain.

    mengapa_bukan_baris_tabel: >-
      Klaim tidak berbentuk tabel lebar yang rapi. Jumlah diagnosis sekunder berbeda
      beda, jumlah obat berbeda beda, jumlah pemeriksaan berbeda beda. Kalau dipaksa
      jadi kolom tetap, kita harus memotong di angka sembarang dan mengisi sisanya
      dengan nilai kosong. Barisan token menangani panjang berubah tanpa memotong.

    daftar_bidang:
      - kode: 'PSN'
        nama: 'Peserta'
        isi: ['pita umur', 'jenis kelamin', 'segmen kepesertaan', 'hak kelas', 'provinsi domisili', 'pita lama menjadi peserta']
        catatan_privasi: 'Tidak ada nomor kartu, tidak ada nama, tidak ada tanggal lahir tepat.'
      - kode: 'RWY'
        nama: 'Riwayat'
        isi: ['diagnosis kronis yang pernah tercatat', 'jumlah episode dalam 12 bulan terakhir', 'pita biaya kumulatif']
        catatan: 'Diambil dari lintasan peserta, bukan dari klaim ini.'
      - kode: 'FKS'
        nama: 'Fasilitas kesehatan'
        isi: ['jenis', 'kelas', 'kepemilikan', 'pita jumlah tempat tidur', 'wilayah', 'status daerah tertinggal']
      - kode: 'WKT'
        nama: 'Waktu'
        isi: ['bulan', 'hari dalam minggu saat masuk', 'apakah hari libur', 'pita lama rawat', 'selisih hari dari episode sebelumnya']
      - kode: 'DXP'
        nama: 'Diagnosis primer'
        isi: ['satu kode ICD-10']
      - kode: 'DXS'
        nama: 'Diagnosis sekunder'
        isi: ['nol sampai sembilan kode ICD-10']
        catatan: 'Bidang ini yang paling sering menjadi sasaran upcoding.'
      - kode: 'PRC'
        nama: 'Prosedur'
        isi: ['nol sampai enam kode ICD-9-CM']
      - kode: 'OBT'
        nama: 'Obat'
        isi: ['kode ATC tingkat lima', 'pita jumlah hari terapi']
      - kode: 'LAB'
        nama: 'Pemeriksaan penunjang'
        isi: ['kode pemeriksaan', 'pita nilai hasil relatif terhadap rentang rujukan']
        catatan: >-
          Bidang ini sering kosong pada data yang mengalir hari ini. Model harus bekerja
          baik saat ia kosong, dan jauh lebih baik saat ia terisi. Diuji di bagian 13.5.
      - kode: 'BHP'
        nama: 'Bahan habis pakai dan alat kesehatan'
        isi: ['kode barang', 'pita jumlah']
      - kode: 'TRF'
        nama: 'Tarif'
        isi: ['kode INA-CBG', 'tingkat keparahan', 'kelas rawat ditagih', 'pita nilai tarif', 'pita nilai tagihan rumah sakit']
        catatan: 'Ini bidang yang ditutup saat kita ingin tahu tarif seperti apa yang didukung bukti.'
      - kode: 'RJK'
        nama: 'Rujukan'
        isi: ['ada atau tidak', 'faskes perujuk', 'pita jarak', 'diagnosis pada rujukan']

    aturan_penyusunan_barisan:
      urutan_bidang: ['PSN', 'RWY', 'FKS', 'WKT', 'RJK', 'DXP', 'DXS', 'PRC', 'OBT', 'LAB', 'BHP', 'TRF']
      alasan_urutan: >-
        Konteks dulu, isi klinis di tengah, tarif di akhir. Urutan ini bukan sekadar
        rapi. Ia membuat penutupan bidang TRF setara dengan pertanyaan berapa tarif
        yang wajar untuk episode seperti ini, dan itu pertanyaan paling berharga.
      panjang_maksimum: 128
      penanganan_kelebihan: >-
        Kode dipotong menurut prioritas, bukan menurut urutan asli. Diagnosis sekunder
        dan obat diurutkan menurut kontribusinya terhadap kelompok tarif lebih dulu.
        Alasannya, yang paling berpengaruh ke tarif adalah yang paling perlu diperiksa.
      token_khusus:
        - '[EPS] penanda awal episode'
        - '[BID] penanda batas bidang, membawa identitas bidang'
        - '[TUTUP] penanda posisi yang ditutup saat pralatih'
        - '[HILANG] penanda bidang yang memang tidak ada datanya, dibedakan dari yang ditutup'
      mengapa_hilang_dan_tutup_dibedakan: >-
        Kalau tidak dibedakan, model akan belajar bahwa laboratorium yang kosong itu
        sama dengan laboratorium yang disembunyikan. Padahal di Indonesia kosong itu
        wajar, terutama di FKTP tanpa alat. Membedakan keduanya mencegah model
        menghukum faskes yang memang tidak punya laboratorium.

    ukuran_kamus:
      icd10: 'sekitar 14.000 kode yang benar benar terpakai, dari sekitar 70.000 kode penuh'
      icd9cm_prosedur: 'sekitar 4.000'
      atc: 'sekitar 5.000, dibatasi pada yang ada di Formularium Nasional'
      pemeriksaan: 'sekitar 1.500'
      ina_cbg: '1.079 kelompok tarif, terdiri dari 789 rawat inap dan 290 rawat jalan'
      barang: 'sekitar 3.000'
      pita_numerik: '16 pita per variabel kontinu'
      token_struktur: 'sekitar 200'
      total_perkiraan: 'sekitar 29.000'
      status_angka_ina_cbg: dari_pustaka
      catatan: >-
        Angka 1.079 kelompok tarif berasal dari uraian struktur INA-CBG yang beredar
        luas. Perlu dicocokkan langsung dengan lampiran Permenkes 3/2023 sebelum
        masuk proposal.

    penanganan_kode_yang_belum_pernah_terlihat: >-
      Kode ICD-10 baru atau jarang tidak diberi vektor acak. Ia diberi vektor yang
      dirakit dari nenek moyangnya di hierarki. Mekanismenya di bagian 9.4.

  # ---------------------------------------------------------------------------
  # 9.4 Lapisan embedding
  # ---------------------------------------------------------------------------
  embedding:

    E1_ontologi_kode:
      masalah_yang_dipecahkan: >-
        ICD-10 punya puluhan ribu kode dan sebarannya sangat timpang. Sebagian besar
        kode muncul beberapa kali saja dalam setahun. Kalau tiap kode diberi vektor
        bebas, kode jarang tidak akan pernah terlatih, dan justru kode jarang yang
        sering dipakai untuk menaikkan tarif.
      cara_kerja: >-
        Vektor sebuah kode bukan satu baris tabel. Ia gabungan berbobot dari vektor
        dirinya sendiri dan vektor seluruh nenek moyangnya di pohon ICD-10, dengan
        bobot dihitung lewat perhatian. Kode yang sering muncul akan bergantung pada
        vektornya sendiri. Kode yang jarang akan bergantung pada nenek moyangnya.
      rumus: >-
        e(c) = jumlah atas a dalam himpunan nenek moyang c dan c sendiri, dari
        alpha(c, a) dikali g(a), dengan alpha adalah perhatian yang dinormalkan softmax
        atas skor kompatibilitas antara embedding dasar c dan embedding dasar a.
      inspirasi: >-
        Gagasan ini mengikuti GRAM. Kami menuliskan ulang dari makalah, bukan memakai
        kode penulisnya, dan menyesuaikan pada tiga hal. Pertama, hierarki yang dipakai
        adalah ICD-10 bab sampai subkategori, bukan ICD-9 CCS. Kedua, pohon yang sama
        dipakai untuk ATC yang juga berjenjang lima tingkat. Ketiga, kami menambahkan
        pinalti agar jarak antar-vektor menghormati jarak di pohon.
      pinalti_hierarki: >-
        Rugi tambahan yang menghukum pasangan kode bersaudara yang vektornya berjauhan
        melebihi pasangan kode yang berbeda bab. Bobotnya kecil, sekitar seperseratus
        dari rugi utama, dan diuji lewat ablasi.
      mengapa_ini_penting_untuk_kecurangan: >-
        Upcoding hampir selalu berarti berpindah ke kode tetangga yang lebih mahal,
        bukan ke kode acak. Kalau model tidak tahu mana kode yang bertetangga, ia
        tidak bisa melihat perpindahan itu sebagai hal kecil yang mencurigakan.
        Justru karena tetangga, perpindahannya sulit dibantah, dan justru karena itu
        model perlu tahu struktur tetangganya.

    E2_numerik_berpita:
      masalah: >-
        Biaya klaim berekor sangat panjang. Lama rawat berbentuk cacah dengan banyak
        nilai satu. Nilai laboratorium punya rentang rujukan yang berbeda tiap
        pemeriksaan. Menormalkan semuanya jadi satu skala akan menghapus informasi
        yang justru paling berguna.
      cara_kerja: >-
        Tiap variabel kontinu dipetakan ke 16 pita menurut kuantilnya dalam korpus,
        lalu tiap pita punya vektornya sendiri. Nilai persisnya tetap dibawa sebagai
        satu angka kecil yang ditambahkan, supaya perbedaan di dalam pita tidak hilang.
      alasan_16: >-
        Cukup halus untuk membedakan kelompok tarif berdekatan, cukup kasar supaya tiap
        pita punya contoh yang banyak. Angka ini akan disetel lewat ablasi, bukan
        dipatok.
      perlakuan_khusus_nilai_laboratorium: >-
        Nilai laboratorium tidak dipita menurut nilai mutlak, tapi menurut posisinya
        terhadap rentang rujukan pemeriksaan itu. Leukosit 15.000 tidak berarti apa apa
        sampai kita tahu batas atas rujukannya 10.000. Pemitaan relatif membuat satu
        vektor pita bisa dipakai lintas pemeriksaan, dan itu yang membuat uji penumpukan
        di ambang jadi mungkin.

    E3_waktu_kontinu:
      masalah: >-
        Posisi ke berapa sebuah kejadian tidak penting. Yang penting berapa hari
        jaraknya. Readmisi hari kedua dan readmisi hari kesembilan puluh menempati
        posisi yang sama dalam barisan, tapi artinya berlawanan.
      cara_kerja: >-
        Selisih hari terhadap episode sebelumnya dan terhadap awal episode ini dipetakan
        lewat fitur sinus dan kosinus atas logaritma selisih, dengan beberapa frekuensi.
        Vektor hasilnya ditambahkan ke embedding token.
      mengapa_logaritma: >-
        Selisih satu hari dan tiga hari berbeda besar maknanya. Selisih tiga ratus hari
        dan tiga ratus tiga hari hampir sama. Skala logaritma menghormati itu.

    E4_penanda_bidang:
      cara_kerja: 'Tiap token menerima satu vektor yang menandai bidang asalnya, ditambahkan sebelum masuk encoder.'
      mengapa_penting: >-
        Ini yang memungkinkan penutupan menurut peran. Tanpa penanda bidang, model tidak
        tahu bahwa yang sedang ditutup adalah tarif dan yang tersedia adalah bukti klinis.

  # ---------------------------------------------------------------------------
  # 9.5 Cara belajar tanpa label
  # ---------------------------------------------------------------------------
  cara_belajar:

    kenyataan_yang_dihadapi: >-
      Tidak ada himpunan klaim JKN berlabel curang yang bisa dipakai. Kasus 2024
      menghasilkan temuan pada tiga rumah sakit. Dibandingkan ratusan juta klaim per
      tahun, itu bukan data latih, itu anekdot yang berharga.

    empat_pilihan_yang_kami_timbang:
      - pilihan: 'Klasifikasi terawasi dengan label audit'
        kenapa_ditolak: >-
          Label audit adalah hasil pemilihan audit. Model akan belajar meniru cara
          audit lama memilih sasaran, bukan belajar mengenali kecurangan. Ini masalah
          yang sama yang membuat riset berbasis LEIE di Amerika bisa dipertanyakan.
      - pilihan: 'Deteksi pencilan biasa'
        kenapa_ditolak: >-
          Pencilan bukan kecurangan. Kasus paling langka di rumah sakit rujukan nasional
          adalah kasus paling sulit, bukan kasus paling curang. Deteksi pencilan mentah
          akan menghukum rumah sakit yang menangani kasus berat.
      - pilihan: 'Pemodelan kewajaran bersyarat'
        kenapa_dipilih: >-
          Pertanyaannya bukan apakah episode ini langka, tapi apakah tarif yang ditagih
          bisa dijelaskan oleh bukti yang menyertainya. Rumah sakit rujukan nasional
          menangani kasus langka, tapi kasus langkanya membawa bukti yang sepadan.
          Kasus yang dinaikkan kodenya tidak membawa bukti yang sepadan.
        ini_pilihan_kami: true
      - pilihan: 'Belajar dari positif dan tak berlabel'
        kenapa_dipakai_sebagai_pelengkap: >-
          Begitu P4 berjalan dan hasil audit tercatat, kita akan punya sedikit positif
          dan sangat banyak yang tak berlabel. Itu persis bentuk masalah yang dijawab
          penduga risiko tak negatif. Kami menyiapkan tempatnya sejak awal, sebagai
          kepala tambahan yang menyala kalau labelnya sudah ada.

    tiga_sumber_pengawasan_yang_kami_punya:
      - sumber: 'Pengawasan diri'
        isi: 'Model menebak bagian klaim yang ditutup dari bagian lain. Tidak butuh label sama sekali.'
        porsi: 'Terbesar. Ini yang melatih tulang punggung.'
      - sumber: 'Pengawasan lemah dari aturan'
        isi: >-
          Puluhan fungsi pelabel yang masing masing tidak akurat tapi murah. Contohnya,
          sepsis tanpa antibiotik intravena, tindakan bedah tanpa hari rawat, kelas
          rawat melebihi hak peserta. Masing masing sering salah. Digabungkan dengan
          model yang menaksir akurasi tiap fungsi dari kesepakatan dan ketidaksepakatan
          antar-fungsi, hasilnya label probabilistik yang jauh lebih baik dari
          masing masing sendirian.
        rujukan_metode: 'Kerangka pemrograman data ala Snorkel, ditulis ulang sendiri.'
        porsi: 'Menyetel kepala, bukan melatih tulang punggung.'
      - sumber: 'Kebenaran dasar dari data sintetis'
        isi: >-
          Karena kami menulis pembangkitnya sendiri, tiap klaim curang sintetis punya
          pasangan versi jujurnya. Selisih rupiah diketahui persis.
        porsi: 'Untuk mengukur kalibrasi dan untuk melatih kepala tarif kontrafaktual.'
        peringatan: >-
          Ini juga bahaya terbesar. Kalau model dilatih dan diuji hanya pada data yang
          kami karang sendiri, kami hanya membuktikan bahwa model bisa membalik
          pembangkit kami. Bagian 12.6 menuliskan uji yang mencegah itu.

  # ---------------------------------------------------------------------------
  # 9.6 Tulang punggung
  # ---------------------------------------------------------------------------
  tulang_punggung:

    bentuk_umum: 'Encoder dua arah dengan perhatian diri, delapan lapis.'

    mengapa_encoder_bukan_decoder: >-
      Kita tidak sedang membangkitkan klaim baru. Kita sedang menanyakan seberapa masuk
      akal klaim yang sudah ada. Untuk itu tiap token perlu melihat seluruh token lain,
      termasuk yang sesudahnya. Model penerus satu arah akan buta terhadap bukti yang
      posisinya di belakang.

    yang_kami_ubah_dari_transformer_biasa:

      perubahan_1_bias_perhatian_antar_bidang:
        apa: >-
          Skor perhatian antara dua token ditambah satu bias yang dipelajari, yang
          bergantung hanya pada pasangan bidang asal keduanya. Ada dua belas bidang,
          jadi ada matriks bias berukuran dua belas kali dua belas per kepala perhatian.
        rumus: >-
          skor(i, j) = hasil kali dalam antara kueri i dan kunci j dibagi akar dimensi,
          ditambah B[kepala, bidang(i), bidang(j)]
        mengapa: >-
          Hubungan antar-bidang tidak setara. Tarif harus sangat memperhatikan diagnosis
          dan prosedur. Diagnosis harus sangat memperhatikan laboratorium dan obat.
          Waktu hampir tidak perlu memperhatikan obat. Transformer biasa harus
          mempelajari semua itu dari nol lewat data. Memberi bias per pasangan bidang
          memberi model titik awal yang benar, dan menghemat data.
        biaya: 'Dua belas kali dua belas kali delapan kepala kali delapan lapis, sekitar sembilan ribu parameter tambahan. Nyaris gratis.'
        cara_menguji_apakah_berguna: >-
          Ablasi dengan bias dinolkan dan dibekukan. Kalau tidak ada bedanya, komponen
          ini dibuang dan kami tulis bahwa dibuang.
        kejujuran: >-
          Gagasan bias perhatian yang bergantung pada hubungan antar-token bukan hal
          baru. Ia muncul pada perhatian dengan posisi relatif dan pada varian graf.
          Yang kami klaim baru hanya penerapannya pada bidang klaim, dan itu klaim
          yang kecil. Kami tidak akan menyebutnya arsitektur baru.

      perubahan_2_penutupan_menurut_peran:
        apa: >-
          Saat pralatih, yang ditutup bukan token acak seragam. Ada beberapa pola
          penutupan, masing masing dengan peluangnya sendiri, dan tiap pola meniru satu
          pertanyaan audit.
        pola:
          - nama: 'tutup tarif'
            yang_ditutup: 'Seluruh bidang TRF'
            pertanyaan_yang_dilatih: 'Kelompok tarif apa yang wajar untuk episode seperti ini'
            peluang: 0.25
          - nama: 'tutup diagnosis sekunder'
            yang_ditutup: 'Seluruh bidang DXS'
            pertanyaan_yang_dilatih: 'Komorbiditas apa yang konsisten dengan bukti yang ada'
            peluang: 0.20
          - nama: 'tutup bukti'
            yang_ditutup: 'LAB dan OBT'
            pertanyaan_yang_dilatih: 'Bukti apa yang seharusnya menyertai diagnosis ini'
            peluang: 0.20
          - nama: 'tutup prosedur'
            yang_ditutup: 'PRC'
            pertanyaan_yang_dilatih: 'Tindakan apa yang wajar untuk kondisi ini'
            peluang: 0.10
          - nama: 'tutup acak'
            yang_ditutup: 'Lima belas persen token acak'
            pertanyaan_yang_dilatih: 'Kewajaran umum'
            peluang: 0.25
        mengapa_ini_penting: >-
          Pola penutupan menentukan pertanyaan apa yang bisa dijawab model saat dipakai.
          Kalau hanya dilatih dengan penutupan acak, model akan mahir menebak token
          acak dan payah menebak seluruh bidang tarif sekaligus. Padahal yang kita
          butuhkan saat menilai upcoding adalah persis kemampuan menebak seluruh bidang
          tarif dari bukti.

      perubahan_3_normalisasi_dan_stabilitas:
        apa: 'Normalisasi lapis diletakkan sebelum sub-lapis, bukan sesudah.'
        mengapa: 'Lebih stabil pada model dalam tanpa pemanasan yang panjang. Ini praktik standar, bukan kebaruan.'

    ukuran:
      dimensi_model: 256
      lapis: 8
      kepala_perhatian: 8
      dimensi_umpan_maju: 1024
      panjang_barisan: 128
      perkiraan_parameter:
        embedding: 'sekitar 29.000 kali 256, sekitar 7,4 juta'
        encoder: 'sekitar 8 kali 790.000, sekitar 6,3 juta'
        kepala_hilir: 'sekitar 3 juta'
        total: 'sekitar 17 juta'
      catatan_ukuran: >-
        Ini kecil menurut ukuran hari ini, dan itu disengaja. Model sebesar ini bisa
        dilatih ulang tiap bulan oleh BPJS sendiri, di perangkat keras yang wajar,
        tanpa bergantung pada penyedia awan asing. Untuk sistem yang menyentuh data
        kesehatan nasional, itu bukan pertimbangan kecil.
      apakah_lebih_besar_lebih_baik: >-
        Belum tentu. Jumlah episode yang tersedia terbatas, dan literatur pemodelan
        tabular menunjukkan model besar sering kalah dari pohon berpenguat pada data
        seukuran ini. Ukuran akan disetel lewat percobaan, dengan tiga ukuran yang
        dibandingkan. Bagian 13.5.

  # ---------------------------------------------------------------------------
  # 9.7 Enam kepala
  # ---------------------------------------------------------------------------
  kepala:

    catatan_umum: >-
      Semua kepala berbagi satu tulang punggung. Itu bukan penghematan, itu inti tesis.
      Kalau tiap kepala punya encoder sendiri, kita kembali membangun enam detektor
      terpisah, dan tiga orang tidak akan selesai.

    K1_konsistensi_bukti:
      menjawab_modus: ['M04', 'M06', 'M14', 'M15', 'M17', 'M20', 'M02']
      keluarga: 'A'
      pertanyaan: 'Seberapa mengejutkan isi klaim ini bila dilihat dari bukti yang menyertainya.'
      cara_kerja: >-
        Ambil episode, tutup bidang yang ingin diuji, jalankan tulang punggung, ambil
        sebaran peluang untuk tiap token yang ditutup. Skor kejutannya adalah minus
        logaritma peluang yang diberikan model pada token yang sebenarnya ditagihkan.
      keluaran:
        - 'Skor kejutan per token'
        - 'Skor kejutan agregat per bidang'
        - 'Daftar token yang paling mengejutkan, untuk penjelasan'
      penyesuaian_yang_wajib: >-
        Skor kejutan mentah tidak bisa dibandingkan antar-kasus. Kasus langka selalu
        mengejutkan. Karena itu skor dinormalkan terhadap sebaran kejutan pada kasus
        sejenis, yaitu episode dengan diagnosis primer dan kelompok tarif yang sama.
        Yang dilaporkan adalah posisi persentil, bukan nilai mentah.
      mengapa_penyesuaian_ini_menentukan: >-
        Tanpa itu, model akan menandai rumah sakit rujukan nasional setiap hari, karena
        kasusnya memang jarang. Dengan itu, pertanyaannya berubah menjadi apakah kasus
        langka ini mengejutkan dibanding kasus langka lain yang sejenis. Itu pertanyaan
        yang adil.

    K2_tarif_kontrafaktual:
      menjawab_modus: ['M04', 'M12', 'M13']
      keluarga: 'A'
      pertanyaan: 'Kelompok tarif apa yang didukung bukti, dan berapa selisih rupiahnya terhadap yang ditagih.'
      cara_kerja: >-
        Tutup seluruh bidang tarif, lalu keluarkan sebaran peluang atas 1.079 kelompok
        tarif dan atas tiga tingkat keparahan. Terjemahkan sebaran itu ke rupiah lewat
        tabel tarif resmi. Nilai harapan tarif yang didukung bukti dikurangi tarif yang
        ditagih menghasilkan selisih.
      rumus_selisih: >-
        selisih = tarif(kelompok yang ditagih) dikurangi jumlah atas seluruh kelompok g
        dari p(g given bukti) dikali tarif(g)
      mengapa_ini_bentuk_keluaran_yang_benar:
        - 'Bisa ditagih. BPJS bisa memotong sebesar selisih, bukan menolak seluruh klaim.'
        - 'Bisa dibantah. Rumah sakit bisa menunjukkan bukti yang tidak terkirim.'
        - 'Bisa dijumlahkan. Total selisih di satu rumah sakit adalah angka yang bisa dibawa ke rapat.'
        - 'Bisa diurutkan. Antrean audit langsung punya satuan yang benar.'
      ketidakpastian: >-
        Selain nilai harapan, kepala ini mengeluarkan sebaran penuh. Klaim dengan
        selisih Rp 5 juta yang pasti berbeda dari klaim dengan selisih Rp 5 juta yang
        penuh keraguan. Yang kedua tidak layak diaudit lebih dulu.
      hal_yang_harus_diwaspadai: >-
        Kalau tabel tarif berubah, kepala ini harus dilatih ulang bagian akhirnya saja.
        Tabel tarif dipisahkan sebagai berkas acuan, bukan ditanam di bobot.

    K3_integritas_episode:
      menjawab_modus: ['M08', 'M09', 'M11', 'M12', 'M16']
      keluarga: 'B'
      pertanyaan: 'Diberikan riwayat pasien ini, seberapa mengejutkan waktu dan jenis episode berikutnya.'
      bentuk_matematis: >-
        Proses titik temporal bertanda. Model mengeluarkan fungsi intensitas yang
        menyatakan laju kejadian per jenis episode pada tiap saat, sebagai fungsi dari
        representasi riwayat yang keluar dari tulang punggung.
      cara_melatih: >-
        Kemungkinan logaritmik proses titik, yaitu jumlah logaritma intensitas pada saat
        kejadian yang benar benar terjadi, dikurangi integral intensitas sepanjang
        jendela pengamatan. Integralnya dihitung numerik dengan kuadratur sederhana.
      cara_memakai: >-
        Untuk tiap episode, hitung seberapa kecil peluang munculnya pada jarak waktu itu
        dengan diagnosis itu. Episode yang muncul jauh lebih cepat dari yang wajar, dan
        diagnosisnya melanjutkan episode sebelumnya, mendapat skor tinggi.
      mengapa_lebih_baik_dari_jendela_tetap:
        - 'Kemoterapi tiap tiga minggu wajar. Jendela tiga puluh hari akan salah menandainya.'
        - 'Readmisi ortopedi elektif dua hari janggal. Jendela tiga puluh hari akan menangkapnya bersama ribuan kasus wajar.'
        - 'Model mempelajari jarak yang wajar per jenis kasus, dan jumlah jenis kasusnya ribuan.'
      keluaran_yang_bisa_ditindaklanjuti: >-
        Bukan sekadar skor. Kepala ini menyatakan bahwa dua klaim tertentu kemungkinan
        besar satu episode, dan menghitung selisih antara jumlah dua tarif terpisah
        dengan satu tarif gabungan. Lagi lagi dalam rupiah.

    K4_kelompok_sebaya:
      menjawab_modus: ['M03', 'M10', 'M01', 'M02', 'M06', 'M13']
      keluarga: 'C'
      pertanyaan: 'Seberapa menyimpang distribusi klaim entitas ini dari sebayanya, setelah bauran kasus dikendalikan.'
      dua_lapis:
        lapis_1_pembentukan_sebaya:
          cara: >-
            Tiap faskes diwakili oleh rata rata representasi episodenya, ditambah
            beberapa statistik ringkas. Faskes dikelompokkan di ruang itu.
          mengapa_bukan_kelas_administratif: >-
            Rumah sakit kelas B di Jakarta dan rumah sakit kelas B di Papua bukan sebaya.
            Kelas administratif menyatakan izin, bukan pola kasus. Kelompok yang
            dipelajari dari data menyatakan pola kasus.
          cara_menguji_apakah_kelompoknya_masuk_akal: >-
            Kelompok yang terbentuk harus bisa dijelaskan. Kalau satu kelompok berisi
            rumah sakit jantung dan rumah sakit mata, ada yang salah. Pemeriksaan ini
            dilakukan manusia, sekali, dan hasilnya ditulis.
        lapis_2_pengukuran_penyimpangan:
          cara: >-
            Untuk tiap entitas, bandingkan sebaran kelompok tarif yang ditagihkannya
            dengan sebaran yang diperkirakan model dari bauran kasusnya. Divergensi
            antara dua sebaran itu adalah skornya.
          kunci: >-
            Pembandingnya bukan sebaran rata rata kelompok, tapi sebaran yang
            diperkirakan model untuk pasien pasien yang benar benar datang ke faskes ini.
            Ini yang menjawab bantahan paling umum dari rumah sakit, bahwa pasien mereka
            memang lebih berat.
      keluaran: 'Peringkat faskes dan peringkat dokter, dengan ekspektasi rupiah berlebih per entitas.'
      struktur_graf:
        simpul: ['peserta', 'faskes', 'dokter penanggung jawab', 'episode']
        sisi: ['peserta ke episode', 'episode ke faskes', 'episode ke dokter', 'faskes perujuk ke faskes penerima']
        cara_meneruskan_pesan: >-
          Agregasi tetangga sederhana dua lapis, ditulis sendiri sebagai perkalian
          matriks jarang. Kami tidak memakai pustaka graf.
        mengapa_dua_lapis: >-
          Dua lapis sudah mencapai dokter lewat episode, dan mencapai faskes lain lewat
          pasien yang sama. Lebih dalam dari itu, seluruh graf menjadi tetangga semua
          orang dan sinyalnya hilang.

    K5_kemiripan_berlebih:
      menjawab_modus: ['M05', 'M06']
      keluarga: 'C'
      pertanyaan: 'Apakah faskes ini menghasilkan klaim yang lebih mirip satu sama lain daripada yang bisa dijelaskan kebetulan.'
      mengapa_bukan_sekadar_pencocokan_berkas: >-
        Protokol klinis memang menyeragamkan. Seratus operasi katarak di satu rumah
        sakit memang akan mirip, dan itu tanda mutu, bukan tanda curang. Pencocokan
        berkas biasa akan menandai rumah sakit yang paling disiplin.
      cara_kerja:
        langkah_1: >-
          Hitung kemiripan antar-klaim memakai tanda tangan ringkas, sehingga tidak perlu
          membandingkan semua pasangan. Ini pencocokan berbasis hash yang peka lokasi,
          ditulis sendiri, dan biayanya hampir linear.
        langkah_2: >-
          Hitung berapa banyak pasangan mirip yang seharusnya muncul secara kebetulan,
          menurut model kewajaran yang sudah kita punya. Model tahu peluang tiap
          kombinasi, jadi ia bisa menghitung laju kebetulan yang diharapkan.
        langkah_3: 'Skornya adalah kelebihan pasangan mirip yang teramati di atas yang diharapkan.'
      apa_yang_membedakan_kloning_dari_protokol: >-
        Protokol menyeragamkan yang memang seharusnya seragam, yaitu tindakan dan obat.
        Kloning menyeragamkan juga yang seharusnya bervariasi, yaitu nilai laboratorium,
        lama rawat, dan komorbiditas. Kepala ini memberi bobot lebih besar pada
        kesamaan di variabel yang seharusnya bervariasi. Bobot itu tidak ditetapkan
        manusia, tapi diambil dari entropi variabel itu dalam korpus.
      catatan: >-
        Ini kepala paling murah di seluruh sistem, dan mungkin yang paling cepat
        memberi hasil. Kalau waktu hackathon sempit, ini yang didemokan lebih dulu.

    K6_kepatuhan_entitas:
      menjawab_modus: ['M01']
      keluarga: 'C'
      status: 'opsional, dikerjakan kalau waktu memungkinkan'
      pertanyaan: 'Apakah pola sepanjang waktu sebuah entitas menunjukkan perubahan perilaku mendadak.'
      cara_kerja: >-
        Deret waktu representasi bulanan tiap faskes, lalu deteksi titik perubahan.
        Perubahan mendadak pada bauran kelompok tarif tanpa perubahan pada bauran pasien
        adalah tanda perubahan perilaku pengkodean, bukan perubahan populasi.
      mengapa_berguna: >-
        Kecurangan sering dimulai pada tanggal tertentu, misalnya setelah pergantian
        manajemen atau setelah pemasangan sistem baru. Titik perubahan memberi auditor
        tanggal untuk ditanyakan, dan tanggal adalah pertanyaan yang sangat kuat dalam
        wawancara audit.

  # ---------------------------------------------------------------------------
  # 9.8 Penggabungan skor
  # ---------------------------------------------------------------------------
  penggabungan:
    masalah: 'Enam kepala menghasilkan skor dengan satuan berbeda. Menjumlahkannya begitu saja tidak bermakna.'
    cara_kami: >-
      Semua kepala diterjemahkan ke satu satuan, yaitu ekspektasi rupiah berlebih.
      Kepala yang tidak bisa diterjemahkan langsung, seperti K5, dipetakan lewat regresi
      terhadap selisih rupiah pada data sintetis yang kebenaran dasarnya diketahui.
    rumus_akhir: >-
      ekspektasi rupiah berlebih = peluang ada ketidaksesuaian dikali besar selisih
      bila ada ketidaksesuaian
    mengapa_bukan_pembobotan_manual: >-
      Bobot manual tidak bisa dipertanggungjawabkan dan akan menjadi bahan tawar menawar
      politik. Satuan rupiah menghapus perdebatan bobot.
    catatan_jujur: >-
      Pemetaan dari K5 ke rupiah bergantung pada data sintetis kami. Kalau pembangkitnya
      tidak realistis, pemetaannya salah. Ini titik lemah yang kami tulis apa adanya,
      dan yang diuji di bagian 12.6.

  # ---------------------------------------------------------------------------
  # 9.9 Kalibrasi konformal
  # ---------------------------------------------------------------------------
  kalibrasi_konformal:

    masalah_yang_dipecahkan: >-
      Model apa pun bisa melaporkan tingkat positif palsu pada himpunan ujinya. Itu
      bukan jaminan, itu pengamatan. Begitu dipasang di dunia nyata, angkanya tidak
      berlaku lagi. Untuk sistem yang bisa menahan pembayaran rumah sakit, pengamatan
      tidak cukup.

    apa_yang_diberikan_prediksi_konformal: >-
      Jaminan bebas distribusi. Kalau kita menetapkan alpha sebesar satu persen, maka
      di antara klaim yang berasal dari populasi yang sama dengan himpunan kalibrasi,
      tidak lebih dari satu persen akan ditandai. Jaminan ini tidak bergantung pada
      benar tidaknya model. Model yang buruk tetap memenuhi jaminan, hanya saja
      dayanya rendah.

    cara_kerja:
      langkah_1: 'Sisihkan himpunan kalibrasi yang diyakini bersih.'
      langkah_2: 'Hitung skor ketidaksesuaian untuk tiap anggota himpunan kalibrasi.'
      langkah_3: >-
        Ambil kuantil ke satu dikurangi alpha dari skor skor itu, dengan koreksi kecil
        untuk ukuran sampel berhingga. Itu ambangnya.
      langkah_4: 'Klaim baru ditandai bila skornya melebihi ambang.'
      jumlah_baris_kode: 'Sekitar lima puluh. Ini komponen paling murah dengan dampak politik paling besar.'

    syarat_yang_harus_dipenuhi_dan_sering_dilanggar:
      - syarat: 'Himpunan kalibrasi dan data baru harus bisa dipertukarkan'
        pelanggaran_yang_mungkin: >-
          Klaim bulan Januari dan bulan Desember tidak bisa dipertukarkan. Ada musim,
          ada perubahan tarif, ada wabah.
        cara_kami_menangani: >-
          Kalibrasi bergulir per periode, dan kalibrasi terpisah per kelompok sebaya.
          Ini melemahkan jaminan menjadi jaminan bersyarat kelompok, dan itu kami tulis
          apa adanya. Jaminan bersyarat kelompok justru lebih berguna, karena ia
          menjamin rumah sakit kecil tidak ditandai lebih sering daripada rumah sakit besar.
      - syarat: 'Himpunan kalibrasi harus bersih'
        pelanggaran_yang_mungkin: 'Tidak ada himpunan klaim yang dipastikan bersih. Kecurangan yang tidak terdeteksi ada di dalamnya.'
        cara_kami_menangani: >-
          Kami memakai kuantil yang tahan pencilan, dan menyatakan bahwa jaminannya
          adalah jaminan terhadap laju penandaan pada populasi umum, bukan terhadap
          populasi yang benar benar bersih. Ini pelemahan yang jujur dan tetap berguna.

    cara_menjelaskan_ini_ke_juri_non_teknis: >-
      Anda menetapkan berapa banyak rumah sakit jujur yang boleh terganggu. Sistem
      menyesuaikan ambangnya sendiri supaya angka itu tidak terlampaui, dan
      penyesuaian itu punya dasar matematis, bukan hasil menebak.

  # ---------------------------------------------------------------------------
  # 9.10 Peringkat audit
  # ---------------------------------------------------------------------------
  peringkat_audit:

    kesalahan_yang_paling_umum: >-
      Mengurutkan antrean audit menurut probabilitas kecurangan. Itu keliru. Klaim
      dengan peluang curang sembilan puluh persen dan nilai selisih dua ratus ribu
      rupiah tidak layak diperiksa lebih dulu daripada klaim dengan peluang tiga puluh
      persen dan selisih lima puluh juta.

    yang_kami_pakai: >-
      Urutkan menurut ekspektasi nilai bersih, yaitu peluang ketidaksesuaian dikali
      besar selisih, dikurangi biaya pemeriksaan.
    rumus: 'nilai bersih = p dikali selisih, dikurangi biaya audit'

    penyesuaian_yang_perlu:
      - hal: 'Biaya audit tidak seragam'
        penjelasan: 'Audit lapangan ke Papua mahal. Audit berkas murah. Biaya harus per jenis pemeriksaan, bukan satu angka.'
      - hal: 'Efek jera tidak masuk hitungan langsung'
        penjelasan: >-
          Memeriksa satu rumah sakit besar bernilai lebih dari nilai temuannya, karena
          rumah sakit lain ikut berubah perilaku. Ini nyata dan sulit diukur. Kami
          menyediakan pengali yang bisa disetel kebijakan, dan menandainya sebagai
          parameter kebijakan, bukan parameter model.
      - hal: 'Keragaman antrean'
        penjelasan: >-
          Kalau peringkat murni, seluruh kuota audit akan habis di satu rumah sakit.
          Perlu batas per entitas per periode, supaya cakupannya menyebar dan supaya
          model tetap menerima umpan balik dari berbagai jenis kasus.
      - hal: 'Umpan balik yang bias'
        penjelasan: >-
          Kalau kita hanya memeriksa yang berperingkat teratas, kita hanya akan pernah
          tahu kebenaran tentang yang berperingkat teratas. Model tidak akan pernah
          belajar bahwa ia salah di tempat lain.
        cara_kami: >-
          Sisakan porsi kecil kuota audit untuk sampel acak, sekitar lima persen. Ini
          mahal dan terasa sia sia, tapi tanpa itu sistem akan mengunci dirinya sendiri
          pada keyakinan awalnya. Ini keputusan desain yang akan kami pertahankan di
          depan juri.

  # ---------------------------------------------------------------------------
  # 9.11 Penjelasan
  # ---------------------------------------------------------------------------
  penjelasan:

    syarat_yang_ditetapkan_p5: >-
      Faskes berhak tahu alasan penandaan dalam bentuk yang bisa dibantah. Jadi
      penjelasan bukan fitur tambahan, ia bagian dari keluaran wajib.

    tiga_lapis_penjelasan:
      lapis_1_angka:
        isi: 'Tarif yang ditagih, tarif yang didukung bukti, selisihnya, dan seberapa yakin.'
        contoh_bentuk: >-
          Ditagih pada kelompok tarif X tingkat keparahan III. Bukti yang menyertai
          mendukung tingkat keparahan I dengan peluang sekian. Selisih tarif sekian rupiah.
      lapis_2_bukti_yang_hilang:
        isi: >-
          Daftar bukti yang biasanya menyertai kombinasi kode ini, tapi tidak ada di
          klaim ini. Diurutkan menurut seberapa besar pengaruhnya terhadap keputusan.
        cara_menghitung: >-
          Untuk tiap bukti yang tidak ada, hitung ulang perkiraan tarif seandainya bukti
          itu ada. Perubahan terbesar adalah bukti terpenting. Ini penjelasan berbasis
          pengandaian, bukan berbasis bobot.
        mengapa_bentuk_ini: >-
          Ini bentuk yang bisa dijawab rumah sakit. Kalau kreatininnya sebenarnya ada
          tapi tidak terkirim, rumah sakit tinggal mengirimnya, dan penandaan gugur.
          Itu hasil yang baik, bukan kegagalan sistem.
      lapis_3_konteks_sebaya:
        isi: >-
          Posisi faskes ini dibanding sebayanya untuk pola yang sama, dan berapa banyak
          klaim serupa yang ditandai di faskes ini dalam periode ini.
        mengapa: 'Satu klaim janggal bisa kebetulan. Dua ratus klaim janggal dengan pola sama bukan kebetulan.'

    yang_dilarang_muncul_di_keluaran:
      - 'Kata curang, fraud, atau tuduhan apa pun. Yang boleh muncul adalah ketidaksesuaian yang perlu dikonfirmasi.'
      - 'Skor tunggal tanpa satuan.'
      - 'Nama orang. Semua identitas ditampilkan sebagai penanda ter-hash sampai auditor membuka kasus.'

    catatan_tentang_metode_penjelasan_yang_populer: >-
      Metode atribusi berbasis nilai Shapley sering dipakai dan sering disalahpahami.
      Ia menjelaskan kontribusi fitur terhadap keluaran model, bukan sebab di dunia
      nyata. Untuk keperluan bantahan, penjelasan berbasis pengandaian lebih tepat,
      karena ia langsung menjawab pertanyaan apa yang harus berbeda supaya klaim ini
      tidak ditandai. Kami memakai atribusi hanya untuk pemeriksaan internal, tidak
      untuk keluaran ke faskes.

  # ---------------------------------------------------------------------------
  # 9.12 Ketahanan terhadap pelaku yang beradaptasi
  # ---------------------------------------------------------------------------
  ketahanan_adversarial:

    kenyataan: >-
      Kecurangan adalah tanggapan manusia terhadap pengawasan. Begitu detektor dipasang,
      pelaku bergeser ke pola yang tidak terdeteksi. Sistem yang diuji hanya pada pola
      lama akan terlihat hebat pada tahun pertama dan tidak berguna pada tahun ketiga.

    yang_hampir_tidak_pernah_diuji_orang_lain: >-
      Sepanjang penelusuran kami, evaluasi deteksi kecurangan kesehatan hampir selalu
      dilakukan pada data statis. Pelaku dianggap tidak bergerak. Ini asumsi yang
      diketahui salah oleh semua orang di lapangan, tapi tetap dipakai karena datanya
      statis.

    mengapa_kami_bisa_mengujinya: >-
      Karena pembangkit datanya kami tulis sendiri, pelaku sintetis bisa diberi
      kemampuan melihat skor detektor dan menyesuaikan diri. Ini justru keuntungan dari
      tidak punya data asli.

    tiga_pelaku_yang_akan_kami_jalankan:
      - nama: 'Pelaku serakah'
        perilaku: 'Menaikkan kode sebesar mungkin tanpa memperhatikan deteksi.'
        harapan: 'Tertangkap hampir seluruhnya. Kalau tidak, ada yang salah pada model.'
      - nama: 'Pelaku hati hati'
        perilaku: >-
          Hanya menaikkan kode ketika skor detektor tetap di bawah ambang. Ia punya akses
          ke skor, seolah punya orang dalam.
        harapan: >-
          Sebagian lolos. Yang penting diukur adalah berapa besar keuntungan per klaim
          yang masih bisa ia ambil. Kalau detektor memaksa keuntungannya turun sampai
          tidak sebanding dengan risikonya, detektor berhasil meskipun tidak menangkapnya.
      - nama: 'Pelaku menyebar'
        perilaku: 'Menaikkan kode sedikit pada banyak klaim, bukan banyak pada sedikit klaim.'
        harapan: >-
          Ini yang paling sulit dan paling nyata. Deteksi per klaim akan gagal. Deteksi
          kelompok sebaya, kepala K4, seharusnya menangkapnya. Kalau K4 juga gagal,
          kami menulis bahwa gagal.

    ukuran_keberhasilan_yang_benar: >-
      Bukan berapa persen pelaku tertangkap, tapi berapa besar keuntungan maksimum yang
      masih bisa diambil pelaku terbaik. Sistem pengawasan yang baik tidak menangkap
      semua orang, ia membuat kecurangan tidak sepadan.

  # ---------------------------------------------------------------------------
  # 9.13 Pemindahan ke kategori lain
  # ---------------------------------------------------------------------------
  pemindahan:
    catatan: >-
      Bagian ini bukan janji untuk lomba ini. Aturan mengharuskan satu kategori. Ini
      ditulis supaya terlihat bahwa arsitekturnya bukan alat sekali pakai.
    ke_kategori_pemberi_kerja:
      yang_berubah: 'Bidang token diganti menjadi profil badan usaha, riwayat pelaporan upah, mutasi pekerja, dan sektor usaha.'
      yang_tetap: 'Tulang punggung, penutupan menurut peran, kalibrasi konformal, peringkat audit, penjelasan berbasis pengandaian.'
      pertanyaan_yang_setara: >-
        Tutup bidang upah yang dilaporkan, lalu tebak dari sektor, wilayah, jumlah
        pekerja, dan pola pemanfaatan layanan pekerjanya. Selisih antara upah yang
        dilaporkan dan upah yang didukung bukti adalah keluarannya, dalam rupiah iuran.
      hambatan: 'Butuh pembanding upah dari luar BPJS. Sudah ditulis di bagian 2.'
    ke_kategori_peserta:
      yang_setara: >-
        Pemanfaatan yang tidak perlu bisa dilihat sebagai lintasan episode yang terlalu
        rapat untuk kondisi yang tidak berkembang. Itu persis kepala K3.
      yang_tidak_setara: 'Pemalsuan identitas. Bukan masalah model.'

# =============================================================================
# 10. BATAS ANTARA KODE KAMI DAN PUSTAKA PIHAK KETIGA
# =============================================================================

dari_nol_vs_pustaka:

  mengapa_bagian_ini_ada: >-
    Klaim membangun AI dari nol mudah diucapkan dan sulit dibuktikan. Bagian ini
    menuliskan batasnya supaya juri bisa memeriksanya, dan supaya kami tidak
    tergelincir sendiri di tengah pengerjaan.

  definisi_yang_kami_pakai: >-
    Dari nol berarti seluruh arsitektur, fungsi rugi, dan prosedur pelatihan ditulis
    sendiri di atas operasi tensor dasar dan turunan otomatis. Bukan berarti menulis
    ulang perkalian matriks atau pengalokasi memori.

  ditulis_sendiri:
    daftar:
      - komponen: 'Penokenan episode klaim'
        alasan_tidak_ada_yang_bisa_dipakai: 'Tidak ada penokenan yang mengenal bidang klaim JKN.'
        perkiraan_baris: 600
      - komponen: 'Embedding sadar hierarki ICD dan ATC'
        alasan: 'Perakitan dari nenek moyang lewat perhatian, plus pinalti jarak pohon.'
        perkiraan_baris: 300
      - komponen: 'Pemitaan numerik relatif rentang rujukan'
        perkiraan_baris: 200
      - komponen: 'Penyandian waktu kontinu'
        perkiraan_baris: 100
      - komponen: 'Blok encoder dengan bias perhatian antar-bidang'
        alasan: 'Perubahan pada perhitungan skor perhatian. Tidak bisa dipakai dari pustaka apa pun.'
        perkiraan_baris: 400
      - komponen: 'Tujuan pralatih dengan penutupan menurut peran'
        perkiraan_baris: 350
      - komponen: 'Kepala K1 sampai K6'
        perkiraan_baris: 900
      - komponen: 'Kemungkinan logaritmik proses titik temporal bertanda'
        alasan: 'Termasuk integral kompensator secara numerik.'
        perkiraan_baris: 300
      - komponen: 'Agregasi tetangga pada graf entitas'
        alasan: 'Ditulis sebagai perkalian matriks jarang, bukan memakai pustaka graf.'
        perkiraan_baris: 250
      - komponen: 'Statistik kelebihan kemiripan'
        perkiraan_baris: 300
      - komponen: 'Penggabungan label lemah dari fungsi pelabel'
        perkiraan_baris: 350
      - komponen: 'Kalibrator konformal'
        perkiraan_baris: 150
      - komponen: 'Peringkat audit dengan anggaran'
        perkiraan_baris: 250
      - komponen: 'Penjelasan berbasis pengandaian'
        perkiraan_baris: 300
      - komponen: 'Pembangkit data sintetis'
        alasan: 'Bagian terbesar. Rincian di bagian 11.'
        perkiraan_baris: 2500
      - komponen: 'Lingkungan pelaku yang beradaptasi'
        perkiraan_baris: 500
      - komponen: 'Kerangka evaluasi'
        perkiraan_baris: 700
    perkiraan_total_baris: 'sekitar 8.500'
    catatan_perkiraan: >-
      Angka baris ini perkiraan kasar untuk menilai kelayakan waktu, bukan target.
      Kalau nanti jauh meleset, itu informasi, bukan kegagalan.

  substrat_yang_dipakai:
    - nama: 'PyTorch'
      dipakai_untuk: 'Tensor, turunan otomatis, perkalian matriks, pengoptimal dasar'
      tidak_dipakai_untuk: 'Modul transformer bawaan, modul perhatian bawaan'
      catatan: >-
        Kami memakai perkalian matriks dan softmax dari PyTorch. Kami tidak memakai
        kelas transformer bawaannya, karena bias antar-bidang tidak bisa disisipkan
        ke dalamnya tanpa menulis ulang perhitungan skornya.
    - nama: 'NumPy dan Polars'
      dipakai_untuk: 'Penyiapan data, statistik, pemitaan'
    - nama: 'DuckDB'
      dipakai_untuk: 'Kueri atas berkas kolumnar besar tanpa memuat semuanya ke memori'
      alasan: 'Batasan memori mesin pengembangan. Lihat bagian 15.'
    - nama: 'scikit-learn'
      dipakai_untuk: 'Hanya untuk garis dasar pembanding dan metrik'
      tidak_dipakai_untuk: 'Model akhir'
    - nama: 'XGBoost atau LightGBM'
      dipakai_untuk: 'Hanya sebagai garis dasar yang harus dikalahkan'
      alasan: >-
        Literatur pemodelan tabular menunjukkan pohon berpenguat sering mengalahkan
        model dalam pada data seukuran ini. Kalau kami tidak menyertakan pembanding ini,
        juri yang paham akan langsung menanyakannya, dan kami tidak akan punya jawaban.
    - nama: 'ONNX'
      dipakai_untuk: 'Ekspor untuk demonstrasi. Bukan bagian dari model.'

  yang_tidak_dipakai_sama_sekali:
    - hal: 'Bobot model yang sudah dilatih pihak lain'
      alasan: 'Melanggar semangat membangun dari nol, dan tidak ada bobot yang cocok untuk klaim JKN.'
    - hal: 'Pustaka jaringan graf siap pakai'
      alasan: 'Agregasi yang kami butuhkan sederhana, dan menulisnya sendiri lebih jelas untuk diaudit.'
    - hal: 'Model bahasa besar sebagai penilai atau pengekstrak'
      alasan: >-
        Data kami terstruktur, bukan teks bebas. Memakai model bahasa besar di sini
        akan menambah biaya, menambah ketergantungan pada penyedia luar, dan menambah
        risiko kebocoran data kesehatan. Tidak ada manfaat yang sebanding.
    - hal: 'Platform deteksi kecurangan komersial'
      alasan: 'Jelas.'

  cara_juri_memverifikasi:
    - 'Repositori dengan riwayat perubahan yang bisa dilihat, bukan satu unggahan besar di akhir.'
    - 'Berkas yang memuat definisi arsitektur bisa dibaca dan tidak memanggil modul transformer bawaan.'
    - 'Uji unit untuk bias antar-bidang, untuk integral kompensator, dan untuk jaminan konformal.'
    - 'Catatan percobaan yang menunjukkan model dilatih dari inisialisasi acak, termasuk kurva rugi dari langkah nol.'

# =============================================================================
# 11. RENCANA DATA
# =============================================================================

data:

  kenyataan_yang_dihadapi: >-
    Kami tidak punya data JKN. Aturan lomba melarang memakai data peserta yang nyata
    tanpa izin. Jadi seluruh rencana ini disusun dengan asumsi kami tidak akan pernah
    menyentuh satu baris pun data peserta selama lomba.

  prinsip:
    - 'Jangan pernah mengarang angka yang bisa dicari. Cari dulu.'
    - 'Data sintetis harus bisa diuji realismenya terhadap sesuatu yang nyata. Kalau tidak bisa diuji, ia tidak berguna.'
    - 'Struktur klaim boleh dipelajari dari data asing. Sebaran Indonesia harus dari sumber Indonesia.'
    - 'Setiap sumber dicatat lisensinya dan cara memperolehnya, supaya bisa diulang orang lain.'

  # ---------------------------------------------------------------------------
  # Lapis 0: artefak publik, tidak memuat orang
  # ---------------------------------------------------------------------------
  lapis_0_artefak_publik:
    penjelasan: 'Aturan, kode, tarif, dan daftar entitas. Tidak ada data orang di sini sama sekali.'
    daftar:
      - nama: 'Tabel tarif INA-CBG'
        sumber: 'Lampiran Permenkes 3/2023 tentang standar tarif pelayanan kesehatan'
        isi: 'Kelompok tarif, tarif per kelas rumah sakit, per regional, per kelas rawat'
        cara_memperoleh: 'Unduh PDF resmi, ekstraksi tabel'
        kegunaan: >-
          Ini tulang punggung kepala K2. Tanpa tabel tarif, selisih rupiah tidak bisa
          dihitung, dan seluruh keluaran kembali menjadi skor buram.
        tingkat_kesulitan: 'Sedang. Tabel PDF panjang, perlu pembersihan.'
        status: 'wajib'
      - nama: 'Pedoman INA-CBG'
        sumber: 'Permenkes 26/2021'
        isi: 'Aturan pengelompokan, definisi tingkat keparahan, aturan episode'
        kegunaan: 'Menulis grouper sederhana di dalam pembangkit, supaya klaim sintetis dikelompokkan dengan aturan yang benar.'
        status: 'wajib'
      - nama: 'Permenkes 16/2019'
        isi: 'Taksonomi kecurangan dan sanksi'
        kegunaan: 'Memastikan penamaan modus kami sama dengan penamaan regulator.'
        status: 'wajib'
      - nama: 'Klasifikasi ICD-10'
        sumber: 'WHO'
        isi: 'Kode diagnosis dan hierarkinya'
        kegunaan: 'Kamus token dan pohon untuk embedding hierarkis.'
        status: 'wajib'
      - nama: 'Klasifikasi ICD-9-CM prosedur'
        kegunaan: 'Kamus token prosedur. Indonesia masih memakai ICD-9-CM untuk prosedur.'
        status: 'wajib'
      - nama: 'Klasifikasi ATC'
        sumber: 'WHO Collaborating Centre for Drug Statistics Methodology'
        kegunaan: 'Kamus token obat, dan hierarki lima tingkat untuk embedding.'
        status: 'wajib'
      - nama: 'Formularium Nasional'
        sumber: 'Keputusan Menteri Kesehatan'
        kegunaan: >-
          Membatasi obat yang mungkin muncul pada klaim JKN. Ini penting supaya
          pembangkit tidak menghasilkan obat yang tidak ditanggung.
        status: 'wajib'
      - nama: 'Registri fasilitas kesehatan'
        sumber: 'Kemenkes, sistem informasi rumah sakit daring'
        isi: 'Nama, kelas, kepemilikan, jumlah tempat tidur, lokasi'
        kegunaan: >-
          Simpul faskes pada graf entitas berasal dari sini. Ini yang membuat jaringan
          sintetis kami punya geografi yang benar, termasuk kepadatan rumah sakit yang
          timpang antara Jawa dan luar Jawa.
        status: 'wajib'
      - nama: 'Data kependudukan BPS'
        isi: 'Piramida penduduk per provinsi dan kabupaten'
        kegunaan: 'Sebaran umur dan jenis kelamin peserta sintetis.'
        status: 'wajib'
      - nama: 'Survei Kesehatan Indonesia'
        isi: 'Prevalensi penyakit menurut umur dan wilayah'
        kegunaan: 'Sebaran penyakit pada populasi sintetis. Ini yang mencegah kami membuat Indonesia dengan pola penyakit Amerika.'
        status: 'wajib'
      - nama: 'Upah minimum kabupaten kota'
        kegunaan: 'Hanya kalau kami menyentuh kategori pemberi kerja. Untuk sekarang tidak.'
        status: 'opsional'
      - nama: 'Laporan bulanan pemantauan JKN dari DJSN'
        isi: 'Pemanfaatan per jenis layanan, rasio klaim, kolektabilitas'
        kegunaan: >-
          Ini penyetel utama pembangkit. Jumlah kunjungan RJTP, RJTL, dan RITL per
          periode dipakai sebagai sasaran agregat yang harus dicocokkan data sintetis kami.
        catatan_akses: >-
          Berkas PDF-nya ada di situs DJSN, tapi permintaan langsung dari alat kami
          ditolak server. Perlu diunduh lewat peramban biasa.
        status: 'wajib'
      - nama: 'Panduan praktik klinis'
        sumber: 'Kemenkes dan perhimpunan profesi'
        kegunaan: >-
          Menentukan bukti apa yang seharusnya menyertai diagnosis apa. Ini yang mengisi
          fungsi pelabel lemah pada bagian 9.5.
        tingkat_kesulitan: 'Tinggi. Tersebar, tidak seragam, sebagian tidak digital.'
        status: 'dikerjakan sebagian, untuk sepuluh sampai dua puluh kondisi terbesar saja'

  # ---------------------------------------------------------------------------
  # Lapis 1: korpus struktur klaim yang nyata, dari luar negeri
  # ---------------------------------------------------------------------------
  lapis_1_korpus_asing:
    penjelasan: >-
      Kami memakai data asing untuk mempelajari bentuk klaim dan hubungan antar-kode,
      bukan untuk mempelajari Indonesia. Bentuk klaim relatif universal. Sebaran
      penyakit tidak.
    daftar:
      - nama: 'CMS DE-SynPUF'
        apa: >-
          Berkas klaim Medicare sintetis yang diterbitkan CMS, dibangun dari sampel acak
          lima persen penerima manfaat tahun 2008 dan klaim mereka sampai 2010.
        isi: 'Ringkasan penerima manfaat, klaim rawat inap, rawat jalan, carrier, dan kejadian obat resep'
        ukuran: 'Tersedia dalam 1.000, 100.000, dan 2,3 juta orang'
        lisensi: 'Domain publik, bisa diunduh langsung tanpa perjanjian'
        url: 'https://www.cms.gov/data-research/statistics-trends-and-reports/medicare-claims-synthetic-public-use-files/cms-2008-2010-data-entrepreneurs-synthetic-public-use-file-de-synpuf'
        status: terverifikasi
        kegunaan_untuk_kami:
          - 'Pralatih tulang punggung pada struktur klaim yang nyata bentuknya.'
          - 'Menguji apakah penokenan kami bisa menangani klaim dunia nyata, bukan hanya klaim buatan kami.'
          - 'Menyediakan sebaran ekor biaya yang realistis.'
        batasnya: >-
          Ini sendiri data sintetis, dan CMS sengaja merusak sebagian korelasinya demi
          privasi. Jadi ia baik untuk struktur, buruk untuk korelasi klinis halus.
          Karena itu kami memasangkannya dengan MIMIC.
      - nama: 'Data pemanfaatan dan pembayaran penyedia Medicare'
        apa: 'Data agregat tingkat penyedia yang nyata, Part B, Part D, dan DMEPOS'
        lisensi: 'Terbuka'
        kegunaan: >-
          Sebaran perilaku penyedia yang nyata. Ini yang dipakai untuk menyetel seberapa
          lebar variasi antar-penyedia yang wajar, dan itu langsung menentukan ambang
          kepala K4.
        status: terverifikasi
      - nama: 'List of Excluded Individuals and Entities'
        apa: 'Daftar penyedia yang dikecualikan dari program federal, diterbitkan bulanan oleh OIG'
        mengapa_ini_penting: >-
          Ini satu satunya label kecurangan penyedia yang terbuka di dunia. Digabungkan
          dengan data pemanfaatan lewat nomor identitas penyedia, ia menghasilkan
          himpunan uji berlabel yang nyata.
        kegunaan_untuk_kami: >-
          Bukan untuk melatih model Indonesia. Untuk membuktikan bahwa arsitektur kami
          bisa memisahkan penyedia curang yang nyata dari yang tidak. Ini uji kelayakan
          arsitektur pada label nyata, dan itu argumen yang sangat kuat di depan juri.
        status: terverifikasi
        catatan_kritis: >-
          Label ini menandai penyedia yang tertangkap, bukan yang curang. Kami akan
          menuliskan keterbatasan itu, bukan menyembunyikannya.
      - nama: 'MIMIC-IV'
        apa: 'Rekam medis elektronik teranonimkan dari satu pusat medis di Amerika, termasuk laboratorium, resep, diagnosis, dan prosedur'
        akses: 'Perlu pendaftaran berkredensial di PhysioNet dan pelatihan etika penelitian. Gratis.'
        url: 'https://physionet.org/content/mimiciv/3.1/'
        status: terverifikasi
        kegunaan_untuk_kami:
          - >-
            Ini penyumbang realisme terbesar. Dari sini kami mempelajari sebaran bersyarat
            antara diagnosis, nilai laboratorium, obat, dan prosedur. Sebaran itu yang
            kami tanam ke dalam pembangkit, sehingga laboratorium sintetis kami bukan
            angka acak, tapi angka yang berkorelasi benar dengan diagnosisnya.
          - 'Menguji kepala K1 pada data klinis nyata, meskipun bukan Indonesia.'
        batasnya: >-
          Ini data unit perawatan intensif di satu rumah sakit Amerika. Sebaran
          penyakitnya jauh dari Indonesia. Karena itu kami hanya mengambil struktur
          bersyaratnya, bukan sebaran marginalnya. Marginal datang dari sumber Indonesia.
        risiko_waktu: >-
          Proses kredensial PhysioNet bisa memakan waktu berhari hari sampai berminggu.
          Harus diajukan sekarang, bukan nanti. Ini butir dengan tenggat paling mendesak
          di seluruh rencana ini.

  # ---------------------------------------------------------------------------
  # Lapis 2: sampel Indonesia
  # ---------------------------------------------------------------------------
  lapis_2_sampel_indonesia:
    nama: 'Data Sampel BPJS Kesehatan'
    apa: >-
      BPJS Kesehatan menyediakan data sampel kepesertaan dan pemanfaatan pelayanan
      untuk publik, mulai periode 2015 sampai 2016 dan kemudian diperluas sampai 2018.
    ukuran: 'Sisi kepesertaan memuat 1.697.452 baris, sekitar satu persen peserta JKN pada 2016'
    cara_memperoleh: >-
      Permohonan ke Pejabat Pengelola Informasi dan Dokumentasi BPJS Kesehatan, dengan
      surat pengantar instansi, formulir permohonan informasi publik, pakta integritas,
      proposal penelitian, dan salinan identitas.
    url: 'https://theconversation.com/data-terbuka-bpjs-kesehatan-modal-awal-untuk-ungkap-misteri-sains-kesehatan-indonesia-116522'
    status: terverifikasi
    status_hukum_terhadap_aturan_lomba: >-
      Aturan lomba melarang memakai data peserta yang nyata tanpa izin resmi
      penyelenggara. Data sampel ini justru dirilis resmi untuk penelitian dan sudah
      dianonimkan, dan permohonannya melalui jalur resmi. Jadi memakainya lewat jalur
      PPID tidak melanggar. Tetapi ini penafsiran kami, dan harus dikonfirmasi ke
      panitia sebelum dipakai, bukan sesudah.
    keputusan_kami: >-
      Rancangan ini disusun dengan asumsi kami tidak mendapatkannya selama masa lomba.
      Prosesnya memakan waktu dan hasilnya tidak pasti. Permohonan tetap diajukan
      sekarang, karena kalau berhasil nilainya besar. Tapi tidak ada satu pun bagian
      dari rancangan ini yang runtuh kalau permohonan ditolak.
    kalau_dapat_apa_yang_berubah:
      - 'Sebaran marginal pembangkit disetel ke sebaran nyata, bukan ke agregat terbitan.'
      - 'Uji realisme naik dari membandingkan agregat menjadi membandingkan sebaran penuh.'
      - 'Kepala K4 bisa mempelajari kelompok sebaya faskes yang nyata.'
    kalau_tidak_dapat_apa_gantinya: >-
      Angka agregat dari laporan DJSN dan dari publikasi ilmiah yang memakai data sampel
      itu. Banyak artikel jurnal Indonesia melaporkan statistik ringkas dari data sampel,
      dan statistik ringkas itu cukup untuk menyetel pembangkit.

  # ---------------------------------------------------------------------------
  # Lapis 3: pembangkit kami sendiri
  # ---------------------------------------------------------------------------
  lapis_3_pembangkit:
    catatan: 'Rinciannya di bagian 12. Ini bagian terbesar dari pekerjaan data.'

  tata_kelola_privasi:
    - 'Tidak ada data peserta JKN yang nyata dipakai selama masa lomba.'
    - 'MIMIC dipakai di bawah perjanjian penggunaan datanya, dan tidak pernah dikeluarkan dari mesin lokal.'
    - 'Data sintetis yang kami hasilkan tidak berasal dari orang mana pun, jadi tidak ada risiko identifikasi ulang.'
    - >-
      Kalau kelak sistem ini dipakai pada data nyata, seluruh identitas masuk ke model
      dalam bentuk penanda ter-hash, dan model tidak pernah menerima nama, nomor kartu,
      atau tanggal lahir tepat. Ini bukan sekadar kepatuhan pada undang undang
      pelindungan data pribadi, ini juga membuat model tidak bisa menghafal orang.

# =============================================================================
# 12. PEMBANGKIT DATA SINTETIS
# =============================================================================

pembangkit:

  nama: 'SIMJKN'
  bentuk: 'Simulator berbasis proses, bukan model generatif yang dilatih.'

  mengapa_bukan_model_generatif_yang_dilatih:
    daftar:
    - alasan: 'Tidak ada yang bisa dilatih'
      penjelasan: >-
        Model generatif seperti jaringan lawan atau model difusi tabular butuh data
        nyata untuk ditiru. Kami tidak punya. Melatihnya pada DE-SynPUF hanya akan
        menghasilkan tiruan Medicare, bukan tiruan JKN.
    - alasan: 'Kami butuh kebenaran dasar yang tepat'
      penjelasan: >-
        Simulator memberi kami pasangan klaim jujur dan klaim curang untuk kasus yang
        sama persis. Selisih rupiahnya diketahui sampai rupiah terakhir. Model generatif
        tidak bisa memberi itu, karena ia tidak tahu mana yang curang.
    - alasan: 'Kami butuh kendali'
      penjelasan: >-
        Untuk menguji ketahanan, kami harus bisa memutar tombol intensitas kecurangan,
        mengubah perilaku pelaku, dan menjalankan pelaku yang beradaptasi. Simulator
        memberikan tombol itu.
    - alasan: 'Bisa dijelaskan ke juri'
      penjelasan: >-
        Setiap keputusan pembangkit bisa ditunjuk ke sumbernya. Sebaran umur dari BPS.
        Prevalensi dari survei kesehatan. Tarif dari Permenkes. Model generatif yang
        dilatih adalah kotak hitam di atas kotak hitam.
    catatan_jujur: >-
      Ada harganya. Simulator hanya sekaya imajinasi penulisnya. Pola yang tidak kami
      pikirkan tidak akan ada di data, dan model akan terlihat lebih baik dari
      seharusnya. Bagian 12.6 dan bagian 13.4 adalah upaya kami menutup lubang itu.

  tujuh_tahap:

    tahap_1_populasi:
      keluaran: 'Sekitar dua juta peserta sintetis'
      cara: >-
        Ambil sebaran umur dan jenis kelamin per kabupaten dari BPS, lalu bagi ke segmen
        kepesertaan menurut proporsi yang diterbitkan BPJS. Peserta diberi kabupaten,
        umur, jenis kelamin, segmen, dan hak kelas.
      sumber_penyetel: ['BPS', 'Laporan kepesertaan BPJS per segmen']
      yang_harus_benar: >-
        Proporsi penerima bantuan iuran jauh lebih besar dari segmen lain, dan
        persebarannya tidak merata antar-wilayah. Kalau ini salah, seluruh pola
        pemanfaatan ikut salah.

    tahap_2_morbiditas:
      keluaran: 'Riwayat penyakit per peserta sepanjang tiga tahun'
      cara: >-
        Untuk tiap peserta, tarik kondisi kronis menurut prevalensi berdasarkan umur,
        jenis kelamin, dan wilayah. Lalu jalankan rantai perkembangan sederhana per
        tahun, sehingga diabetes bisa berkembang menjadi diabetes dengan komplikasi,
        dan hipertensi bisa berkembang menjadi penyakit ginjal.
      sumber_penyetel: ['Survei Kesehatan Indonesia', 'MIMIC untuk laju perkembangan antar-kondisi']
      mengapa_rantai_perkembangan_penting: >-
        Tanpa itu, komorbiditas akan muncul acak, dan kepala K1 akan mudah sekali
        membedakan yang wajar dari yang tidak. Model akan terlihat hebat karena
        soalnya terlalu mudah. Dengan rantai perkembangan, komorbiditas yang wajar
        punya struktur, dan soalnya menjadi sulit dengan cara yang benar.

    tahap_3_pencarian_layanan:
      keluaran: 'Kapan seseorang berobat, dan ke mana'
      cara: >-
        Peluang berobat bergantung pada kondisi, umur, segmen, dan jarak ke faskes.
        Peserta di daerah terpencil berobat lebih jarang untuk keluhan yang sama.
      yang_harus_benar: >-
        Ketimpangan akses harus ada di data. Kalau tidak ada, kepala K4 akan menganggap
        rendahnya pemanfaatan di Papua sebagai anomali, padahal itu kenyataan.
      sumber_penyetel: ['Laporan pemanfaatan DJSN per wilayah']

    tahap_4_penugasan_faskes:
      keluaran: 'Faskes mana yang menangani tiap kunjungan'
      cara: >-
        Ambil faskes dari registri nyata, pilih menurut jarak, kelas, dan ketersediaan
        layanan. Rujukan mengikuti aturan berjenjang, dengan pengecualian gawat darurat.
      mengapa_registri_nyata: >-
        Ini yang memberi geografi yang benar pada graf entitas. Kepadatan rumah sakit
        di Jakarta dan di Maluku berbeda jauh, dan perbedaan itu menentukan pola
        rujukan yang wajar. Faskes karangan akan menghasilkan graf yang terlalu rapi.

    tahap_5_episode_klinis:
      keluaran: 'Isi klinis satu episode, yaitu diagnosis, prosedur, obat, laboratorium, lama rawat'
      cara: >-
        Diagnosis primer ditentukan kondisi yang memicu kunjungan. Dari diagnosis primer,
        sampel prosedur, obat, laboratorium, dan lama rawat dari sebaran bersyarat yang
        dipelajari dari MIMIC dan disaring dengan Formularium Nasional serta panduan
        praktik klinis.
      penanganan_data_hilang: >-
        Ketiadaan laboratorium disimulasikan menurut kelas faskes dan wilayah, bukan
        secara acak seragam. FKTP tanpa laboratorium tidak akan pernah menghasilkan
        nilai laboratorium. Ini penting, karena pola ketiadaan itu sendiri membawa
        informasi, dan model harus belajar membedakan tidak ada alat dari tidak dikirim.
      yang_paling_sulit: >-
        Menjaga agar kombinasi diagnosis, prosedur, dan obat tetap masuk akal secara
        klinis. Sebagian bisa dijamin dengan aturan dari panduan praktik klinis.
        Sisanya bergantung pada sebaran bersyarat dari MIMIC, dan itu berasal dari
        populasi yang berbeda. Ini keterbatasan yang harus ditulis.

    tahap_6_pengkodean_dan_tarif:
      keluaran: 'Klaim jujur, lengkap dengan kelompok tarif dan nilai tarif'
      cara: >-
        Terapkan aturan pengelompokan INA-CBG pada kode yang dihasilkan tahap lima,
        hasilkan kelompok tarif dan tingkat keparahan, lalu ambil tarifnya dari tabel
        resmi menurut kelas rumah sakit dan regional.
      catatan_penting: >-
        Kami tidak berusaha mereplikasi grouper INA-CBG resmi secara persis. Itu
        pekerjaan besar dan tidak perlu. Kami menulis pendekatan yang menghormati
        aturan pokoknya, dan menuliskan bahwa ini pendekatan. Yang penting adalah
        hubungan antara kode dan tarif punya struktur yang benar, bukan angkanya persis.
      kesalahan_pengkodean_yang_jujur: >-
        Sebagian klaim diberi kesalahan kode yang tidak disengaja, dengan laju yang
        disetel dari penelitian Indonesia yang melaporkan ketidaktepatan kode diagnosis
        pada kisaran tiga puluh persen berkas. Ini penting. Tanpa kesalahan jujur,
        setiap penyimpangan akan berarti curang, dan model akan belajar soal yang jauh
        lebih mudah dari kenyataan.
      status_angka_kesalahan: dari_pustaka
      catatan_angka: >-
        Angka ketidaktepatan tiga puluh satu persen berasal dari satu penelitian pada
        87 dokumen di satu rumah sakit. Itu sampel kecil di satu tempat. Kami memakainya
        sebagai titik tengah dengan rentang yang lebar, dan menjalankan analisis
        kepekaan terhadap nilai itu.

    tahap_7_perilaku_faskes_dan_injeksi:
      keluaran: 'Klaim yang benar benar diajukan, plus label kebenaran dasar'
      gagasan_kunci: >-
        Kecurangan tidak ditaburkan acak per klaim. Ia melekat pada perilaku faskes.
        Tiap faskes diberi kebijakan, dan kebijakan itu yang menentukan klaim mana yang
        diubah dan bagaimana.
      mengapa_ini_menentukan: >-
        Kalau kecurangan ditaburkan acak, kepala K4 tidak akan pernah punya sinyal,
        karena tidak ada faskes yang lebih curang dari faskes lain. Seluruh keluarga C
        akan mati. Dan yang lebih buruk, hasil evaluasinya akan menyesatkan, karena di
        dunia nyata kecurangan memang mengelompok.

  kebijakan_faskes:
    penjelasan: 'Tiap faskes sintetis diberi satu kebijakan. Sebaran kebijakannya sendiri adalah parameter yang bisa disetel.'
    daftar:
      - nama: 'jujur'
        perilaku: 'Tidak pernah mengubah klaim. Kesalahan kode yang muncul murni tidak sengaja.'
        porsi_awal: 0.78
      - nama: 'oportunis'
        perilaku: >-
          Mengubah klaim hanya pada kelompok tarif dengan selisih besar antar-tingkat
          keparahan, dan hanya ketika bukti pendukung kebetulan tidak lengkap.
        porsi_awal: 0.14
        catatan: 'Ini yang paling nyata dan paling sulit. Ia bersembunyi di balik data yang memang tidak lengkap.'
      - nama: 'sistematis'
        perilaku: 'Mengubah klaim pada semua kasus yang bisa diubah, dengan intensitas tetap.'
        porsi_awal: 0.06
      - nama: 'ekstrem'
        perilaku: 'Menagih layanan yang tidak pernah terjadi, dalam volume besar.'
        porsi_awal: 0.02
        catatan: >-
          Porsi kecil, tapi ini yang menghasilkan nilai kerugian terbesar per entitas,
          sesuai pola kasus 2024 di mana satu rumah sakit menyumbang bagian terbesar.
    porsi_awal_ini_asumsi: >-
      Tidak ada sumber yang menyatakan sebaran ini. Ia dipilih supaya proporsi klaim
      yang terpengaruh berada di rentang yang sering disebut literatur, yaitu tiga
      sampai sepuluh persen. Analisis kepekaan dijalankan pada tiga tingkat prevalensi,
      dan hasilnya dilaporkan bertiga, bukan satu.

  injeksi_per_modus:
    penjelasan: >-
      Tiap modus adalah satu transformasi pada klaim jujur. Semuanya menghasilkan tiga
      hal: klaim yang diubah, klaim aslinya, dan selisih rupiahnya.
    katalog:
      - modus: 'M04 upcoding'
        transformasi: >-
          Tambahkan satu atau dua diagnosis sekunder yang memindahkan tingkat keparahan
          ke atas, dipilih dari komorbiditas yang plausibel untuk umur dan diagnosis
          primer itu, tapi tanpa menambahkan bukti pendukungnya.
        parameter: ['peluang per klaim yang memenuhi syarat', 'jumlah kode tambahan', 'apakah bukti ikut dipalsukan']
        varian_sulit: >-
          Varian di mana bukti pendukung ikut dipalsukan. Ini menghasilkan klaim yang
          konsisten secara internal dan hampir tidak bisa dideteksi dari satu klaim.
          Hanya kepala K4 dan K5 yang punya peluang. Kami sengaja memasukkannya supaya
          hasil evaluasi tidak terlalu optimistis.
        kebenaran_dasar: 'selisih tarif antara tingkat keparahan yang ditagih dan yang asli'
      - modus: 'M06 phantom billing'
        transformasi: >-
          Buat episode yang tidak berasal dari kunjungan mana pun, dilekatkan pada
          peserta nyata yang terdaftar di wilayah itu. Isinya disalin dari pola episode
          yang wajar, tapi tidak menyertakan obat dan laboratorium.
        parameter: ['jumlah klaim palsu per bulan', 'jenis layanan yang dipalsukan', 'apakah obat ikut dikarang']
        kebenaran_dasar: 'seluruh nilai klaim'
        catatan: >-
          Varian tempel pada pasien nyata inilah yang terjadi di kasus 2024. Pasien ada,
          kunjungannya ada, tapi jumlah tindakannya digelembungkan.
      - modus: 'M05 cloning'
        transformasi: >-
          Salin isi klaim dari episode lain di faskes yang sama, ganti identitas peserta,
          geser tanggal sedikit, dan biarkan nilai laboratorium serta lama rawat identik.
        parameter: ['jumlah salinan per sumber', 'seberapa banyak yang divariasikan']
        kebenaran_dasar: 'nilai klaim salinan'
      - modus: 'M08 dan M16 pemecahan episode dan readmisi'
        transformasi: >-
          Ambil satu episode rawat inap, potong menjadi dua episode dengan jeda pendek,
          bagi prosedur dan obatnya, lalu kelompokkan tarif keduanya secara terpisah.
        parameter: ['jeda hari', 'cara membagi prosedur']
        kebenaran_dasar: 'jumlah dua tarif dikurangi tarif episode utuh'
      - modus: 'M09 unbundling'
        transformasi: 'Pisahkan pasangan prosedur yang seharusnya satu paket menjadi dua klaim atau dua baris tagihan.'
        parameter: ['daftar pasangan yang bisa dipisah', 'peluang pemisahan']
        kebenaran_dasar: 'selisih terhadap tarif paket'
      - modus: 'M11 repeat billing'
        transformasi: 'Duplikasi klaim dengan perubahan kecil pada satu kolom supaya lolos pemeriksaan kunci sederhana.'
        parameter: ['kolom mana yang diubah']
        kebenaran_dasar: 'nilai klaim duplikat'
        catatan: >-
          Varian yang mengubah satu kolom inilah yang membuat modus ini tidak sepenuhnya
          selesai dengan indeks unik. Aturan menangkap duplikat sempurna. Model menangkap
          duplikat yang sengaja dirusak sedikit.
      - modus: 'M12 prolonged length of stay'
        transformasi: 'Perpanjang lama rawat sampai melewati ambang yang memindahkan kelompok tarif.'
        parameter: ['berapa hari ditambah']
        kebenaran_dasar: 'selisih tarif akibat perpindahan kelompok'
      - modus: 'M13 kelas perawatan'
        transformasi: 'Naikkan kelas rawat yang ditagih di atas kelas yang ditempati, sampai melebihi kapasitas fisik pada sebagian faskes.'
        parameter: ['peluang kenaikan', 'apakah melebihi kapasitas']
        kebenaran_dasar: 'selisih tarif antar-kelas'
      - modus: 'M07 inflated bills'
        transformasi: 'Naikkan harga satuan obat dan alat kesehatan di atas harga acuan.'
        parameter: ['pengali harga']
        kebenaran_dasar: 'selisih terhadap harga acuan'
      - modus: 'M14 dan M17 tindakan dan barang fiktif'
        transformasi: 'Tambahkan prosedur atau barang yang tidak pernah dipakai, tanpa menambah obat pendukungnya.'
        parameter: ['jumlah item tambahan']
        kebenaran_dasar: 'nilai item tambahan'
      - modus: 'M03 dan M10 rujukan'
        transformasi: >-
          Ubah pola rujukan sehingga terkonsentrasi ke satu FKRTL, atau rujuk kasus yang
          seharusnya tuntas di FKTP.
        parameter: ['derajat konsentrasi', 'porsi kasus yang seharusnya tuntas']
        kebenaran_dasar: 'selisih biaya antara penanganan di FKTP dan di FKRTL'
      - modus: 'M20 manipulasi hasil'
        transformasi: >-
          Geser nilai laboratorium sampai tepat melewati ambang syarat penagihan, dengan
          penumpukan di sisi dalam ambang.
        parameter: ['seberapa jauh digeser']
        kebenaran_dasar: 'nilai klaim yang lolos karena pergeseran'
        catatan: 'Hanya bisa dijalankan kalau lapisan laboratorium diaktifkan. Dipakai untuk mensimulasikan dunia setelah P2 berjalan.'
      - modus: 'M01 dan M02 kapitasi dan nonkapitasi'
        transformasi: 'Naikkan frekuensi klaim nonkapitasi di FKTP tertentu di luar pola sebayanya.'
        kebenaran_dasar: 'nilai klaim berlebih'
      - modus: 'M15 dan M18'
        status: 'tidak diinjeksikan'
        alasan: >-
          Keduanya tidak meninggalkan jejak yang bisa dilihat pada data yang kami
          bangkitkan. Menginjeksikannya lalu mengaku mendeteksinya akan menjadi
          pembuktian yang kosong.

  kasus_batas_yang_wajib_ada:
    penjelasan: >-
      Ini yang mencegah model menghukum praktik yang sah. Tiap kasus batas adalah pola
      yang tampak curang tapi sebenarnya benar. Kalau model menandainya, model salah.
    daftar:
      - nama: 'Rumah sakit rujukan nasional'
        pola: 'Bauran kasus yang jauh lebih berat dari rata rata, tingkat keparahan tinggi yang sah.'
        yang_diuji: 'Apakah kepala K4 membentuk kelompok sebaya yang benar, bukan membandingkannya dengan rumah sakit umum daerah.'
      - nama: 'Kemoterapi dan hemodialisis berulang'
        pola: 'Kunjungan berulang dengan jarak teratur, diagnosis sama, sepanjang tahun.'
        yang_diuji: 'Apakah kepala K3 belajar bahwa keteraturan itu wajar untuk kondisi ini.'
      - nama: 'Politrauma'
        pola: 'Banyak prosedur yang biasanya tidak muncul bersama, dalam satu episode.'
        yang_diuji: 'Apakah aturan pasangan kode memberi pengecualian yang benar.'
      - nama: 'Wabah atau bencana'
        pola: 'Lonjakan mendadak admisi dengan diagnosis seragam di satu wilayah.'
        yang_diuji: 'Apakah kepala K5 menandainya sebagai kloning. Seharusnya tidak, karena pasiennya berbeda dan nilai laboratoriumnya bervariasi.'
      - nama: 'Penyakit langka'
        pola: 'Diagnosis yang hampir tidak pernah muncul, biaya tinggi, bukti yang tidak biasa.'
        yang_diuji: 'Apakah normalisasi terhadap kasus sejenis pada kepala K1 bekerja ketika kasus sejenis hampir tidak ada.'
        catatan: >-
          Ini kasus paling sulit di seluruh daftar, dan kemungkinan besar model akan
          gagal. Kalau gagal, jalan keluarnya bukan memperbaiki model, tapi memberi
          ambang khusus untuk kelompok tarif berfrekuensi sangat rendah, dan
          menyerahkannya ke pemeriksaan manusia. Itu jawaban yang benar.
      - nama: 'FKTP tanpa laboratorium'
        pola: 'Seluruh bidang laboratorium kosong, terus menerus.'
        yang_diuji: 'Apakah pembedaan antara hilang dan ditutup mencegah model menghukum faskes ini.'
      - nama: 'Rumah sakit baru'
        pola: 'Riwayat pendek, volume kecil, statistiknya bising.'
        yang_diuji: 'Apakah kepala K4 menahan diri ketika sampelnya terlalu kecil untuk disimpulkan.'
      - nama: 'Perubahan tarif'
        pola: 'Tabel tarif berubah di tengah periode.'
        yang_diuji: 'Apakah kepala K2 memakai tabel yang berlaku pada tanggal klaim, bukan tabel terbaru.'

  uji_realisme:
    penjelasan: >-
      Data sintetis yang tidak diuji realismenya adalah data karangan. Ini yang
      membedakan rencana ini dari sekadar membuat data acak. Tiap uji punya ambang
      lulus dan tindakan bila gagal.
    daftar:
      - uji: 'Kecocokan agregat'
        cara: >-
          Bandingkan jumlah kunjungan per jenis layanan, rasio rawat jalan terhadap
          rawat inap, dan sebaran kelompok tarif teratas terhadap angka terbitan DJSN
          dan BPJS.
        ambang_lulus: 'Selisih relatif di bawah lima belas persen untuk sepuluh besaran teratas.'
        bila_gagal: 'Setel ulang tahap tiga dan tahap lima.'
      - uji: 'Kecocokan bentuk sebaran biaya'
        cara: 'Bandingkan bentuk ekor sebaran biaya klaim dengan sebaran pada DE-SynPUF setelah diskalakan.'
        ambang_lulus: 'Jarak Kolmogorov Smirnov di bawah 0,1 pada sebaran terskala.'
        bila_gagal: 'Perbaiki sebaran biaya di tahap enam.'
      - uji: 'Kecocokan struktur kemunculan bersama'
        cara: >-
          Hitung matriks informasi timbal balik berpasangan antar-kode pada data
          sintetis dan pada MIMIC, lalu korelasikan.
        ambang_lulus: 'Korelasi peringkat di atas 0,5 pada pasangan yang sama sama sering muncul.'
        bila_gagal: 'Perbaiki sebaran bersyarat di tahap lima.'
      - uji: 'Latih di sintetis, uji di nyata'
        cara: >-
          Latih tugas hilir sederhana pada data sintetis, misalnya memperkirakan lama
          rawat dari diagnosis, lalu uji pada DE-SynPUF atau MIMIC.
        ambang_lulus: >-
          Kinerjanya harus jauh di atas tebakan, dan penurunannya terhadap model yang
          dilatih langsung pada data nyata harus di bawah sepertiga.
        bila_gagal: 'Sintetis kami tidak menangkap struktur yang benar. Kembali ke tahap lima.'
        mengapa_uji_ini_yang_paling_penting: >-
          Uji ini menjawab pertanyaan yang akan ditanyakan juri. Bagaimana kami tahu
          data karangan kami tidak sekadar mengonfirmasi diri sendiri.
      - uji: 'Kontrol negatif pada label nyata'
        cara: >-
          Latih arsitektur kami pada data sintetis, lalu terapkan pada data pemanfaatan
          penyedia Medicare yang nyata, dan lihat apakah penyedia yang ada di daftar
          pengecualian mendapat peringkat lebih tinggi dari acak.
        ambang_lulus: 'Peningkatan yang jelas di atas acak pada seratus peringkat teratas.'
        bila_gagal: >-
          Ini kegagalan yang paling informatif. Kalau arsitektur kami tidak bisa
          menemukan kecurangan yang nyata pada data yang nyata, maka keberhasilannya
          pada data sintetis kami tidak berarti apa apa. Kami akan menuliskannya.
        catatan: >-
          Ini uji tersulit dan paling mahal dari segi waktu. Kalau waktu tidak cukup
          sebelum tenggat proposal, ia dijadwalkan ke fase hackathon, dan kami menulis
          bahwa belum dijalankan.
      - uji: 'Tidak ada kebocoran identitas'
        cara: 'Periksa bahwa tidak ada baris sintetis yang identik dengan baris mana pun di sumber mana pun.'
        ambang_lulus: 'Nol kecocokan persis.'
      - uji: 'Pemeriksaan manusia'
        cara: >-
          Ambil lima puluh episode sintetis secara acak, tunjukkan ke orang yang paham
          klaim JKN, dan tanyakan mana yang tidak masuk akal.
        ambang_lulus: 'Tidak lebih dari sepersepuluh ditandai tidak masuk akal.'
        catatan: >-
          Uji paling sederhana dan sering paling menohok. Semua uji statistik bisa lolos
          sementara datanya tetap terasa aneh bagi orang yang tahu.

# =============================================================================
# 13. EVALUASI
# =============================================================================

evaluasi:

  aturan_pokok: >-
    Tidak ada angka hasil yang ditulis sebelum percobaan dijalankan. Yang ditulis di
    sini adalah metrik, ambang lulus, dan apa yang kami lakukan kalau gagal. Berkas
    asumsi sebelumnya mencantumkan nilai seperti PR-AUC 0,892 dan tingkat positif palsu
    1,6 persen. Angka angka itu tidak berasal dari percobaan mana pun, dan kalau juri
    menanyakan dari mana asalnya, tidak ada jawaban. Kami menghapusnya.

  # ---------------------------------------------------------------------------
  # 13.1 Metrik yang salah dan mengapa
  # ---------------------------------------------------------------------------
  metrik_yang_tidak_kami_pakai:
    - metrik: 'Akurasi'
      alasan: 'Dengan prevalensi beberapa persen, menebak semuanya bersih sudah memberi akurasi di atas sembilan puluh persen.'
    - metrik: 'Luas di bawah kurva ROC sebagai metrik utama'
      alasan: >-
        Ia mengukur seluruh rentang ambang, padahal kita hanya pernah bekerja di ujung
        paling curam. Auditor memeriksa beberapa ribu klaim dari puluhan juta. Yang
        penting hanya kinerja di seribu teratas.
      catatan: 'Tetap dilaporkan sebagai pelengkap, bukan sebagai metrik utama.'
    - metrik: 'F1'
      alasan: >-
        Ia menimbang presisi dan recall sama berat. Dalam kasus ini tidak sama berat.
        Satu tuduhan salah ke rumah sakit jujur lebih mahal daripada satu kecurangan
        yang lolos, karena yang pertama merusak kepercayaan sistem.

  # ---------------------------------------------------------------------------
  # 13.2 Metrik utama
  # ---------------------------------------------------------------------------
  metrik_utama:
    - nama: 'Rupiah berlebih yang benar teridentifikasi pada k teratas'
      definisi: >-
        Jumlah selisih rupiah sebenarnya, menurut kebenaran dasar, dari klaim yang
        masuk k peringkat teratas.
      mengapa_ini_utama: >-
        Ini yang menjadi tujuan sistem. Bukan menemukan banyak kasus, tapi menemukan
        banyak uang. Satu kasus lima puluh juta lebih berharga dari lima puluh kasus
        dua ratus ribu.
      nilai_k: 'Disetel ke kapasitas audit nyata. Kami menjalankan pada beberapa nilai, dari seratus sampai sepuluh ribu.'
    - nama: 'Rasio pengembalian'
      definisi: 'Rupiah berlebih yang teridentifikasi dibagi perkiraan biaya audit yang dikeluarkan.'
      mengapa: >-
        Ini bentuk yang dipakai NHS dan bentuk yang bisa dibawa ke rapat direksi.
        Angka mereka 3 banding 1. Itu pembanding yang jujur untuk kami.
    - nama: 'Presisi pada k teratas'
      definisi: 'Porsi klaim di k teratas yang benar benar mengandung selisih.'
    - nama: 'Peningkatan atas mesin aturan'
      definisi: >-
        Perbandingan rupiah yang teridentifikasi antara model kami dan lapisan aturan
        deterministik pada anggaran audit yang sama.
      mengapa_ini_yang_paling_menentukan: >-
        Kalau angka ini mendekati satu, seluruh proposal ini tidak punya alasan untuk
        ada. BPJS sudah punya mesin aturan. Ini metrik yang paling mungkin menjatuhkan
        kami, dan justru karena itu ia harus ada di depan.
    - nama: 'Laju penandaan pada klaim bersih'
      definisi: 'Porsi klaim tanpa selisih yang tetap ditandai.'
      hubungan_dengan_konformal: 'Ini yang dijamin kalibrasi konformal. Uji empirisnya adalah memeriksa apakah jaminannya benar benar terpenuhi.'
    - nama: 'Galat kalibrasi pada perkiraan selisih'
      definisi: >-
        Ketika model memperkirakan selisih lima juta, apakah selisih sebenarnya rata rata
        memang lima juta. Diukur lewat diagram keandalan pada beberapa pita nilai.
      mengapa: >-
        Kalau perkiraan selisihnya tidak terkalibrasi, seluruh peringkat audit salah,
        karena peringkatnya berdasarkan selisih.

  # ---------------------------------------------------------------------------
  # 13.3 Target dengan aturan keputusan
  # ---------------------------------------------------------------------------
  target:
    catatan: >-
      Tiap target ditulis sebagai pernyataan yang bisa gagal. Kalau gagal, tindakannya
      juga sudah ditulis, supaya kami tidak menyesuaikan target setelah melihat hasil.

    daftar:
    - id: 'T1'
      pernyataan: >-
        Pada anggaran audit seribu klaim, model menemukan setidaknya dua kali lipat
        rupiah berlebih dibanding lapisan aturan deterministik.
      mengapa_dua_kali: >-
        Di bawah dua kali, biaya membangun dan memelihara model tidak sebanding dengan
        menambah aturan. Angka ini kami tetapkan sekarang, sebelum melihat hasil.
      kalau_gagal: >-
        Kami melaporkan kegagalannya, dan mengubah posisi proposal dari model
        menggantikan aturan menjadi model melengkapi aturan pada modus yang tidak bisa
        diaturkan, yaitu keluarga B dan C.
    - id: 'T2'
      pernyataan: >-
        Jaminan konformal terpenuhi secara empiris. Ketika alpha ditetapkan satu persen,
        laju penandaan terukur pada klaim bersih tidak melebihi satu setengah persen.
      kalau_gagal: >-
        Berarti asumsi dapat dipertukarkan dilanggar. Kami menyelidiki penyebabnya,
        kemungkinan besar pergeseran antar-periode, dan pindah ke kalibrasi bersyarat
        kelompok yang lebih ketat.
    - id: 'T3'
      pernyataan: >-
        Model mengalahkan pohon berpenguat yang disetel dengan baik, pada metrik rupiah
        pada k teratas.
      mengapa_target_ini_ada: >-
        Literatur pemodelan tabular menunjukkan pohon berpenguat sering menang pada data
        seukuran ini. Kalau kami tidak menang, itu temuan penting dan harus dilaporkan.
      kalau_gagal: >-
        Kami melaporkan bahwa pohon berpenguat menang pada keluarga A, dan mempertahankan
        model dalam hanya untuk keluarga B dan C, yang memang tidak bisa dikerjakan pohon
        karena melibatkan barisan dan graf. Proposal tetap berdiri, dengan lingkup yang
        lebih jujur.
    - id: 'T4'
      pernyataan: >-
        Pralatih memberi perbaikan nyata. Model yang dipralatih dengan penutupan menurut
        peran mengalahkan model yang sama tanpa pralatih.
      kalau_gagal: 'Pralatih dibuang, dan kami menghemat sebagian besar anggaran komputasi.'
    - id: 'T5'
      pernyataan: >-
        Model tidak menandai faskes kecil dan faskes di luar Jawa lebih sering daripada
        yang dibenarkan selisih sebenarnya.
      cara_ukur: >-
        Bandingkan laju penandaan antar-kelompok pada klaim yang selisih sebenarnya nol.
        Perbedaannya tidak boleh melebihi dua kali lipat.
      kalau_gagal: >-
        Kalibrasi konformal dijalankan terpisah per kelompok, sehingga jaminannya
        berlaku per kelompok. Ini mengurangi daya deteksi, dan kami menerimanya.
      mengapa_target_ini_tidak_bisa_dilewat: >-
        Sistem yang secara sistematis menuduh puskesmas di daerah akan dimatikan dalam
        setahun, dan pantas dimatikan.
    - id: 'T6'
      pernyataan: >-
        Terhadap pelaku yang beradaptasi, keuntungan maksimum per klaim yang masih bisa
        diambil turun setidaknya setengah dibanding tanpa detektor.
      kalau_gagal: >-
        Berarti detektor kami mudah dihindari. Ini temuan penting yang hampir tidak
        pernah dilaporkan orang lain, dan kami akan melaporkannya.
    - id: 'T7'
      pernyataan: >-
        Kinerja bertahan pada faskes yang tidak pernah dilihat saat latih dan pada
        periode setelah periode latih.
      cara_ukur: 'Pemisahan menurut entitas dan menurut waktu, bukan pemisahan acak.'
      kalau_gagal: 'Model menghafal entitas. Perlu regularisasi pada embedding faskes atau menghapusnya sama sekali.'
      catatan: >-
        Pemisahan acak akan memberi angka yang jauh lebih bagus dan sepenuhnya
        menyesatkan, karena klaim dari rumah sakit yang sama akan muncul di latih dan uji.
        Kami tidak akan melaporkan angka dari pemisahan acak.

  # ---------------------------------------------------------------------------
  # 13.4 Garis dasar pembanding
  # ---------------------------------------------------------------------------
  garis_dasar:
    penjelasan: 'Model tanpa pembanding adalah klaim tanpa bukti. Semua ini wajib dijalankan.'
    daftar:
      - nama: 'Acak'
        peran: 'Batas bawah. Kalau ada yang tidak mengalahkan ini, ada kesalahan besar.'
      - nama: 'Lapisan aturan deterministik'
        isi: 'Deduplikasi, kode tidak sah, pasangan kode yang saling meniadakan, kelas melebihi kapasitas, lama rawat di luar rentang.'
        peran: 'Ini pengganti Vidi dalam percobaan kami. Pembanding yang paling menentukan.'
      - nama: 'Regresi logistik pada fitur yang direkayasa tangan'
        peran: 'Pembanding sederhana yang sering mengejutkan.'
      - nama: 'Pohon berpenguat'
        peran: 'Pembanding terkuat pada data tabular.'
      - nama: 'Deteksi pencilan tanpa pengawasan'
        contoh: 'Hutan isolasi dan tetangga terdekat'
        peran: 'Menunjukkan bahwa pencilan bukan kecurangan, dan mengapa pemodelan bersyarat diperlukan.'
      - nama: 'Model kami tanpa graf'
        peran: 'Ablasi'
      - nama: 'Model kami tanpa pralatih'
        peran: 'Ablasi'

  # ---------------------------------------------------------------------------
  # 13.5 Ablasi
  # ---------------------------------------------------------------------------
  ablasi:
    penjelasan: 'Tiap komponen harus membuktikan haknya untuk ada.'
    daftar:
      - komponen: 'Bias perhatian antar-bidang'
        cara_matikan: 'Nolkan dan bekukan matriks biasnya.'
      - komponen: 'Embedding hierarkis'
        cara_matikan: 'Ganti dengan tabel embedding biasa.'
        dugaan_kami: 'Paling terasa pada kode jarang. Diukur terpisah pada kode dengan frekuensi rendah.'
      - komponen: 'Penutupan menurut peran'
        cara_matikan: 'Ganti dengan penutupan acak seragam.'
      - komponen: 'Penyandian waktu kontinu'
        cara_matikan: 'Ganti dengan posisi bilangan bulat.'
        dugaan_kami: 'Paling terasa pada kepala K3.'
      - komponen: 'Kepala graf'
        cara_matikan: 'Buang kepala K4.'
      - komponen: 'Normalisasi terhadap kasus sejenis'
        cara_matikan: 'Pakai skor kejutan mentah.'
        dugaan_kami: >-
          Ini yang paling menentukan keadilan. Tanpa itu, kami memperkirakan rumah sakit
          rujukan akan mendominasi peringkat teratas. Kalau dugaan ini benar, ia menjadi
          contoh bagus untuk proposal.
      - komponen: 'Ukuran model'
        cara_uji: 'Tiga ukuran, sekitar lima juta, tujuh belas juta, dan empat puluh juta parameter.'
      - komponen: 'Ketersediaan laboratorium'
        cara_uji: >-
          Jalankan dengan bidang laboratorium terisi penuh, terisi separuh, dan kosong.
          Ini bukan ablasi biasa. Ini pengukuran langsung atas nilai rekomendasi P2,
          dan hasilnya adalah argumen kebijakan yang bisa dibawa ke BPJS.

  # ---------------------------------------------------------------------------
  # 13.6 Protokol yang membatalkan hasil
  # ---------------------------------------------------------------------------
  protokol_terlarang:
    penjelasan: 'Kalau kami melakukan salah satu dari ini, hasilnya tidak sah, dan kami harus mengulang.'
    daftar:
      - 'Memisahkan latih dan uji secara acak, sehingga klaim dari faskes yang sama ada di keduanya.'
      - 'Menyetel ambang pada himpunan uji.'
      - 'Melaporkan hasil terbaik dari banyak percobaan tanpa menyebutkan berapa percobaan yang dijalankan.'
      - 'Menyetel parameter pembangkit setelah melihat hasil model, sehingga soalnya dibuat lebih mudah.'
      - 'Melaporkan hasil hanya pada satu tingkat prevalensi kecurangan.'
      - 'Menyebut angka pada data sintetis sebagai perkiraan penghematan nasional.'
    catatan_terakhir: >-
      Butir terakhir yang paling menggoda. Sangat mudah mengalikan tingkat deteksi
      dengan Rp 191 triliun dan mendapat angka besar untuk salindia. Angka itu tidak
      punya arti, dan juri yang paham akan tahu.

# =============================================================================
# 14. RISIKO
# =============================================================================

risiko:

  - id: 'R1'
    risiko: 'Data sintetis terlalu mudah, sehingga model terlihat jauh lebih baik dari kenyataan'
    kemungkinan: 'tinggi'
    dampak: 'tinggi'
    tanda_awal: 'Metrik hampir sempurna pada percobaan pertama.'
    penanganan: >-
      Uji latih di sintetis uji di nyata, kontrol negatif pada label nyata, varian
      kecurangan yang konsisten secara internal, dan kesalahan pengkodean yang jujur.
      Empat empatnya sudah masuk rencana.
    catatan: 'Ini risiko terbesar di seluruh proyek. Kalau ada satu yang harus dijaga, ini.'

  - id: 'R2'
    risiko: 'Kredensial MIMIC tidak keluar tepat waktu'
    kemungkinan: 'sedang'
    dampak: 'sedang'
    penanganan: >-
      Ajukan hari ini. Sementara menunggu, pakai DE-SynPUF yang bisa diunduh langsung
      untuk struktur klaim, dan pakai literatur untuk hubungan diagnosis dan laboratorium.
      Rencana tetap berjalan tanpa MIMIC, hanya realismenya turun.

  - id: 'R3'
    risiko: 'Tabel tarif INA-CBG sulit diekstraksi dari PDF'
    kemungkinan: 'sedang'
    dampak: 'tinggi'
    penjelasan: 'Tanpa tabel tarif, kepala K2 tidak bisa berjalan, dan seluruh keluaran kehilangan satuan rupiah.'
    penanganan: >-
      Kerjakan paling awal, sebelum menulis model. Kalau ekstraksi gagal untuk seluruh
      tabel, ambil subhimpunan kelompok tarif terbesar, misalnya seratus kelompok yang
      paling sering muncul, dan batasi lingkup ke situ. Lingkup yang lebih sempit dengan
      angka yang benar lebih baik daripada lingkup penuh dengan angka karangan.

  - id: 'R4'
    risiko: 'Model kalah dari pohon berpenguat'
    kemungkinan: 'sedang'
    dampak: 'sedang'
    penanganan: >-
      Sudah diantisipasi di target T3. Kalau terjadi, proposal berubah posisi, tidak
      runtuh. Keluarga B dan C tetap butuh model, karena barisan dan graf tidak bisa
      dikerjakan pohon.

  - id: 'R5'
    risiko: 'Waktu tidak cukup sampai 19 September'
    kemungkinan: 'tinggi'
    dampak: 'tinggi'
    penjelasan: 'Empat belas hari, dan pekerjaan ini besar.'
    penanganan: >-
      Peta jalan di bagian 16 memisahkan apa yang wajib ada di proposal dari apa yang
      dikerjakan setelah lolos seleksi. Yang wajib ada di proposal jauh lebih kecil dari
      keseluruhan rencana.

  - id: 'R6'
    risiko: 'Juri menganggap ini terlalu teoretis, tidak ada yang bisa dilihat'
    kemungkinan: 'sedang'
    dampak: 'tinggi'
    penanganan: >-
      Kepala K5 adalah yang paling murah dan paling mudah didemokan. Ia menghasilkan
      pasangan klaim yang mirip mencurigakan, dan itu bisa ditunjukkan sebagai tabel
      dalam beberapa detik. Jadikan itu peraga pertama.

  - id: 'R7'
    risiko: 'Batas memori mesin pengembangan'
    kemungkinan: 'tinggi'
    dampak: 'sedang'
    penjelasan: 'Mesin pengembangan punya memori 16 gigabyte. Data klaim jutaan baris tidak muat sekaligus.'
    penanganan: >-
      Simpan dalam format kolumnar, olah lewat kueri di atas berkas tanpa memuat
      semuanya, dan latih dengan aliran per potongan. Ukuran model sengaja dijaga kecil
      justru karena ini.

  - id: 'R8'
    risiko: 'Rancangan ini dianggap tidak sesuai kategori karena menyentuh banyak modus'
    kemungkinan: 'rendah'
    dampak: 'tinggi'
    penanganan: >-
      Panduan secara tegas memperbolehkan mengangkat lebih dari satu sub-modus di dalam
      satu kategori. Seluruh dua puluh modus yang kami sentuh ada di dalam kategori
      Fasilitas Kesehatan. Ini akan dinyatakan eksplisit di halaman pertama proposal.

  - id: 'R9'
    risiko: 'Interpretasi kami tentang Data Sampel BPJS ternyata salah'
    kemungkinan: 'rendah'
    dampak: 'sedang'
    penanganan: >-
      Tanyakan ke panitia lewat kanal resmi sebelum memakainya. Rancangan sudah disusun
      dengan asumsi tidak memakainya, jadi jawaban tidak boleh pun tidak mengubah apa apa.

  - id: 'R10'
    risiko: 'Model dipakai untuk menghukum tanpa proses'
    kemungkinan: 'rendah selama lomba, nyata bila diterapkan'
    dampak: 'sangat tinggi'
    penanganan: >-
      P5 dan P6 di bagian 7. Ini bukan risiko teknis, ini risiko kelembagaan, dan
      menuliskannya di proposal adalah bagian dari tanggung jawab kami.

# =============================================================================
# 15. SUMBER DAYA
# =============================================================================

sumber_daya:

  perangkat_keras_yang_ada:
    memori: '16 gigabyte'
    implikasi: >-
      Ini batasan nyata, bukan formalitas. Ia menentukan ukuran model, format
      penyimpanan data, dan cara pelatihan. Seluruh rancangan sudah disesuaikan.

  keputusan_yang_lahir_dari_batasan_ini:
    - keputusan: 'Model sekitar tujuh belas juta parameter'
      alasan: 'Muat dilatih pada satu kartu grafis kelas konsumen tanpa trik khusus.'
      manfaat_sampingan: >-
        BPJS bisa menjalankannya sendiri di perangkat kerasnya, tanpa bergantung pada
        penyedia awan asing. Untuk data kesehatan nasional, itu bukan pertimbangan kecil.
    - keputusan: 'Penyimpanan kolumnar dan kueri di atas berkas'
      alasan: 'Tidak perlu memuat seluruh data ke memori.'
    - keputusan: 'Panjang barisan 128'
      alasan: 'Biaya perhatian tumbuh kuadratik. Pada 128 masih murah.'
    - keputusan: 'Data sintetis dibangkitkan bertahap, bukan sekaligus'
      alasan: 'Dua juta peserta dengan tiga tahun riwayat tidak muat dibangkitkan sekaligus.'

  anggaran_komputasi:
    pralatih:
      volume_data: 'sekitar sepuluh juta episode'
      perkiraan_waktu: 'satu sampai tiga hari pada satu kartu grafis kelas konsumen'
      catatan: 'Perkiraan kasar. Akan diukur pada percobaan pertama dan angkanya diperbarui.'
    penyetelan_kepala:
      perkiraan_waktu: 'beberapa jam per kepala'
    evaluasi_penuh:
      perkiraan_waktu: 'satu hari, termasuk seluruh ablasi'
    total_sampai_hasil_pertama: 'sekitar satu minggu waktu mesin, kalau tidak ada yang gagal'
    catatan_jujur: >-
      Selalu ada yang gagal. Kalikan dua. Ini alasan peta jalan menempatkan pelatihan
      penuh setelah tenggat proposal, bukan sebelum.

  perangkat_lunak:
    - 'Python'
    - 'PyTorch'
    - 'Polars dan DuckDB untuk data'
    - 'Format kolumnar untuk penyimpanan'
    - 'Pencatat percobaan sederhana, cukup berkas dan git, tidak perlu platform'

  orang:
    jumlah: 'satu sampai tiga, sesuai aturan lomba'
    pembagian_kalau_bertiga:
      - peran: 'Data dan pembangkit'
        beban: 'terberat di awal'
      - peran: 'Model dan pelatihan'
        beban: 'terberat di tengah'
      - peran: 'Evaluasi, penjelasan, dan penulisan proposal'
        beban: 'terberat di akhir'
    kalau_sendirian: >-
      Lingkup harus dipotong. Ambil kepala K1, K2, dan K5 saja, buang graf dan proses
      titik. Itu masih proposal yang utuh, hanya lebih sempit. Lebih baik tiga kepala
      yang bekerja daripada enam kepala yang tidak selesai.

# =============================================================================
# 16. PETA JALAN
# =============================================================================

peta_jalan:

  kenyataan_waktu: >-
    Hari ini 5 September 2026. Batas unggah proposal 19 September 2026. Empat belas hari.
    Rencana ini jauh lebih besar dari empat belas hari. Jadi yang pertama harus
    diputuskan adalah apa yang wajib ada di proposal, dan apa yang boleh menyusul.

  yang_wajib_ada_di_proposal:
    penjelasan: >-
      Proposal dinilai untuk menentukan siapa yang lolos ke coaching dan hackathon.
      Yang dinilai adalah ketajaman masalah, kelayakan pendekatan, dan bukti bahwa tim
      tahu apa yang dikerjakan. Bukan model yang sudah jadi.
    daftar:
      - 'Perumusan masalah dengan angka yang benar dan bersumber.'
      - 'Pemetaan dua puluh modus ke tiga keluarga mekanisme, termasuk yang tidak terjangkau.'
      - 'Tesis arsitektur, dijelaskan sampai tingkat yang bisa diperiksa.'
      - 'Rencana data yang menunjukkan kami tahu dari mana datanya, termasuk yang belum dipegang.'
      - 'Metrik dan ambang lulus yang ditulis sebelum percobaan.'
      - 'Satu peraga yang berjalan. Sekecil apa pun.'
      - 'Rekomendasi perubahan sistem, terutama P4 dan P2.'
      - 'Batasan yang ditulis terbuka.'
    yang_tidak_wajib:
      - 'Model yang sudah dilatih penuh.'
      - 'Angka hasil evaluasi.'
      - 'Antarmuka.'
      - 'Arsitektur penyajian.'

  fase_0:
    nama: 'Sampai 19 September, menuju proposal'
    hari_1_sampai_2:
      - tugas: 'Ajukan kredensial PhysioNet untuk MIMIC-IV'
        prioritas: 'tertinggi, karena menunggu orang lain'
      - tugas: 'Ajukan permohonan Data Sampel BPJS lewat PPID, dan tanyakan ke panitia apakah boleh dipakai'
        prioritas: 'tinggi, karena menunggu orang lain'
      - tugas: 'Unduh DE-SynPUF ukuran kecil dan periksa strukturnya'
      - tugas: 'Unduh Permenkes 3/2023 dan mulai ekstraksi tabel tarif'
        catatan: 'Ini yang paling berisiko molor. Mulai sekarang.'
    hari_3_sampai_5:
      - tugas: 'Bangun kamus kode dari ICD-10, ICD-9-CM, ATC, dan Fornas'
      - tugas: 'Tulis penokenan episode dan uji pada DE-SynPUF'
      - tugas: 'Tulis pembangkit tahap satu sampai empat, populasi dan penugasan faskes'
    hari_6_sampai_9:
      - tugas: 'Tulis pembangkit tahap lima dan enam, episode klinis dan tarif'
      - tugas: 'Tulis injeksi untuk tiga modus saja, yaitu M04, M05, dan M08'
        alasan: 'Tiga ini mewakili tiga keluarga. Cukup untuk membuktikan gagasannya.'
      - tugas: 'Jalankan uji realisme yang paling murah, yaitu kecocokan agregat'
    hari_10_sampai_12:
      - tugas: 'Latih model kecil pada data kecil sampai rugi turun'
        sasaran: 'Bukan kinerja. Hanya bukti bahwa alurnya berjalan dari ujung ke ujung.'
      - tugas: 'Jalankan kepala K5, yang paling murah, dan hasilkan peraga'
      - tugas: 'Jalankan garis dasar aturan deterministik sebagai pembanding'
    hari_13_sampai_14:
      - tugas: 'Tulis proposal'
      - tugas: 'Periksa seluruh angka, pastikan tidak ada yang tanpa sumber'
      - tugas: 'Unggah, jangan di hari terakhir'
    gerbang_keputusan_fase_0:
      pertanyaan: 'Apakah alurnya berjalan dari klaim sintetis sampai skor, dan apakah peraga K5 menghasilkan sesuatu yang masuk akal.'
      kalau_ya: 'Proposal ditulis dengan lingkup penuh.'
      kalau_tidak: >-
        Proposal ditulis dengan lingkup tiga kepala saja, dan alurnya dijelaskan sebagai
        rencana, bukan sebagai hasil. Jangan mengaku punya yang belum ada.

  fase_1:
    nama: 'Setelah lolos seleksi, sebelum hackathon'
    isi:
      - 'Pembangkit lengkap, tujuh tahap, seluruh modus yang bisa diinjeksikan.'
      - 'Seluruh uji realisme, termasuk latih di sintetis uji di nyata.'
      - 'Pralatih penuh pada DE-SynPUF dan data sintetis.'
    gerbang_keputusan:
      pertanyaan: 'Apakah uji latih di sintetis uji di nyata lulus ambangnya.'
      kalau_tidak: 'Berhenti dan perbaiki pembangkit. Melanjutkan ke model tanpa data yang realistis hanya membuang waktu.'

  fase_2:
    nama: 'Kepala dan kalibrasi'
    isi:
      - 'Enam kepala, dilatih dan diuji satu per satu.'
      - 'Kalibrasi konformal dan verifikasi empiris jaminannya.'
      - 'Peringkat audit.'
      - 'Seluruh garis dasar dan ablasi.'
    gerbang_keputusan:
      pertanyaan: 'Apakah T1 dan T3 tercapai.'
      kalau_tidak: 'Ubah posisi proposal sesuai yang sudah ditulis di target, jangan ubah targetnya.'

  fase_3:
    nama: 'Ketahanan dan keadilan'
    isi:
      - 'Kontrol negatif pada label Medicare yang nyata.'
      - 'Tiga pelaku yang beradaptasi.'
      - 'Uji keadilan antar-kelompok faskes.'
      - 'Uji pergeseran waktu dan entitas.'

  fase_4:
    nama: 'Hackathon'
    isi:
      - 'Penjelasan yang bisa dibaca auditor.'
      - 'Peraga yang bisa dijalankan juri.'
      - 'Ekspor model dan pengukuran waktu tanggap.'
    catatan: >-
      Baru di sini antarmuka dan penyajian masuk. Sebelum ini, semua energi ke model,
      sesuai yang diminta.

  fase_5:
    nama: 'Kalau menang, atau kalau dilanjutkan'
    isi:
      - 'Uji coba di satu kantor cabang dengan data nyata, di bawah perjanjian.'
      - 'Bangun penyimpanan label dari hasil audit, sesuai P4.'
      - 'Jalankan model penantang dan pemantauan pergeseran, sesuai P7.'
    catatan: >-
      Fase ini di luar lomba. Ditulis supaya terlihat bahwa rancangan ini punya jalan
      ke depan, bukan berhenti di demo.

# =============================================================================
# 17. PERTANYAAN JURI YANG DIPERKIRAKAN
# =============================================================================

pertanyaan_juri:

  catatan: >-
    Disusun dengan jawaban singkat, supaya tim tidak perlu berpikir dari nol saat
    ditanya. Sebagian pertanyaan ini sengaja pertanyaan yang menyakitkan.

  daftar:
  - tanya: 'BPJS sudah punya Vidi. Apa bedanya punya kalian.'
    jawab: >-
      Vidi memeriksa apakah klaim memenuhi aturan. Kami memeriksa apakah klaim masuk
      akal. Aturan hanya menangkap modus yang sudah punya nama. Pemodelan kewajaran
      menandai apa pun yang jarang, termasuk yang belum punya nama. Kami menjalankan
      mesin aturan sebagai pembanding, dan melaporkan selisihnya apa adanya.

  - tanya: 'Kalian tidak punya data. Bagaimana bisa yakin modelnya bekerja.'
    jawab: >-
      Tidak yakin, dan itu sebabnya kami menyiapkan tiga uji yang bisa menjatuhkan
      rancangan ini. Yang paling keras adalah menjalankan arsitektur kami pada data
      penyedia Medicare yang nyata, dengan label kecurangan yang nyata dari daftar
      pengecualian pemerintah Amerika. Kalau arsitekturnya tidak bisa menemukan
      kecurangan yang nyata di sana, kami akan menuliskan bahwa tidak bisa.

  - tanya: 'Berapa rupiah yang bisa diselamatkan.'
    jawab: >-
      Kami tidak akan menyebut angka nasional. Yang bisa kami janjikan untuk diukur
      adalah rupiah yang ditemukan per audit, dibandingkan dengan cara memilih audit
      yang dipakai sekarang. NHS melaporkan tiga banding satu. Itu bentuk angka yang
      jujur, dan itu bentuk yang akan kami laporkan.

  - tanya: 'Bagaimana kalau modelnya salah menuduh rumah sakit.'
    jawab: >-
      Model tidak menuduh. Ia melaporkan selisih antara tarif yang ditagih dan tarif
      yang didukung bukti, beserta bukti apa yang kurang. Rumah sakit bisa mengirim
      bukti yang kurang, dan penandaan gugur. Selain itu ambangnya dihitung dengan cara
      yang memberi jaminan matematis pada laju penandaan klaim bersih, dan jaminan itu
      berlaku per kelompok faskes, sehingga rumah sakit kecil tidak ditandai lebih
      sering daripada rumah sakit besar.

  - tanya: 'Kenapa harus dari nol. Kenapa tidak pakai yang sudah ada.'
    jawab: >-
      Tidak ada yang sudah ada. Tidak ada model terlatih yang mengenal INA-CBG,
      Formularium Nasional, dan pola rujukan berjenjang Indonesia. Yang kami pakai dari
      luar hanya operasi tensor dan turunan otomatis. Arsitektur, fungsi rugi, dan
      seluruh prosedur pelatihannya kami tulis. Bagian 10 menuliskan batasnya supaya
      bisa diperiksa.

  - tanya: 'Kenapa transformer. Bukankah pohon berpenguat lebih baik untuk data tabel.'
    jawab: >-
      Sering memang lebih baik, dan kami menjalankannya sebagai pembanding wajib.
      Tapi dua dari tiga keluarga masalah kami bukan tabel. Keluarga B adalah barisan
      kejadian dalam waktu. Keluarga C adalah graf entitas. Pohon tidak bisa
      mengerjakan keduanya. Kalau ternyata pohon menang pada keluarga A, kami akan
      memakai pohon untuk keluarga A dan mengatakannya terus terang.

  - tanya: 'Apa yang paling mungkin gagal.'
    jawab: >-
      Data sintetis kami terlalu mudah, sehingga modelnya terlihat lebih baik dari
      kenyataan. Itu risiko nomor satu di daftar kami, dan empat mekanisme sudah
      disiapkan untuk mendeteksinya.

  - tanya: 'Kalian menyentuh banyak modus. Bukankah aturannya satu kategori.'
    jawab: >-
      Aturannya satu kategori, dan boleh mengangkat lebih dari satu sub-modus di
      dalamnya. Semua yang kami sentuh ada di dalam kategori Fasilitas Kesehatan.
      Dan kami tidak mengaku menyentuh dua puluh. Sepuluh terjangkau sekarang, enam
      sebagian, tiga tidak bisa tanpa perubahan aliran data.

  - tanya: 'Kalau BPJS hanya bisa mengambil satu hal dari proposal ini, apa.'
    jawab: >-
      Tulis hasil setiap audit sebagai catatan terstruktur, apa pun hasilnya. Itu
      hampir tanpa biaya, dan dalam dua tahun ia mengubah seluruh persoalan ini dari
      tanpa label menjadi berlabel. Tanpa itu, setiap sistem deteksi yang dibangun
      siapa pun akan berjalan buta selamanya.

